<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proposta de Orçamento | Bourbon Films</title>
<meta name="theme-color" content="#000000">

<meta name="robots" content="noindex, nofollow">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#080808;--surface:#101010;--white:#E8E4DE;--muted:#6B6560;
  --gold:#F5A020;--orange:#E85C1A;--ember:#8B2800;
  --grad:linear-gradient(90deg,#F5A020,#E85C1A,#8B2800);
  --glass:rgba(255,255,255,.09);--glass-border:rgba(255,255,255,.18);
}
html{scroll-behavior:smooth;overflow-x:hidden}
body{background:var(--ink);color:var(--white);font-family:-apple-system,BlinkMacSystemFont,SF Pro Display,system-ui,Segoe UI,Roboto,Helvetica Neue,Arial,sans-serif;overflow-x:hidden}

body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(rgba(245,160,32,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(245,160,32,.05) 1px,transparent 1px);
  background-size:44px 44px;background-position:center center}
nav,section,footer{position:relative;z-index:1}

nav{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:20px 56px;background:rgba(var(--bgc),.94);backdrop-filter:blur(16px);border-bottom:1px solid var(--glass-border)}
.nav-logo img{height:28px;width:auto;object-fit:contain;display:block}
.pdf-btn{display:flex;align-items:center;gap:8px;padding:10px 20px;border:1px solid rgba(245,160,32,.4);color:var(--gold);background:none;font-family:-apple-system,BlinkMacSystemFont,SF Pro Display,system-ui,Segoe UI,Roboto,Helvetica Neue,Arial,sans-serif;font-size:12px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;transition:border-color,background-color,color,opacity,transform,box-shadow .2s}
.pdf-btn:hover{background:rgba(245,160,32,.1)}
.pdf-btn svg{width:15px;height:15px}

.section{padding:100px 56px}
.eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin-bottom:16px;display:flex;align-items:center;gap:10px}
.eyebrow::before{content:'';width:22px;height:1px;background:var(--gold)}
.big-title{font-family:-apple-system,BlinkMacSystemFont,SF Pro Display,system-ui,Segoe UI,Roboto,Helvetica Neue,Arial,sans-serif;font-size:clamp(30px,4.2vw,54px);font-weight:800;line-height:1.05;letter-spacing:-.01em}
.grad-text{background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent}

#hero-orc{padding:100px 56px 70px;text-align:center;position:relative;overflow:hidden}

#hero-orc h1{position:relative;font-family:-apple-system,BlinkMacSystemFont,SF Pro Display,system-ui,Segoe UI,Roboto,Helvetica Neue,Arial,sans-serif;font-size:clamp(32px,5.5vw,60px);font-weight:800;line-height:1.05;margin-bottom:16px}
#hero-orc .for{position:relative;font-size:16px;color:rgba(var(--fg),.62)}
#hero-orc .for strong{color:var(--white)}
#hero-orc .validade{position:relative;font-size:12px;color:var(--muted);margin-top:10px}

.block{max-width:760px}
.block-tag{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.block-tag::before{content:'';width:20px;height:1px;background:var(--gold)}
.block-body{font-size:16px;color:rgba(var(--fg),.72);line-height:1.85}
.block-body p{margin-bottom:16px}

#invest-sec{background:linear-gradient(to bottom, transparent 0, var(--surface) 140px, var(--surface) calc(100% - 140px), transparent 100%)}
.invest-box{max-width:760px;padding:36px 40px;background:rgba(245,160,32,.06);border:1px solid rgba(245,160,32,.3)}
.invest-value{font-family:-apple-system,BlinkMacSystemFont,SF Pro Display,system-ui,Segoe UI,Roboto,Helvetica Neue,Arial,sans-serif;font-size:clamp(30px,4.5vw,44px);font-weight:800;margin:10px 0 6px}
.invest-extenso{font-size:13px;color:rgba(var(--fg),.62);margin-bottom:18px;font-style:italic}
.invest-cond{font-size:14px;color:rgba(var(--fg),.65);line-height:1.7}
.invest-fiscal{font-size:12px;color:var(--muted);margin-top:14px;padding-top:14px;border-top:1px solid rgba(var(--fg),.08)}

#refs{background:var(--ink)}
.refs-grid{display:flex;flex-wrap:wrap;gap:14px;margin-top:36px}
.ref-card{flex:1 1 220px;padding:24px;background:var(--glass);border:1px solid var(--glass-border);text-decoration:none;color:var(--white);transition:border-color,background-color,color,opacity,transform,box-shadow .2s}
.ref-card:hover{border-color:rgba(245,160,32,.4);background:rgba(245,160,32,.06)}
.ref-name{font-family:-apple-system,BlinkMacSystemFont,SF Pro Display,system-ui,Segoe UI,Roboto,Helvetica Neue,Arial,sans-serif;font-size:16px;font-weight:700;margin-bottom:6px;display:flex;align-items:center;justify-content:space-between}
.ref-name svg{width:14px;height:14px;color:var(--gold);flex-shrink:0}
.ref-desc{font-size:13px;color:var(--muted);line-height:1.5}

#cta-orc{text-align:center;padding:100px 56px}
.foot-actions{max-width:420px;margin:32px auto 0;display:flex;flex-direction:column;gap:12px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;padding:18px 28px;font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;transition:opacity .2s,transform .2s;border:none;cursor:pointer;font-family:-apple-system,BlinkMacSystemFont,SF Pro Display,system-ui,Segoe UI,Roboto,Helvetica Neue,Arial,sans-serif}
.btn.primary{background:var(--grad);color:#000}
.btn.primary:hover{opacity:.85;transform:translateY(-2px)}
.btn.secondary{border:1px solid var(--glass-border);color:var(--white);background:none}
.btn.secondary:hover{border-color:var(--gold);color:var(--gold)}

#empty{max-width:520px;margin:140px auto;text-align:center;padding:0 24px}
#empty h2{font-family:-apple-system,BlinkMacSystemFont,SF Pro Display,system-ui,Segoe UI,Roboto,Helvetica Neue,Arial,sans-serif;font-size:24px;font-weight:800;margin-bottom:12px}
#empty p{font-size:14px;color:var(--muted);line-height:1.7}

footer{padding:40px 56px;text-align:center;border-top:1px solid var(--glass-border)}
footer a{color:var(--gold);text-decoration:none;font-size:13px}

.rev{opacity:0;transform:translateY(28px);transition:opacity .8s,transform .85s cubic-bezier(.16,1,.3,1)}
.rev.vis{opacity:1;transform:translateY(0)}

@media(max-width:900px){
  nav{padding:16px 24px}
  .section,#hero-orc,#cta-orc{padding:56px 24px}
  .invest-box{padding:26px 22px}
}

@media print{
  @page{margin:0;size:A4}
  body{background:#fff !important}
  nav,footer,.foot-actions,#refs,body::before{display:none !important}
  .pdf-doc{display:block !important}
  #hero-orc,.section{display:none !important}
}
.pdf-doc{display:none}



@media (max-width:700px){.calc-table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch}}
/* ajuste visual 2026: mesmo padrão do site */
@media screen{
  :root{--ink:#000000;--surface:#161618;--white:#F5F5F7;--muted:#8A847D;--s:#161618;--s2:#232326;--w:#F5F5F7;--m:#8A847D}
  body{background:var(--ink);-webkit-font-smoothing:antialiased}
  body::before{display:none!important}
  .big-title,h1,h2{letter-spacing:-.025em}
  .btn,.pdf-btn,.hero-cta,.btn-cta,.copy-btn,.gen-btn,.prev-btn,.add-btn,.q-btn,.btn-submit,.btn-wpp,.btn-pdf,.q-skip,#gate-submit-btn{border-radius:999px!important}
  .ref-card,.invest-box,.card,.box,.panel,section .block,.opt,.q-card{border-radius:12px}
  input,select,textarea{border-radius:8px!important}
  .calc-table .item-name{min-width:140px}
  .btn.primary,.q-btn,.btn-submit,.btn-wpp,#gate-submit-btn{background:#F5A020!important;color:#000000!important}
}
</style>
<meta name="color-scheme" content="light dark"><script>try{if(localStorage.getItem("bf-tema")==="escuro")document.documentElement.dataset.theme="dark"}catch(e){}</script>
<style id="bf-tema">
:root{--fg:29,29,31;--bgc:255,255,255;--acc:#A35C00}
:root[data-theme="dark"]{--fg:232,228,222;--bgc:8,8,8;--acc:#F5A020}
:root:not([data-theme="dark"]){--ink:#FFFFFF;--surface:#F5F5F7;--s:#F5F5F7;--s2:#E8E8ED;--white:#1D1D1F;--w:#1D1D1F;--muted:#6E6E73;--m:#6E6E73;--b:rgba(0,0,0,.1);color-scheme:light}
:root:not([data-theme="dark"]) body{background:#FFFFFF;color:#1D1D1F}
:root:not([data-theme="dark"]) img[src*="logo.svg"]{filter:invert(1) brightness(.35)}
:root:not([data-theme="dark"]) input,:root:not([data-theme="dark"]) textarea,:root:not([data-theme="dark"]) select{color:#1D1D1F}
</style>
<style id="bf-premium">
:root,:root[data-theme="dark"]{--fg:245,245,247;--bgc:0,0,0;--acc:#F5A020;--ink:#000000;--surface:#161617;--s:#161617;--s2:#232325;--white:#F5F5F7;--w:#F5F5F7;--muted:#86868B;--m:#86868B;--b:rgba(255,255,255,.1);color-scheme:dark}
body{background:#000!important;color:#F5F5F7}
</style>
<style id="bf-premium2">
h1,h2,.rec-title{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif!important;font-weight:700!important;letter-spacing:-.035em!important;line-height:1.07!important}
.gt{background:none!important;-webkit-text-fill-color:currentColor!important;color:inherit!important}
body *{text-transform:none!important}
body *:not(h1):not(h2):not(.rec-title){letter-spacing:.005em!important}
button,a[class*=btn],[class*=btn]{border-radius:999px!important}
#gate-submit-btn,.q-btn,.btn-submit,.btn.primary{background:#F5A020!important;color:#000!important;font-weight:500!important}
input,textarea,select{border-radius:12px!important}
</style>
<style id="bf-inputs">@media (max-width:900px){input,textarea,select{font-size:16px!important}}</style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">
    <img src="assets/img/logo.svg" alt="Bourbon Films">
  </a>
  <button type="button" class="pdf-btn" id="pdfBtn" style="display:none">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v3a1 1 0 001 1h14a1 1 0 001-1v-3"/></svg>
    Baixar PDF
  </button>
</nav>

<div id="content"></div>

<div class="pdf-doc" id="pdfDoc"></div>

<footer>
  <a href="index.html">bourbonfilms.com.br</a>
</footer>

<style>
.pdf-doc{font-family:-apple-system,BlinkMacSystemFont,SF Pro Display,system-ui,Segoe UI,Roboto,Helvetica Neue,Arial,sans-serif;color:var(--s);background:#fff;width:210mm;min-height:297mm;margin:0 auto;position:relative}
.pdf-header{position:relative;height:150px;background:linear-gradient(120deg,#8B2800 0%,#E85C1A 45%,#F5A020 100%);overflow:hidden}
.pdf-header::before{content:'';position:absolute;top:-60px;right:-60px;width:260px;height:260px;border-radius:50%;background:rgba(0,0,0,.15)}
.pdf-header::after{content:'';position:absolute;bottom:-80px;left:20%;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.08)}
.pdf-titlebox{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.pdf-titlebox h1{font-family:-apple-system,BlinkMacSystemFont,SF Pro Display,system-ui,Segoe UI,Roboto,Helvetica Neue,Arial,sans-serif;font-size:26px;font-weight:800;color:#fff;letter-spacing:.04em;text-transform:uppercase}
.pdf-titlebox h2{font-family:-apple-system,BlinkMacSystemFont,SF Pro Display,system-ui,Segoe UI,Roboto,Helvetica Neue,Arial,sans-serif;font-size:15px;font-weight:700;color:rgba(255,255,255,.9);letter-spacing:.1em;text-transform:uppercase;margin-top:6px}
.pdf-body{padding:34px 46px 20px}
.pdf-section-title{font-family:-apple-system,BlinkMacSystemFont,SF Pro Display,system-ui,Segoe UI,Roboto,Helvetica Neue,Arial,sans-serif;font-size:16px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;color:var(--s);margin-bottom:10px;margin-top:22px}
.pdf-section-title:first-child{margin-top:0}
.pdf-text{font-size:12.5px;line-height:1.7;color:#333}
.pdf-text p{margin-bottom:10px}
.pdf-invest-value{font-size:16px;font-weight:800;color:var(--s)}
.pdf-invest-extenso{font-size:12px;color:#666;font-style:italic}
.pdf-invest-cond{font-size:12px;color:#444;margin-top:8px;line-height:1.6}
.pdf-invest-fiscal{font-size:11.5px;color:#666;margin-top:8px}
.pdf-footer{position:absolute;bottom:0;left:0;right:0;background:#0c0c0c;color:#fff;padding:14px 46px;display:flex;justify-content:space-between;align-items:center;font-size:11px}
.pdf-footer .l{display:flex;gap:18px}
</style>

<script>
function b64DecodeUnicode(str){
  return decodeURIComponent(Array.prototype.map.call(atob(str), c =>
    '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)
  ).join(''));
}
function esc(s){
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}
function nl2p(s){
  if(!s) return '';
  return s.split(/\n{2,}/).map(par => '<p>'+esc(par).replace(/\n/g,'<br>')+'</p>').join('');
}

const params = new URLSearchParams(window.location.search);
const raw = params.get('d');
const content = document.getElementById('content');
const pdfDoc = document.getElementById('pdfDoc');
const pdfBtn = document.getElementById('pdfBtn');

let data = null;
if(raw){
  try{ data = JSON.parse(b64DecodeUnicode(raw)); }catch(e){ data = null; }
}

if(!data){
  content.innerHTML = `
    <div id="empty">
      <h2>Proposta n&atilde;o encontrada</h2>
      <p>Este link n&atilde;o cont&eacute;m uma proposta v&aacute;lida. Confira se copiou o link completo enviado pela Bourbon Films.</p>
    </div>
  `;
} else {
  const wppText = encodeURIComponent('Olá! Vi a proposta "' + (data.projeto||'') + '" e quero conversar sobre ela.');
  const estruturaLabel = data.animacao ? 'Processo de produção' : 'Estrutura de trabalho';

  content.innerHTML = `
    <section id="hero-orc">
      <div class="eyebrow" style="justify-content:center">Proposta de or&ccedil;amento</div>
      <h1>${esc(data.projeto || 'Bourbon Films')}</h1>
      <p class="for">Para <strong>${esc(data.cliente || '')}</strong></p>
      ${data.validade ? `<p class="validade">V&aacute;lida at&eacute; ${esc(data.validade)}</p>` : ''}
    </section>

    ${data.objetivo ? `
    <section class="section rev">
      <div class="block">
        <div class="block-tag">Objetivo</div>
        <div class="block-body">${nl2p(data.objetivo)}</div>
      </div>
    </section>` : ''}

    ${data.estrutura ? `
    <section class="section rev" style="background:linear-gradient(to bottom, transparent 0, var(--surface) 140px, var(--surface) calc(100% - 140px), transparent 100%)">
      <div class="block">
        <div class="block-tag">${estruturaLabel}</div>
        <div class="block-body">${nl2p(data.estrutura)}</div>
      </div>
    </section>` : ''}

    ${data.investimento ? `
    <section id="invest-sec" class="section rev">
      <div class="invest-box">
        <div class="block-tag">Investimento</div>
        <div class="invest-value">${esc(data.investimento)}</div>
        ${data.extenso ? `<div class="invest-extenso">(${esc(data.extenso)})</div>` : ''}
        ${data.condicoes ? `<div class="invest-cond">${esc(data.condicoes)}</div>` : ''}
        <div class="invest-fiscal">O valor apresentado j&aacute; contempla os encargos fiscais da produtora, incluindo emiss&atilde;o de nota fiscal.</div>
      </div>
    </section>` : ''}

    ${data.custos ? `
    <section class="section rev">
      <div class="block">
        <div class="block-tag">Descri&ccedil;&atilde;o de custos</div>
        <div class="block-body">${nl2p(data.custos)}</div>
      </div>
    </section>` : ''}

    ${data.compromisso ? `
    <section class="section rev" style="background:linear-gradient(to bottom, transparent 0, var(--surface) 140px, var(--surface) calc(100% - 140px), transparent 100%)">
      <div class="block">
        <div class="block-tag">Compromisso</div>
        <div class="block-body">${nl2p(data.compromisso)}</div>
      </div>
    </section>` : ''}

    <section id="refs" class="section rev">
      <div class="eyebrow">Conhe&ccedil;a mais</div>
      <h2 class="big-title" style="margin-bottom:8px">Antes de decidir, veja quem somos.</h2>
      <div class="refs-grid">
        <a href="index.html#trabalhos" target="_blank" class="ref-card">
          <div class="ref-name">Portf&oacute;lio <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M7 17L17 7M17 7H7M17 7V17"/></svg></div>
          <div class="ref-desc">Trabalhos reais, por categoria</div>
        </a>
        <a href="bourbon-cultural.html" target="_blank" class="ref-card">
          <div class="ref-name">Bourbon Cultural <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M7 17L17 7M17 7H7M17 7V17"/></svg></div>
          <div class="ref-desc">Nossos projetos documentais</div>
        </a>
        <a href="https://instagram.com/bourbonfilm" target="_blank" class="ref-card">
          <div class="ref-name">Instagram <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M7 17L17 7M17 7H7M17 7V17"/></svg></div>
          <div class="ref-desc">@bourbonfilm</div>
        </a>
      </div>
    </section>

    <section id="cta-orc" class="rev">
      <div class="eyebrow" style="justify-content:center">Vamos em frente?</div>
      <h2 class="big-title">Bora fechar essa hist&oacute;ria.</h2>
      <div class="foot-actions">
        <a href="https://wa.me/5583998683878?text=${wppText}" target="_blank" class="btn primary">Falar sobre esta proposta</a>
        <a href="index.html" class="btn secondary">Conhecer a Bourbon Films</a>
      </div>
    </section>
  `;

  const hoje = new Date();
  const dataFmt = data.dataDoc || (hoje.getDate() + ' de ' + ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'][hoje.getMonth()] + ' de ' + hoje.getFullYear());

  pdfDoc.innerHTML = `
    <div class="pdf-header">
      <div class="pdf-titlebox">
        <h1>Proposta de Or&ccedil;amento</h1>
        <h2>${esc(data.projeto || '')}</h2>
      </div>
    </div>
    <div class="pdf-body">
      ${data.objetivo ? `<div class="pdf-section-title">Objetivo</div><div class="pdf-text">${nl2p(data.objetivo)}</div>` : ''}
      ${data.estrutura ? `<div class="pdf-section-title">${estruturaLabel}</div><div class="pdf-text">${nl2p(data.estrutura)}</div>` : ''}
      ${data.investimento ? `
      <div class="pdf-section-title">Investimento</div>
      <div class="pdf-invest-value">${esc(data.investimento)}${data.extenso ? ' <span class="pdf-invest-extenso">('+esc(data.extenso)+')</span>' : ''}</div>
      ${data.condicoes ? `<div class="pdf-invest-cond">${esc(data.condicoes)}</div>` : ''}
      <div class="pdf-invest-fiscal">O valor apresentado já contempla os encargos fiscais da produtora, incluindo emissão de nota fiscal.</div>
      ` : ''}
      ${data.custos ? `<div class="pdf-section-title">Descri&ccedil;&atilde;o de Custos</div><div class="pdf-text">${nl2p(data.custos)}</div>` : ''}
      ${data.compromisso ? `<div class="pdf-section-title">Compromisso</div><div class="pdf-text">${nl2p(data.compromisso)}</div>` : ''}
    </div>
    <div class="pdf-footer">
      <div class="l"><span>@bourbonfilm</span><span>83 99868-3878</span></div>
      <span>${esc(dataFmt)}</span>
    </div>
  `;

  pdfBtn.style.display = 'flex';
  pdfBtn.addEventListener('click', ()=> window.print());

  const obs=new IntersectionObserver(entries=>entries.forEach(e=>{
    if(e.isIntersecting)e.target.classList.add('vis')
  }),{threshold:.12});
  document.querySelectorAll('.rev').forEach(el=>obs.observe(el));
}
</script>
</body>
</html>
