/* ---------- propostas ---------- */
const ST_PROP = { rascunho: ['Rascunho', 'mute'], enviada: ['Enviada', 'warn'], aceita: ['Aceite registrado', 'ok'], contrato: ['Contrato formalizado', 'ok'], recusada: ['Recusada', 'bad'], expirada: ['Expirada', 'mute'], arquivada: ['Arquivada', 'mute'] };
const pillProposta = (p) => { const s = (p.status === 'enviada' && p.validade && Date.parse(p.validade) < Date.now()) ? 'expirada' : p.status; const x = ST_PROP[s] || ST_PROP.rascunho; return pill(x[0], x[1]); };
modulo({
  id: 'propostas', titulo: 'Propostas', mod: 'crm',
  async render(v, [id, pedidoId]) {
    if (id === 'nova') return editarProposta(v, null, pedidoId);
    if (id) return editarProposta(v, id);
    const lista = (await listar('propostas')).sort((a, b) => tsMs(b.atualizadoEm || b.criadoEm) - tsMs(a.atualizadoEm || a.criadoEm));
    v.innerHTML = `<div class="cc-head"><div><h2>Propostas</h2><p>Cada proposta tem versões, validade e estados separados: criada, enviada, aceite registrado e contrato.</p></div><div class="cc-actions">${edita('crm') ? '<a class="btn btn--primary" href="#/propostas/nova">Nova proposta</a>' : ''}</div></div>
    ${lista.length ? `<div class="cc-table-wrap"><table class="cc-table"><thead><tr><th>Proposta</th><th>Situação</th><th class="cc-num">Valor</th><th>Validade</th><th>Atualizada</th></tr></thead><tbody>${lista.map(p => `<tr data-href="#/propostas/${attr(p._id)}" tabindex="0"><td><b>${esc(p.titulo)}</b><small>${esc(p.cliente || '')} · versão ${(p.versoes || []).length || 1}</small></td><td>${pillProposta(p)}</td><td class="cc-num">${p.valor ? BRL.format(p.valor) : '·'}</td><td class="cc-num">${p.validade ? esc(dia(Date.parse(p.validade))) : '·'}</td><td class="cc-num">${esc(relativo(p.atualizadoEm || p.criadoEm))}</td></tr>`).join('')}</tbody></table></div>`
    : '<div class="cc-empty"><b>Nenhuma proposta ainda.</b>Abra um pedido e clique em Nova proposta, ou crie uma aqui.</div>'}`;
    $$('tr[data-href]', v).forEach(tr => { tr.onclick = () => location.hash = tr.dataset.href; tr.onkeydown = (e) => { if (e.key === 'Enter') location.hash = tr.dataset.href; }; });
  }
});
async function editarProposta(v, id, pedidoId) {
  const lista = await listar('propostas');
  const p = id ? lista.find(x => x._id === id) : null;
  if (id && !p) { v.innerHTML = '<div class="cc-empty"><b>Proposta não encontrada.</b></div>'; return; }
  const peds = (await listar('pedidos')).filter(x => etapaDe(x) !== 'identificado');
  const ped = peds.find(x => x._id === (p?.pedidoId || pedidoId));
  const versoes = p?.versoes || [];
  const ro = !edita('crm');
  const val = new Date(); val.setDate(val.getDate() + 15);
  v.innerHTML = `<div class="cc-head"><div><p class="cc-note">${p ? 'Proposta' : 'Nova proposta'}${ped ? ' · pedido ' + esc(ped._id) : ''}</p><h2>${esc(p?.titulo || (ped ? 'Proposta para ' + nomeLead(ped) : 'Nova proposta'))}</h2></div>${p ? `<div class="cc-actions">${pillProposta(p)}</div>` : ''}</div>
  <div class="cc-cols cc-split">
    <form class="cc-panel cc-form" id="pp" novalidate>
      <div class="cc-field"><label for="pp-t">Título</label><input id="pp-t" required value="${attr(p?.titulo || (ped ? 'Proposta ' + (ped.contato?.empresa || ped.contato?.nome) : ''))}" ${ro ? 'disabled' : ''}></div>
      <div class="cc-f2"><div class="cc-field"><label for="pp-ped">Pedido</label><select id="pp-ped" ${ro ? 'disabled' : ''}><option value="">Sem pedido</option>${peds.map(x => `<option value="${attr(x._id)}" ${(p?.pedidoId || pedidoId) === x._id ? 'selected' : ''}>${esc(nomeLead(x))} · ${esc(x._id)}</option>`).join('')}</select></div>
      <div class="cc-field"><label for="pp-cli">Cliente</label><input id="pp-cli" value="${attr(p?.cliente || (ped ? nomeLead(ped) : ''))}" ${ro ? 'disabled' : ''}></div></div>
      <div class="cc-f2"><div class="cc-field"><label for="pp-val">Validade</label><input id="pp-val" type="date" value="${attr(p?.validade || val.toISOString().slice(0, 10))}" ${ro ? 'disabled' : ''}></div>
      <div class="cc-field"><label for="pp-cond">Condições</label><input id="pp-cond" value="${attr(p?.condicoes || '50% na assinatura, 50% na entrega')}" ${ro ? 'disabled' : ''}></div></div>
      ${ro ? '' : `<details ${p ? '' : 'open'}><summary>${p ? 'Registrar nova versão' : 'Primeira versão'}</summary><div class="cc-form">
        <p class="cc-note">Gere a proposta no <a href="gerar-orcamento.html" target="_blank" rel="noopener">gerador de orçamento</a> (custos, fee e impostos ficam lá) e cole aqui o link e o valor final.</p>
        <div class="cc-f2"><div class="cc-field"><label for="pp-link">Link da proposta</label><input id="pp-link" type="url" inputmode="url" spellcheck="false" placeholder="https://bourbonfilms.com.br/orcamento.html?d=…"></div>
        <div class="cc-field"><label for="pp-v">Valor final</label><input id="pp-v" inputmode="numeric" placeholder="Ex.: 4480"></div></div>
        <div class="cc-field"><label for="pp-nv">O que mudou</label><input id="pp-nv" placeholder="Ex.: incluída cobertura do lançamento"></div></div></details>`}
      <p class="cc-err" id="pp-err" role="alert"></p>
      ${ro ? '' : `<div class="cc-actions"><button class="btn btn--primary" type="submit" id="pp-save">${p ? 'Salvar' : 'Criar proposta'}</button>${p ? '<button class="btn btn--ghost" type="button" id="pp-dup">Duplicar</button><button class="btn btn--danger" type="button" id="pp-del">Excluir</button>' : ''}</div>`}
    </form>
    <div class="cc-grid">
      ${p ? `<section class="cc-panel"><h3>Estado comercial</h3><p class="cc-note" style="margin-bottom:12px">Abrir o link não é aceite. Registre cada passo quando ele acontecer de fato.</p>
        <div class="cc-list">
          <div class="cc-row"><span><b>Criada</b><small>${esc(quando(p.criadoEm))}</small></span>${pill('Feito', 'ok')}</div>
          <div class="cc-row"><span><b>Enviada ao cliente</b><small>${p.enviadaEm ? esc(quando(p.enviadaEm)) + (p.enviadaPor ? ' · ' + esc(p.enviadaPor) : '') : 'Ainda não'}</small></span>${p.enviadaEm ? pill('Feito', 'ok') : (ro ? '' : '<button class="btn btn--ghost btn--sm" type="button" data-passo="enviada">Registrar envio</button>')}</div>
          <div class="cc-row"><span><b>Aceite registrado</b><small>${p.aceiteEm ? esc(quando(p.aceiteEm)) + ' · ' + esc(p.aceiteComo || '') : 'Ainda não'}</small></span>${p.aceiteEm ? pill('Feito', 'ok') : (ro || !p.enviadaEm ? '' : '<button class="btn btn--ghost btn--sm" type="button" data-passo="aceita">Registrar aceite</button>')}</div>
          <div class="cc-row"><span><b>Contrato formalizado</b><small>${p.contratoEm ? esc(quando(p.contratoEm)) : 'Ainda não'}</small></span>${p.contratoEm ? pill('Feito', 'ok') : (ro || !p.aceiteEm ? '' : '<button class="btn btn--ghost btn--sm" type="button" data-passo="contrato">Registrar contrato</button>')}</div>
        </div>
        ${ro || ['aceita', 'contrato', 'recusada'].includes(p.status) ? '' : '<div class="cc-actions" style="margin-top:12px"><button class="btn btn--danger btn--sm" type="button" data-passo="recusada">Marcar como recusada</button></div>'}
      </section>` : ''}
      <section class="cc-panel"><h3>Versões <small>${versoes.length}</small></h3>${versoes.length ? `<ol class="cc-hist">${versoes.slice().reverse().map(x => `<li><time>v${x.n} · ${esc(quando(x.em))} · ${esc((x.por || '').split('@')[0])}</time><b>${x.valor ? BRL.format(x.valor) : 'Sem valor'}</b>${x.nota ? '. ' + esc(x.nota) : ''}${safeUrl(x.link) ? ` · <a href="${attr(safeUrl(x.link))}" target="_blank" rel="noopener">abrir</a>` : ''}</li>`).join('')}</ol>` : '<p class="cc-note">A primeira versão é registrada ao criar.</p>'}</section>
    </div>
  </div>`;
  if (ro) return;
  $('#pp-ped').onchange = (e) => { const x = peds.find(y => y._id === e.target.value); if (x && !$('#pp-cli').value) $('#pp-cli').value = nomeLead(x); };
  $('#pp').onsubmit = async (ev) => {
    ev.preventDefault();
    const titulo = $('#pp-t').value.trim(); if (!titulo) { $('#pp-err').textContent = 'Dê um título.'; return $('#pp-t').focus(); }
    const link = $('#pp-link') ? $('#pp-link').value.trim() : '', valor = $('#pp-v') ? Number(String($('#pp-v').value).replace(/\D/g, '')) : 0;
    if (link && !safeUrl(link)) { $('#pp-err').textContent = 'O link precisa começar com https://'; return $('#pp-link').focus(); }
    const dados = { titulo, pedidoId: $('#pp-ped').value, cliente: $('#pp-cli').value.trim(), validade: $('#pp-val').value, condicoes: $('#pp-cond').value.trim() };
    const nova = (link || valor || !p) ? { n: versoes.length + 1, link: safeUrl(link), valor, nota: $('#pp-nv') ? $('#pp-nv').value.trim() : '', em: S.F.Timestamp.now(), por: S.email } : null;
    if (nova) { dados.versoes = [...versoes, nova]; if (valor) dados.valor = valor; if (nova.link) dados.link = nova.link; }
    if (!p) dados.status = 'rascunho';
    const b = $('#pp-save'); b.disabled = true; b.textContent = 'Salvando…';
    try {
      const nid = await salvarDoc('propostas', p?._id, dados, p ? (nova ? 'nova versão de proposta' : 'editou proposta') : 'criou proposta', titulo);
      if (!p && dados.pedidoId) { const pd = peds.find(x => x._id === dados.pedidoId); if (pd && ['novo', 'em-analise'].includes(etapaDe(pd))) { await S.F.updateDoc(docRef('pedidos', pd._id), { status: 'orcamento', historico: S.F.arrayUnion({ em: S.F.Timestamp.now(), status: 'orcamento', nota: 'Proposta criada: ' + titulo, por: S.email }) }); limparCache('pedidos'); } }
      toast(p ? 'Proposta salva.' : 'Proposta criada.'); ir('propostas/' + nid);
    } catch (er) { falha(er); b.disabled = false; b.textContent = 'Salvar'; }
  };
  $$('[data-passo]', v).forEach(b => b.onclick = async () => {
    const passo = b.dataset.passo; let extra = {};
    const nomes = { enviada: 'Registrar o envio?', aceita: 'Registrar o aceite do cliente?', contrato: 'Registrar o contrato formalizado?', recusada: 'Marcar como recusada?' };
    let como = '';
    if (passo === 'aceita') { como = await confirmar({ titulo: 'Como o cliente aceitou?', texto: 'Fica registrado junto com a data e o seu nome.', campo: 'Ex.: WhatsApp, e-mail, assinatura', ok: 'Registrar aceite' }); if (!como) return; }
    if (passo !== 'aceita' && !(await confirmar({ titulo: nomes[passo], texto: passo === 'enviada' ? 'Use quando a proposta tiver sido enviada por um canal oficial.' : passo === 'recusada' ? 'O pedido ligado também vai para Recusado.' : 'Fica registrado com data, hora e seu nome.', ok: 'Registrar', perigo: passo === 'recusada' }))) return;
    const agora = S.F.serverTimestamp();
    if (passo === 'enviada') extra = { status: 'enviada', enviadaEm: agora, enviadaPor: S.email };
    if (passo === 'aceita') extra = { status: 'aceita', aceiteEm: agora, aceiteComo: como, aceitePor: S.email };
    if (passo === 'contrato') extra = { status: 'contrato', contratoEm: agora };
    if (passo === 'recusada') extra = { status: 'recusada', recusadaEm: agora };
    try {
      await salvarDoc('propostas', p._id, extra, 'proposta ' + passo, p.titulo);
      const mapa = { enviada: 'proposta-enviada', aceita: 'aprovado', contrato: 'aprovado', recusada: 'recusado' };
      if (p.pedidoId && mapa[passo]) { await S.F.updateDoc(docRef('pedidos', p.pedidoId), { status: mapa[passo], historico: S.F.arrayUnion({ em: S.F.Timestamp.now(), status: mapa[passo], nota: 'Proposta: ' + passo, por: S.email }) }).catch(() => {}); limparCache('pedidos'); }
      toast('Registrado.'); atualizarAlertas(); editarProposta(v, p._id);
    } catch (er) { falha(er); }
  });
  if ($('#pp-dup')) $('#pp-dup').onclick = async () => {
    const { _id, criadoEm, atualizadoEm, enviadaEm, aceiteEm, contratoEm, recusadaEm, ...resto } = p;
    try { const nid = await salvarDoc('propostas', null, { ...resto, titulo: p.titulo + ' (cópia)', status: 'rascunho', versoes: (p.versoes || []).slice(-1).map(x => ({ ...x, n: 1 })) }, 'duplicou proposta', p.titulo); toast('Cópia criada.'); ir('propostas/' + nid); } catch (er) { falha(er); }
  };
  if ($('#pp-del')) $('#pp-del').onclick = async () => {
    if (!(await confirmar({ titulo: 'Excluir esta proposta?', texto: 'Uma cópia fica no histórico de versões.', ok: 'Excluir', perigo: true }))) return;
    try { await excluirDoc('propostas', p._id, p.titulo); toast('Proposta excluída.'); ir('propostas'); } catch (er) { falha(er); }
  };
}

/* ---------- clientes: casa + contatos do CRM agrupados por empresa ---------- */
modulo({
  id: 'clientes', titulo: 'Clientes e contatos', mod: 'crm',
  async render(v) {
    const [casa, ped, prop, proj] = await Promise.all([listar('clientes').catch(() => []), listar('pedidos').catch(() => []), listar('propostas').catch(() => []), listar('projetos').catch(() => [])]);
    const mapa = new Map();
    const add = (nome, campo) => { const k = norm(nome); if (!k) return null; if (!mapa.has(k)) mapa.set(k, { nome, pedidos: 0, propostas: 0, aprovados: 0, projetos: 0, casa: false, ultimo: 0 }); const o = mapa.get(k); if (campo) o[campo]++; return o; };
    casa.forEach(c => { const o = add(c.nome); if (o) { o.casa = true; o.especial = c.reconhecimento === 'especial'; o.desde = c.clienteDesde || ''; } });
    ped.filter(p => etapaDe(p) !== 'identificado').forEach(p => { const o = add(nomeLead(p), 'pedidos'); if (o) { o.ultimo = Math.max(o.ultimo, tsMs(p.criadoEm)); if (etapaDe(p) === 'aprovado') o.aprovados++; } });
    prop.forEach(p => add(p.cliente, 'propostas'));
    proj.forEach(p => add(p.clienteNome, 'projetos'));
    const lista = [...mapa.values()].sort((a, b) => (b.pedidos + b.projetos) - (a.pedidos + a.projetos) || a.nome.localeCompare(b.nome));
    v.innerHTML = `<div class="cc-head"><div><h2>Clientes e contatos</h2><p>Histórico por empresa: pedidos, propostas e projetos. Contatos importados não entram em comunicações de marketing sem consentimento registrado.</p></div>
      ${edita('crm') ? '<form class="cc-actions" id="nc"><button class="btn btn--ghost" type="button" id="nc-csv">Importar CSV</button><input id="nc-n" placeholder="Nome do cliente" aria-label="Nome do novo cliente" style="width:220px"><button class="btn btn--primary" type="submit">Adicionar</button></form>' : ''}</div>
      <div class="cc-table-wrap"><table class="cc-table"><thead><tr><th>Cliente</th><th class="cc-num">Pedidos</th><th class="cc-num">Propostas</th><th class="cc-num">Projetos</th><th></th></tr></thead><tbody>${lista.map(c => `<tr data-q="${attr(c.nome)}" tabindex="0"><td><b>${esc(c.nome)}</b><small>${c.casa ? 'Cliente da casa' : 'Chegou pelo comercial'}${c.ultimo ? ' · último pedido ' + esc(relativo(c.ultimo)) : ''}</small></td><td class="cc-num">${c.pedidos}</td><td class="cc-num">${c.propostas}</td><td class="cc-num">${c.projetos}</td><td>${reconhecimento(c)}</td></tr>`).join('')}</tbody></table></div>`;
    $$('tr[data-q]', v).forEach(tr => { tr.onclick = () => { sessionStorage.setItem('cc-crm-f', 'todos'); location.hash = '#/comercial'; setTimeout(() => { const q = $('#crm-q'); if (q) { q.value = tr.dataset.q; q.dispatchEvent(new Event('input')); } }, 300); }; });
    if ($('#nc-csv')) $('#nc-csv').onclick = () => importarContatos(casa);
    if ($('#nc')) $('#nc').onsubmit = async (e) => { e.preventDefault(); const n = $('#nc-n').value.trim(); if (!n) return; try { await salvarDoc('clientes', null, { nome: n, origem: 'casa' }, 'criou cliente', n); toast('Cliente adicionado.'); navegar(); } catch (er) { falha(er); } };
  }
});

/* ---------- área do cliente: projetos que o cliente acompanha ---------- */
const ETAPAS_PROJ = ['Briefing', 'Roteiro', 'Gravação', 'Edição', 'Revisão', 'Entregue'];
modulo({
  id: 'projetos', titulo: 'Projetos', mod: 'operacao',
  async render(v, [id]) {
    if (id) return editarProjeto(v, id === 'novo' ? null : id);
    const lista = (await listar('projetos')).sort((a, b) => tsMs(b.atualizadoEm) - tsMs(a.atualizadoEm));
    v.innerHTML = `<div class="cc-head"><div><h2>Área do cliente</h2><p>O que cada cliente vê em bourbonfilms.com.br/cliente.html: etapa, previsão, recado e entregas.</p></div><div class="cc-actions">${edita('crm') || edita('operacao') ? '<a class="btn btn--primary" href="#/projetos/novo">Novo projeto</a>' : ''}</div></div>
      ${lista.length ? `<div class="cc-list">${lista.map(p => `<a class="cc-row" href="#/projetos/${attr(p._id)}"><span><b>${esc(p.titulo)}</b><small>${esc(p.clienteNome || '')}${p.clienteEmail ? ' · ' + esc(p.clienteEmail) : ' · sem e-mail de acesso'}</small></span>${pill(ETAPAS_PROJ[Number(p.status) || 0], Number(p.status) === 5 ? 'ok' : 'info')}</a>`).join('')}</div>` : '<div class="cc-empty"><b>Nenhum projeto na área do cliente.</b>Crie a partir de um pedido aprovado ou aqui.</div>'}`;
  }
});
async function editarProjeto(v, id) {
  const lista = await listar('projetos');
  let p = id ? lista.find(x => x._id === id) : null;
  if (!p && !id) { try { p = JSON.parse(sessionStorage.getItem('cc-novo-proj') || 'null'); sessionStorage.removeItem('cc-novo-proj'); } catch {} }
  const ro = !(edita('crm') || edita('operacao'));
  const ent = (p?.entregas || []);
  const linha = (f = {}) => `<div class="cc-f3 pj-ent"><input data-k="titulo" placeholder="Nome da entrega" value="${attr(f.titulo || '')}" aria-label="Nome da entrega"><input data-k="url" placeholder="Link do Drive (https://…)" value="${attr(f.url || '')}" aria-label="Link"><input data-k="data" placeholder="Data" value="${attr(f.data || '')}" aria-label="Data"></div>`;
  v.innerHTML = `<div class="cc-head"><div><h2>${id ? 'Editar projeto' : 'Novo projeto'}</h2><p>O cliente entra com o e-mail informado e vê só os próprios projetos.</p></div></div>
  <form class="cc-panel cc-form" id="pj" style="max-width:820px" novalidate>
    <div class="cc-f2"><div class="cc-field"><label for="pj-cli">Cliente</label><input id="pj-cli" value="${attr(p?.clienteNome || '')}" ${ro ? 'disabled' : ''}></div><div class="cc-field"><label for="pj-mail">E-mail de acesso do cliente</label><input id="pj-mail" type="email" spellcheck="false" value="${attr(p?.clienteEmail || '')}" ${ro ? 'disabled' : ''}></div></div>
    <div class="cc-field"><label for="pj-t">Projeto</label><input id="pj-t" value="${attr(p?.titulo || '')}" required ${ro ? 'disabled' : ''}></div>
    <div class="cc-f2"><div class="cc-field"><label for="pj-st">Etapa atual</label><select id="pj-st" ${ro ? 'disabled' : ''}>${ETAPAS_PROJ.map((e, i) => `<option value="${i}" ${Number(p?.status || 0) === i ? 'selected' : ''}>${e}</option>`).join('')}</select></div><div class="cc-field"><label for="pj-pz">Previsão de entrega</label><input id="pj-pz" value="${attr(p?.prazo || '')}" placeholder="Ex.: 15/12/2026" ${ro ? 'disabled' : ''}></div></div>
    <div class="cc-f3"><div class="cc-field"><label for="pj-pd">Prazo acordado</label><input id="pj-pd" type="date" value="${attr(p?.prazoData || '')}" ${ro ? 'disabled' : ''}></div><div class="cc-field"><label for="pj-pr">Prorrogado até <span>se formalizado</span></label><input id="pj-pr" type="date" value="${attr(p?.prorrogadoAte || '')}" ${ro ? 'disabled' : ''}></div><div class="cc-field"><label for="pj-cn">Concluído em</label><input id="pj-cn" type="date" value="${attr(p?.concluidoEm || '')}" ${ro ? 'disabled' : ''}></div></div>
    <div class="cc-field"><label for="pj-obs">Recado para o cliente</label><textarea id="pj-obs" ${ro ? 'disabled' : ''}>${esc(p?.observacao || '')}</textarea></div>
    <div class="cc-field"><span class="cc-label">Entregas</span><div id="pj-ents" class="cc-grid">${(ent.length ? ent : [{}]).map(linha).join('')}</div>${ro ? '' : '<button class="btn btn--ghost btn--sm" type="button" id="pj-add" style="justify-self:start;margin-top:6px">Adicionar entrega</button>'}</div>
    <p class="cc-err" id="pj-err" role="alert"></p>
    ${ro ? '' : `<div class="cc-actions"><button class="btn btn--primary" type="submit" id="pj-save">Salvar projeto</button><a class="btn btn--ghost" href="#/projetos">Cancelar</a>${id ? '<button class="btn btn--danger" type="button" id="pj-del">Excluir</button>' : ''}</div>`}
  </form>`;
  if (ro) return;
  $('#pj-add').onclick = () => $('#pj-ents').insertAdjacentHTML('beforeend', linha());
  $('#pj').onsubmit = async (e) => {
    e.preventDefault();
    const titulo = $('#pj-t').value.trim(); if (!titulo) { $('#pj-err').textContent = 'Dê um nome ao projeto.'; return $('#pj-t').focus(); }
    const entregas = $$('.pj-ent').map(r => { const o = {}; $$('input', r).forEach(i => o[i.dataset.k] = i.value.trim()); return o; }).filter(o => o.url);
    if (entregas.some(o => !safeUrl(o.url))) { $('#pj-err').textContent = 'Os links das entregas precisam começar com https://'; return; }
    const dados = { clienteNome: $('#pj-cli').value.trim(), clienteEmail: $('#pj-mail').value.trim().toLowerCase(), titulo, status: Number($('#pj-st').value), prazo: $('#pj-pz').value.trim(), observacao: $('#pj-obs').value.trim(), entregas, prazoData: $('#pj-pd').value, prorrogadoAte: $('#pj-pr').value, concluidoEm: $('#pj-cn').value };
    if (p?.pedidoId) dados.pedidoId = p.pedidoId;

/* ============ Conteúdo do site: trabalhos, depoimentos, Instagram ============ */
const ST_PUB = { rascunho: ['Rascunho', 'mute'], publicado: ['Publicado', 'ok'], arquivado: ['Arquivado', 'mute'] };
const pillPub = (s) => pill((ST_PUB[s] || ST_PUB.rascunho)[0], (ST_PUB[s] || ST_PUB.rascunho)[1]);
const CATEGORIAS = ['Publicidade', 'Esporte', 'Evento', 'Institucional', 'Documentário', 'Cultural', 'Conteúdo recorrente', 'Político'];
const SERVICOS = ['Direção', 'Roteiro', 'Captação', 'Drone', 'Edição', 'Cor', 'Trilha e som', 'Motion', 'Legendas', 'Fotografia'];
function analisarVideo(url) {
  const u = String(url || '').trim();
  let m = u.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/);
  if (m) return { plataforma: 'youtube', videoId: m[1], vertical: /\/shorts\//.test(u) };
  m = u.match(/vimeo\.com\/(?:video\/)?(\d{5,12})/);
  if (m) return { plataforma: 'vimeo', videoId: m[1], vertical: false };
  return null;
}
async function oembed(info, url) {
  const alvo = info.plataforma === 'youtube' ? `https://www.youtube.com/oembed?format=json&url=${encodeURIComponent('https://www.youtube.com/watch?v=' + info.videoId)}` : `https://vimeo.com/api/oembed.json?url=${encodeURIComponent(url)}`;
  try { const r = await fetch(alvo); if (!r.ok) return { erro: r.status }; return await r.json(); } catch (e) { return { erro: 'rede' }; }
}
const thumbPadrao = (t) => t.plataforma === 'vimeo' ? (t.thumb || '') : `https://i.ytimg.com/vi/${t.videoId}/${t.orientacao === 'vertical' ? 'oardefault' : 'maxresdefault'}.jpg`;
/* um vídeo removido do YouTube devolve uma imagem cinza de 120 px */
function checarThumb(id) { return new Promise(res => { const i = new Image(); i.onload = () => res(i.naturalWidth > 120); i.onerror = () => res(false); i.src = `https://i.ytimg.com/vi/${id}/mqdefault.jpg`; }); }
function cardGaleria(t) {
  const v = t.orientacao === 'vertical';
  return `<ul class="gal${v ? ' gal--v' : ''}" style="grid-template-columns:1fr"><li class="gv${v ? ' gv--v' : ''}"><span class="gv-btn"><span class="gv-img"><img src="${attr(t.thumb || thumbPadrao(t))}" alt="" width="${v ? 360 : 1280}" height="${v ? 640 : 720}"><span class="gv-play" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg></span></span><span class="gv-t">${esc(t.titulo || 'Título do filme')}</span></span></li></ul>`;
}
async function reordenar(colecao, lista, idx, dir) {
  const a = lista[idx], b = lista[idx + dir]; if (!a || !b) return;
  const oa = a.ordem ?? idx, ob = b.ordem ?? (idx + dir);
  await Promise.all([S.F.updateDoc(docRef(colecao, a._id), { ordem: ob }), S.F.updateDoc(docRef(colecao, b._id), { ordem: oa === ob ? oa + dir : oa })]);
  limparCache(colecao); auditar('reordenou', colecao, a.titulo || a.nome || a.autor || a._id);
}
async function lerSitePublico(pagina) {
  const r = await fetch(pagina + (pagina.includes('?') ? '&' : '?') + 'cc=' + Date.now(), { cache: 'no-store' });
  if (!r.ok) throw new Error('Não foi possível ler ' + pagina);
  return new DOMParser().parseFromString(await r.text(), 'text/html');
}

/* histórico de versões com restauração */
async function abrirVersoes(colecao, id, nomeFn) {
  const F = S.F;
  let itens = [];
  try { const snap = await F.getDocs(F.query(col('versoes'), F.where('docId', '==', id))); itens = snap.docs.map(d => ({ ...d.data(), _id: d.id })).filter(x => x.colecao === colecao).sort((a, b) => tsMs(b.em) - tsMs(a.em)); }
  catch (e) { return falha(e); }
  abrirSheet('Versões anteriores', itens.length ? `<p class="cc-note" style="margin-bottom:12px">Cada salvamento guarda como estava antes. Restaurar volta o conteúdo, mantendo a situação atual de publicação.</p><div class="cc-list">${itens.map(x => `<div class="cc-row"><span><b>${esc(nomeFn(x.dados) || 'Sem título')}</b><small>${esc(quando(x.em))} · antes da alteração de ${esc((x.por || '').split('@')[0])}</small></span><button class="btn btn--ghost btn--sm" type="button" data-v="${attr(x._id)}">Restaurar</button></div>`).join('')}</div>` : '<div class="cc-empty"><b>Sem versões anteriores.</b>Elas aparecem a partir da próxima alteração.</div>');
  $$('[data-v]', $('#sheet-body')).forEach(b => b.onclick = async () => {
    const x = itens.find(i => i._id === b.dataset.v); if (!x) return;
    if (!(await confirmar({ titulo: 'Restaurar esta versão?', texto: 'O conteúdo atual vira uma nova versão anterior, então dá para desfazer.', ok: 'Restaurar' }))) return;
    const atual = (S.cache[colecao] || []).find(y => y._id === id) || {};
    const { criadoEm, atualizadoEm, atualizadoPor, ...dados } = x.dados;

/* ============ Marcas e motor de normalização de logotipos ============
   Tudo roda no navegador (canvas), sem servidor e sem custo. O original fica guardado para reprocessar. */
const MAX_ORIGINAL = 400 * 1024;
function ligarDrop(zona, input, cb) {
  if (!zona || !input) return;
  input.addEventListener('change', () => input.files[0] && cb(input.files[0]));
  ['dragenter', 'dragover'].forEach(t => zona.addEventListener(t, e => { e.preventDefault(); zona.classList.add('is-over'); }));
  ['dragleave', 'drop'].forEach(t => zona.addEventListener(t, e => { e.preventDefault(); zona.classList.remove('is-over'); }));
  zona.addEventListener('drop', e => { const f = e.dataTransfer.files[0]; if (f) cb(f); });
}
const lerComoDataURL = (blob) => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(blob); });
function carregarImagem(src) {
  return new Promise((res, rej) => {
    const img = new Image(); img.decoding = 'async';
    img.onload = () => res(img); img.onerror = () => rej(new Error('imagem inválida'));
    if (src instanceof Blob) { const u = URL.createObjectURL(src); img.onload = () => { res(img); setTimeout(() => URL.revokeObjectURL(u), 1000); }; img.src = u; } else img.src = src;
  });
}
function paraWebp(canvas, q = 0.92) {
  const w = canvas.toDataURL('image/webp', q);
  return w.startsWith('data:image/webp') ? w : canvas.toDataURL('image/png');
}

  for (let x = 0; x < W; x += Math.max(1, W / 120 | 0)) { amostra(x, 0); amostra(x, H - 1); }
  for (let y = 0; y < H; y += Math.max(1, H / 120 | 0)) { amostra(0, y); amostra(W - 1, y); }

const MIDIA_MAX = 900 * 1024;
async function otimizarFoto(file, lado = 1920) {
  if (!/^image\/(jpeg|png|webp)$/.test(file.type)) throw new Error('Formato não aceito. Envie JPG, PNG ou WebP.');
  if (file.size > 25e6) throw new Error('Arquivo acima de 25 MB.');
  const img = await carregarImagem(await lerComoDataURL(file));
  const k = Math.min(1, lado / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  let q = 0.84, url = c.toDataURL('image/webp', q);
  while (url.length > MIDIA_MAX * 1.33 && q > 0.45) { q -= 0.08; url = c.toDataURL('image/webp', q); }
  if (url.length > MIDIA_MAX * 1.33) { const c2 = document.createElement('canvas'); c2.width = Math.round(c.width * 0.75); c2.height = Math.round(c.height * 0.75); c2.getContext('2d').drawImage(c, 0, 0, c2.width, c2.height); url = c2.toDataURL('image/webp', 0.72); return { arquivo: url, w: c2.width, h: c2.height }; }
  return { arquivo: url, w: c.width, h: c.height };
}
async function enviarFotos(files, extra = {}) {
  const ids = [], erros = [];
  for (const f of files) {
    try { const o = await otimizarFoto(f); ids.push(await salvarDoc('midia', null, { nome: f.name.replace(/\.[a-z0-9]+$/i, '').slice(0, 80), ...o, legenda: '', credito: '', status: 'privado', ...extra }, 'enviou foto', f.name)); }
    catch (e) { erros.push(f.name + ': ' + (e.message || 'falhou')); }
  }
  if (erros.length) toast('Não enviadas: ' + erros.join('; '), true);
  return ids;
}
const slugar = (t) => norm(t).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 70) || 'materia';

/* seletor de fotos da biblioteca (com envio direto) */
async function escolherFotos({ multiplo = true, selecionadas = [] } = {}) {
  let lista = (await listar('midia')).sort((a, b) => tsMs(b.criadoEm) - tsMs(a.criadoEm));
  const sel = new Set(selecionadas);
  return new Promise((res) => {
    const desenhar = () => { $('#ef-g').innerHTML = lista.map(m => `<li><label class="${sel.has(m._id) ? 'is-sel' : ''}"><input type="${multiplo ? 'checkbox' : 'radio'}" name="ef" value="${attr(m._id)}" ${sel.has(m._id) ? 'checked' : ''}><img src="${attr(m.arquivo)}" alt="${attr(m.legenda || m.nome)}" loading="lazy"></label></li>`).join('') || '<li class="cc-note">Envie fotos para começar.</li>'; };
    abrirSheet(multiplo ? 'Escolher fotos' : 'Escolher foto', `<label class="cc-drop" for="ef-up"><b>Enviar novas fotos</b>JPG, PNG ou WebP. São otimizadas automaticamente.<input type="file" id="ef-up" multiple accept="image/jpeg,image/png,image/webp"></label><p class="cc-note" id="ef-pr" hidden></p><ul class="md-grid md-grid--pick" id="ef-g"></ul>`,
      '<button class="btn btn--ghost" type="button" id="ef-x">Cancelar</button><button class="btn btn--primary" type="button" id="ef-ok">Usar selecionadas</button>');
    desenhar();
    $('#ef-g').onchange = (e) => { const i = e.target; if (!multiplo) sel.clear(); i.checked ? sel.add(i.value) : sel.delete(i.value); desenhar(); };
    $('#ef-up').onchange = async (e) => { const fs = [...e.target.files]; e.target.value = ''; $('#ef-pr').hidden = false; $('#ef-pr').textContent = 'Otimizando…'; const ids = await enviarFotos(fs); $('#ef-pr').hidden = true; lista = (await listar('midia', true)).sort((a, b) => tsMs(b.criadoEm) - tsMs(a.criadoEm)); if (!multiplo) sel.clear(); ids.forEach(i => sel.add(i)); desenhar(); };
    $('#ef-x').onclick = () => { fecharSheet(); res(null); };
    $('#ef-ok').onclick = () => { const ordem = [...selecionadas.filter(i => sel.has(i)), ...[...sel].filter(i => !selecionadas.includes(i))]; fecharSheet(); res(ordem); };
  });
}

const FORMATOS = { '9:16': [1080, 1920, 'Story 9:16'], '1:1': [1080, 1080, 'Quadrado 1:1'], '4:5': [1080, 1350, 'Feed 4:5'], '16:9': [1920, 1080, 'Horizontal 16:9'] };
const MODELOS = { cinema: 'Cinema', moldura: 'Moldura', tipografico: 'Tipográfico' };
let _logo = null;
const logoBourbon = () => _logo || (_logo = carregarImagem('assets/img/logo.svg').catch(() => null));
const FONTE = '-apple-system, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';

function cobrir(g, img, x, y, w, h, zoom = 1, fx = 0.5, fy = 0.5) {
  const k = Math.max(w / img.naturalWidth, h / img.naturalHeight) * zoom, iw = img.naturalWidth * k, ih = img.naturalHeight * k;
  g.save(); g.beginPath(); g.rect(x, y, w, h); g.clip(); g.drawImage(img, x + (w - iw) * fx, y + (h - ih) * fy, iw, ih); g.restore();
}
function grao(g, W, H, a = 0.05) { const n = Math.round(W * H / 900); g.save(); for (let i = 0; i < n; i++) { g.fillStyle = Math.random() > 0.5 ? `rgba(255,255,255,${a})` : `rgba(0,0,0,${a * 1.4})`; g.fillRect(Math.random() * W, Math.random() * H, 1.4, 1.4); } g.restore(); }

  const texto = (txt, px, peso, cor, x, y, larg, lh = 1.08, max = 6) => { g.font = `${peso} ${px}px ${FONTE}`; g.fillStyle = cor; const ls = quebrar(g, txt, larg).slice(0, max); ls.forEach((l, i) => g.fillText(l, x, y + i * px * lh)); return ls.length * px * lh; };

  const tamTit = Math.round((d.titulo || '').length > 48 ? (horiz ? 78 : 84) * u : (horiz ? 96 : 104) * u);
  if (d.modelo === 'moldura' && img) {
    const ph = vert ? H * 0.56 : horiz ? H : H * 0.52, pw = horiz ? W * 0.52 : W - 2 * M, px = horiz ? W - pw : M, py = horiz ? 0 : M * 1.4;
    cobrir(g, img, px, py, pw, horiz ? H : ph, d.zoom, d.fx, d.fy);
    if (!horiz) { g.strokeStyle = 'rgba(255,255,255,.14)'; g.lineWidth = 2 * u; g.strokeRect(px, py, pw, ph); }
    const tx = M, tw = horiz ? W * 0.48 - 2 * M : W - 2 * M; let y = horiz ? H * 0.3 : py + ph + 110 * u;

    if (d.sub) y += texto(d.sub, Math.round(38 * u), 400, 'rgba(255,255,255,.72)', tx, y + 30 * u, tw, 1.3, 4);
    if (d.selo) { g.font = `600 ${Math.round(30 * u)}px ${FONTE}`; const sw = g.measureText(d.selo).width + 56 * u; g.fillStyle = ouro; g.beginPath(); g.roundRect(tx, y + 50 * u, sw, 66 * u, 33 * u); g.fill(); g.fillStyle = '#000'; g.fillText(d.selo, tx + 28 * u, y + 94 * u); }

    const tx = horiz ? W * 0.44 : M, tw = horiz ? W * 0.5 : W - 2 * M; let y = horiz ? H * 0.28 : H * 0.16;
    g.fillStyle = ouro; g.fillRect(tx, y - 60 * u, 64 * u, 4 * u); kick(d.kicker, tx, y);

    if (d.selo) { g.font = `600 ${Math.round(30 * u)}px ${FONTE}`; const sw = g.measureText(d.selo).width + 56 * u; g.strokeStyle = ouro; g.lineWidth = 2 * u; g.beginPath(); g.roundRect(tx, y + 50 * u, sw, 66 * u, 33 * u); g.stroke(); g.fillStyle = ouro; g.fillText(d.selo, tx + 28 * u, y + 94 * u); }

    if (logo) { const lh = 52 * u; g.drawImage(logo, M, M * 0.9, lh * (logo.naturalWidth / logo.naturalHeight || 1.13), lh); }
    const tw = W - 2 * M; g.font = `700 ${tamTit}px ${FONTE}`; const nl = Math.min(4, quebrar(g, d.titulo, tw).length); g.font = `400 ${Math.round(38 * u)}px ${FONTE}`; const ns = d.sub ? Math.min(3, quebrar(g, d.sub, tw).length) : 0;

    if (d.sub) y += texto(d.sub, Math.round(38 * u), 400, 'rgba(255,255,255,.8)', M, y + 50 * u, tw, 1.3, 3);
    if (d.selo) { g.font = `600 ${Math.round(30 * u)}px ${FONTE}`; const sw = g.measureText(d.selo).width + 56 * u; g.fillStyle = ouro; g.beginPath(); g.roundRect(M, y + 50 * u, sw, 66 * u, 33 * u); g.fill(); g.fillStyle = '#000'; g.fillText(d.selo, M + 28 * u, y + 94 * u); }

/* retenção: resume meses antigos em "resumos" e apaga os eventos brutos */
async function consolidarEventos() {
  const corte = new Date(); corte.setMonth(corte.getMonth() - 13); corte.setDate(1); corte.setHours(0, 0, 0, 0);
  if (!(await confirmar({ titulo: 'Consolidar eventos antigos?', texto: `Eventos anteriores a ${dia(corte.getTime())} viram totais mensais (visitas, sessões, canais, páginas) e os registros individuais são apagados. Os totais continuam nos relatórios de longo prazo.`, ok: 'Consolidar', perigo: true }))) return;
  try {
    const sn = await S.F.getDocs(S.F.query(col('eventos'), S.F.where('em', '<', S.F.Timestamp.fromDate(corte)), S.F.limit(5000)));
    if (!sn.size) return toast('Nada com mais de 13 meses.');
    const meses = {};
    sn.docs.forEach(d => { const e = d.data(), k = String(e.dia || '').slice(0, 7) || 'sem-data', m = meses[k] = meses[k] || { views: 0, sessoes: new Set(), internos: 0, canais: {}, paginas: {}, envios: 0 };
      if (e.i) { m.internos++; return; } if (e.t === 'view') { m.views++; m.sessoes.add(e.s); m.canais[e.c || 'desconhecida'] = (m.canais[e.c || 'desconhecida'] || 0) + 1; m.paginas[e.p] = (m.paginas[e.p] || 0) + 1; } if (e.t === 'envio') m.envios++; });
    for (const [k, m] of Object.entries(meses)) {
      const ref = docRef('resumos', k), at = await S.F.getDoc(ref), a = at.exists() ? at.data() : {};
      const soma = (x = {}, y = {}) => { const o = { ...x }; Object.entries(y).forEach(([c, n]) => o[c] = (o[c] || 0) + n); return o; };
      await S.F.setDoc(ref, { mes: k, views: (a.views || 0) + m.views, sessoes: (a.sessoes || 0) + m.sessoes.size, internos: (a.internos || 0) + m.internos, envios: (a.envios || 0) + m.envios, canais: soma(a.canais, m.canais), paginas: soma(a.paginas, m.paginas), atualizadoEm: S.F.serverTimestamp() });
    }
    for (let i = 0; i < sn.docs.length; i += 400) { const lote = S.F.writeBatch(S.db); sn.docs.slice(i, i + 400).forEach(d => lote.delete(d.ref)); await lote.commit(); }
    auditar('consolidou eventos', 'eventos', String(sn.size)); toast(`${sn.size} eventos consolidados.`); navegar();
  } catch (e) { falha(e); }
}

/* ---------- importação de contatos (CSV) com detecção de duplicidade ---------- */
function lerCSV(txt) {
  const sep = (txt.split('\n')[0].match(/;/g) || []).length > (txt.split('\n')[0].match(/,/g) || []).length ? ';' : ',';
  const linhas = []; let campo = '', linha = [], aspas = false;
  for (let i = 0; i < txt.length; i++) { const ch = txt[i];
    if (aspas) { if (ch === '"' && txt[i + 1] === '"') { campo += '"'; i++; } else if (ch === '"') aspas = false; else campo += ch; }
    else if (ch === '"') aspas = true; else if (ch === sep) { linha.push(campo); campo = ''; } else if (ch === '\n' || ch === '\r') { if (ch === '\r' && txt[i + 1] === '\n') i++; linha.push(campo); linhas.push(linha); linha = []; campo = ''; } else campo += ch; }
  if (campo || linha.length) { linha.push(campo); linhas.push(linha); }
  return linhas.filter(l => l.some(c => c.trim()));
}
async function importarContatos(existentes) {
  abrirSheet('Importar contatos', `<p class="cc-note" style="margin-bottom:12px">CSV ou planilha exportada como CSV, com cabeçalho. Colunas reconhecidas: nome, empresa, email, telefone ou whatsapp, origem, consentimento (sim ou não). Só quem tiver "sim" entra como apto a receber comunicações.</p>
    <label class="cc-drop" for="ic-f"><b>Escolher arquivo CSV</b><input type="file" id="ic-f" accept=".csv,text/csv"></label><div id="ic-r"></div>`, '<button class="btn btn--ghost" type="button" id="ic-x">Cancelar</button><button class="btn btn--primary" type="button" id="ic-ok" disabled>Importar</button>');
  $('#ic-x').onclick = fecharSheet; let novos = [];
  $('#ic-f').onchange = async (e) => {
    const f = e.target.files[0]; if (!f) return; if (f.size > 3e6) return toast('Arquivo acima de 3 MB.', true);
    const l = lerCSV(await f.text()); if (l.length < 2) return toast('Não encontrei linhas no arquivo.', true);
    const cab = l[0].map(h => norm(h)); const col = (...ns) => cab.findIndex(h => ns.some(n => h.includes(n)));
    const iN = col('nome', 'name', 'contato'), iE = col('empresa', 'company', 'organiz'), iM = col('email', 'e-mail'), iT = col('whats', 'telefone', 'celular', 'phone', 'fone'), iO = col('origem', 'source', 'canal'), iC = col('consent', 'aceita', 'marketing', 'opt');
    if (iN < 0 && iE < 0) return toast('O arquivo precisa de uma coluna "nome" ou "empresa".', true);
    const tel = (t) => String(t || '').replace(/\D/g, '').replace(/^55(?=\d{10,11}$)/, '');
    const chaves = new Set(); existentes.forEach(c => { if (c.email) chaves.add('e:' + norm(c.email)); if (c.whatsapp) chaves.add('t:' + tel(c.whatsapp)); chaves.add('n:' + norm(c.nome) + '|' + norm(c.empresa || '')); });
    const rel = { ok: 0, dup: 0, vazio: 0 }; novos = [];
    l.slice(1).forEach(r => {
      const g = (i) => i >= 0 ? String(r[i] || '').trim() : '';
      const c = { nome: g(iN) || g(iE), empresa: g(iE), email: g(iM).toLowerCase(), whatsapp: g(iT), origemContato: g(iO) || 'importação' };
      if (!c.nome) { rel.vazio++; return; }
      if (c.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(c.email)) c.email = '';
      const ks = [c.email && 'e:' + norm(c.email), c.whatsapp && tel(c.whatsapp).length >= 10 && 't:' + tel(c.whatsapp), 'n:' + norm(c.nome) + '|' + norm(c.empresa)].filter(Boolean);
      if (ks.some(k => chaves.has(k))) { rel.dup++; return; } ks.forEach(k => chaves.add(k));
      const sim = /^(s|sim|yes|y|1|true|x)$/i.test(g(iC));
      novos.push({ ...c, origem: 'importacao', marketing: sim ? { consentiu: true, fonte: 'importação de ' + f.name.slice(0, 60), registradoEm: new Date().toISOString().slice(0, 10) } : { consentiu: false } }); rel.ok++;
    });
    $('#ic-r').innerHTML = `<dl class="cc-analysis" style="margin-top:12px"><div><dt>Novos</dt><dd>${rel.ok}</dd></div><div><dt>Já existiam</dt><dd>${rel.dup}</dd></div><div><dt>Sem nome</dt><dd>${rel.vazio}</dd></div><div><dt>Com consentimento</dt><dd>${novos.filter(n => n.marketing.consentiu).length}</dd></div></dl>
      ${novos.length ? `<div class="cc-list" style="margin-top:10px">${novos.slice(0, 8).map(n => `<div class="cc-row"><span><b>${esc(n.nome)}</b><small>${esc([n.empresa, n.email, n.whatsapp].filter(Boolean).join(' · '))}</small></span></div>`).join('')}${novos.length > 8 ? `<p class="cc-note">e mais ${novos.length - 8}</p>` : ''}</div>` : ''}`;
    $('#ic-ok').disabled = !novos.length;
  };
  $('#ic-ok').onclick = async () => {
    if (!(await confirmar({ titulo: `Importar ${novos.length} contatos?`, texto: 'Entram como contatos comerciais. Duplicados foram ignorados.', ok: 'Importar' }))) return;
    try { for (let i = 0; i < novos.length; i += 400) { const lote = S.F.writeBatch(S.db); novos.slice(i, i + 400).forEach(n => lote.set(S.F.doc(col('clientes')), { ...n, criadoEm: S.F.serverTimestamp(), criadoPor: S.email })); await lote.commit(); }
      limparCache('clientes'); auditar('importou contatos', 'clientes', String(novos.length)); fecharSheet(); toast(`${novos.length} contatos importados.`); navegar(); } catch (e) { falha(e); }
  };
}

/* ---------- Entregas, pontualidade e encerramento ---------- */
function pontualidade(p) {
  const lim = p.prorrogadoAte || p.prazoData, fim = p.concluidoEm;
  if (!lim || !fim) return null;
  if (fim < lim) return { k: 'antes', t: 'Antes do prazo', tom: 'ok' };
  if (fim === lim) return { k: 'dentro', t: 'Dentro do prazo', tom: 'ok' };
  return { k: 'apos', t: 'Após o prazo', tom: 'warn' };
}
modulo({

    if (id) { const p = projs.find(x => x._id === id); if (!p) { v.innerHTML = '<div class="cc-empty"><b>Projeto não encontrado.</b></div>'; return; } return extra === 'cartao' ? cartaoEntrega(v, p) : encerramento(v, p); }
    v.innerHTML = `<div class="cc-head"><div><h2>Entregas</h2><p>Arquivos finais que o cliente acessa na área do cliente, prazos e encerramento de cada projeto.</p></div></div>

      <p class="cc-note" style="margin-top:14px">Os arquivos ficam no Drive, Frame.io ou WeTransfer, com link privado. Armazenar vídeo aqui exigiria um plano pago de armazenamento; o caminho está descrito no relatório.</p>`;

  $('#en-cp').onclick = () => navigator.clipboard.writeText($('#en-msg').value).then(() => toast('Mensagem copiada.'), () => $('#en-msg').select());

async function cartaoEntrega(v, p) {

  await editorDePeca(v, { titulo: 'Cartão de entrega', intro: `Peça 1080 × 1080 para o WhatsApp. ${pt ? 'Selo calculado a partir dos prazos registrados.' : 'Sem prazo e conclusão registrados, o cartão sai sem selo de pontualidade.'}`, formatos: ['1:1'],
    dados: { fmt: '1:1', modelo: 'tipografico', kicker: 'Entrega concluída', titulo: p.titulo, sub: [p.clienteNome, fim ? `Concluído em ${fim}` : '', lim ? `Prazo ${p.prorrogadoAte ? 'prorrogado' : 'acordado'}: ${lim}` : '', 'Obrigado pela confiança.'].filter(Boolean).join('\n'), selo: pt && pt.k !== 'apos' ? pt.t : '' } });
}

modulo({
  id: 'saude', titulo: 'Saúde do site', mod: 'conteudo',
  async render(v) {
    v.innerHTML = `<div class="cc-head"><div><h2>Saúde do site</h2><p>Confere páginas, imagens, arquivos pesados e vídeos do portfólio. Roda no seu navegador, a partir do site publicado.</p></div><div class="cc-actions"><button class="btn btn--primary" id="sd-run" type="button">Verificar agora</button></div></div><div id="sd-out"><div class="cc-empty"><b>Nenhuma verificação nesta sessão.</b>Leva menos de um minuto.</div></div>`;
    $('#sd-run').onclick = async () => {
      const b = $('#sd-run'); b.disabled = true; b.textContent = 'Verificando…';
      const out = $('#sd-out'), res = [];
      const vistos = new Set();
      for (const pg of PAGINAS) {
        let d; try { const r = await fetch(pg + '?cc=' + Date.now(), { cache: 'no-store' }); if (!r.ok) { res.push(['bad', pg, `Página responde ${r.status}`]); continue; } d = new DOMParser().parseFromString(await r.text(), 'text/html'); } catch { res.push(['bad', pg, 'Página não abriu']); continue; }
        d.querySelectorAll('img[src]').forEach(im => { if (!im.getAttribute('alt') && im.getAttribute('alt') !== '') res.push(['warn', pg, 'Imagem sem texto alternativo: ' + im.getAttribute('src').slice(0, 60)]); });
        const recursos = [...d.querySelectorAll('img[src],link[rel=stylesheet][href],script[src]')].map(e => e.getAttribute('src') || e.getAttribute('href')).filter(u => u && !/^(https?:|data:|\/\/)/.test(u)).map(u => u.split('?')[0]);
        for (const u of recursos) {
          if (vistos.has(u)) continue; vistos.add(u);
          try { const r = await fetch(u, { method: 'HEAD', cache: 'no-store' }); if (!r.ok) res.push(['bad', pg, `Arquivo não encontrado: ${u}`]); else { const n = Number(r.headers.get('content-length') || 0); if (n > 600 * 1024 && /\.(png|jpe?g|webp|gif)$/i.test(u)) res.push(['warn', pg, `Imagem pesada (${Math.round(n / 1024)} KB): ${u}`]); } } catch { res.push(['bad', pg, 'Falha ao conferir ' + u]); }
        }
      }
      try {
        const tr = (await listar('trabalhos', true)).filter(t => t.status === 'publicado' && t.plataforma !== 'vimeo');
        for (const t of tr) if (!(await checarThumb(t.videoId))) res.push(['bad', 'Portfólio', `Vídeo indisponível no YouTube: ${t.titulo}`]);
        const mk = (await listar('marcas', true)).filter(m => m.status === 'publicado');
        mk.forEach(m => { if ((m.arquivo || '').length > 250e3) res.push(['warn', 'Marcas', `Logo pesado (${Math.round(m.arquivo.length * .75 / 1024)} KB): ${m.nome}`]); if (m.w / Math.max(1, m.hpx) > 7) res.push(['warn', 'Marcas', `Logo muito largo, aparece baixo: ${m.nome}`]); });
      } catch {}
      auditar('verificou saúde do site', 'site', res.length + ' avisos');
      out.innerHTML = `<dl class="cc-kpis"><div class="cc-kpi"><dt>Páginas</dt><dd>${PAGINAS.length}</dd></div><div class="cc-kpi"><dt>Arquivos conferidos</dt><dd>${vistos.size}</dd></div><div class="cc-kpi"><dt>Problemas</dt><dd>${res.filter(r => r[0] === 'bad').length}</dd></div><div class="cc-kpi"><dt>Avisos</dt><dd>${res.filter(r => r[0] === 'warn').length}</dd></div></dl>
      ${res.length ? `<div class="cc-alerts">${res.map(r => `<div class="cc-alert is-${r[0]}"><span>${esc(r[2])}<small>${esc(r[1])}</small></span></div>`).join('')}</div>` : '<div class="cc-empty"><b>Nada encontrado.</b>Páginas, arquivos e vídeos responderam normalmente.</div>'}`;
      b.disabled = false; b.textContent = 'Verificar de novo';
    };
  }
});

    const form = (m) => {

      const mods = m?.modulos || null;
      abrirSheet(novo ? 'Convidar pessoa' : (m.nome || m._id), `<form class="cc-form" id="eqf" novalidate>
        ${novo ? '<div class="cc-field"><label for="eq-e">E-mail da conta Google</label><input id="eq-e" type="email" spellcheck="false" autocomplete="off" placeholder="nome@gmail.com"></div>' : `<p class="cc-note">${esc(m._id)}${m.aceitoEm ? ' · entrou pela primeira vez ' + esc(quando(m.aceitoEm)) : ''}</p>`}
        <div class="cc-field"><label for="eq-n">Nome</label><input id="eq-n" value="${attr(m?.nome || '')}" autocomplete="off"></div>
        <div class="cc-field"><label for="eq-p">Papel</label><select id="eq-p">${papeisGeriveis.map(p => `<option value="${p}" ${m?.papel === p ? 'selected' : ''}>${esc(PAPEIS[p].nome)}</option>`).join('')}</select></div>
        <details ${mods ? 'open' : ''}><summary>Permissões específicas</summary><div class="cc-form"><p class="cc-note">Marque só se quiser fugir do padrão do papel.</p><label class="cc-check"><input type="checkbox" id="eq-custom" ${mods ? 'checked' : ''}>Usar permissões específicas</label><div class="cc-chips" id="eq-mods">${Object.entries(MOD_NOMES).filter(([k]) => souOwner || !['equipe', 'auditoria', 'config'].includes(k)).map(([k, n]) => `<label><input type="checkbox" value="${k}" ${(mods || PAPEIS[m?.papel || 'editor'].mods).includes(k) ? 'checked' : ''}><span>${esc(n)}</span></label>`).join('')}</div></div></details>

      const coletar = () => { const custom = $('#eq-custom').checked; return { nome: $('#eq-n').value.trim(), papel: $('#eq-p').value, modulos: custom ? $$('#eq-mods input:checked').map(i => i.value) : null }; };
      const expira = () => S.F.Timestamp.fromMillis(Date.now() + 7 * 864e5);

            await S.F.setDoc(docRef('equipe', e), { email: e, nome: x.nome, papel: x.papel, modulos: x.modulos, status: 'convidado', convidadoPor: S.email, convidadoEm: S.F.serverTimestamp(), expiraEm: expira() });
            auditar('convidou', 'equipe/' + e, x.papel);
            fecharSheet(); limparCache('equipe');

            $('#eq-cp').onclick = () => { navigator.clipboard.writeText(msg).then(() => toast('Copiado.'), () => { $('#eq-msg').select(); }); };
          } else {
            if (x.papel !== m.papel && !(await confirmar({ titulo: 'Alterar o papel?', texto: `${m.nome || m._id} passa de ${PAPEIS[m.papel]?.nome} para ${PAPEIS[x.papel].nome}. Vale a partir da próxima ação.`, ok: 'Alterar' }))) return;
            await S.F.updateDoc(docRef('equipe', m._id), { nome: x.nome, papel: x.papel, modulos: x.modulos });

            fecharSheet(); limparCache('equipe'); toast('Acesso atualizado.'); navegar();
          }
        } catch (er) { falha(er); }
      };
      if (novo) return;
      const muda = async (dados, acao, titulo, texto, perigo = false) => { if (!(await confirmar({ titulo, texto, ok: 'Confirmar', perigo }))) return; try { await S.F.updateDoc(docRef('equipe', m._id), dados); auditar(acao, 'equipe/' + m._id); fecharSheet(); limparCache('equipe'); toast('Feito.'); navegar(); } catch (er) { falha(er); } };

      if ($('#eq-reat')) $('#eq-reat').onclick = () => muda({ status: 'ativo' }, 'reativou acesso', 'Reativar acesso?', 'A pessoa volta a acessar com o mesmo papel.');

      $('#eq-rev').onclick = async () => {

    $$('[data-m]', v).forEach(b => b.onclick = () => edita('equipe') ? form(lista.find(m => m._id === b.dataset.m)) : null);
  }

      ${S.papel === 'owner' ? `<section class="cc-panel"><h3>Limpeza prevista na privacidade</h3><p class="cc-note" style="margin-bottom:12px">A política do site diz que pedidos que não viram projeto são apagados em até 12 meses. Isto apaga pedidos recusados, arquivados ou sem briefing com mais de 12 meses.</p><button class="btn btn--danger" type="button" id="lp">Apagar pedidos antigos</button></section>` : ''}</div>`;
    $('#bk').onclick = async () => {
      const b = $('#bk'); b.disabled = true; b.textContent = 'Exportando…'; const out = { exportadoEm: new Date().toISOString(), por: S.email };
      for (const c of cols) { try { out[c] = await listar(c, true); } catch { out[c] = 'sem permissão'; } }
      const blob = new Blob([JSON.stringify(out, (k, v2) => (v2 && v2.toMillis) ? new Date(v2.toMillis()).toISOString() : v2, 2)], { type: 'application/json' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `bourbon-backup-${new Date().toISOString().slice(0, 10)}.json`; a.click();
      auditar('exportou backup', 'dados'); b.disabled = false; b.textContent = 'Baixar backup completo';
    };
    if ($('#lp')) $('#lp').onclick = async () => {
      const lim = Date.now() - 365 * 864e5;
      const velhos = (await listar('pedidos', true)).filter(p => ['recusado', 'arquivado', 'identificado'].includes(etapaDe(p)) && tsMs(p.criadoEm) < lim);
      if (!velhos.length) return toast('Nenhum pedido com mais de 12 meses para apagar.');
      if (!(await confirmar({ titulo: `Apagar ${velhos.length} pedidos antigos?`, texto: 'Não dá para desfazer. Exporte um backup antes se precisar.', ok: 'Apagar', perigo: true, digitar: 'APAGAR' }))) return;
      try { for (const p of velhos) await S.F.deleteDoc(docRef('pedidos', p._id)); limparCache('pedidos'); auditar('apagou pedidos antigos', 'pedidos', String(velhos.length)); toast('Pedidos apagados.'); } catch (e) { falha(e); }
    };
  }
});

iniciar();

</script>
</body>
</html>
