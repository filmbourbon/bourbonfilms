/* ---------- clientes: casa + contatos do CRM agrupados por empresa ---------- */
modulo({
  id: 'clientes', titulo: 'Clientes', mod: 'crm',
  async render(v) {
    const [casa, ped, prop, proj] = await Promise.all([listar('clientes').catch(() => []), listar('pedidos').catch(() => []), listar('propostas').catch(() => []), listar('projetos').catch(() => [])]);
    const mapa = new Map();
    const add = (nome, campo) => { const k = norm(nome); if (!k) return null; if (!mapa.has(k)) mapa.set(k, { nome, pedidos: 0, propostas: 0, aprovados: 0, projetos: 0, casa: false, ultimo: 0 }); const o = mapa.get(k); if (campo) o[campo]++; return o; };
    casa.forEach(c => { const o = add(c.nome); if (o) o.casa = true; });
    ped.filter(p => etapaDe(p) !== 'identificado').forEach(p => { const o = add(nomeLead(p), 'pedidos'); if (o) { o.ultimo = Math.max(o.ultimo, tsMs(p.criadoEm)); if (etapaDe(p) === 'aprovado') o.aprovados++; } });
    prop.forEach(p => add(p.cliente, 'propostas'));
    proj.forEach(p => add(p.clienteNome, 'projetos'));
    const lista = [...mapa.values()].sort((a, b) => (b.pedidos + b.projetos) - (a.pedidos + a.projetos) || a.nome.localeCompare(b.nome));
    v.innerHTML = `<div class="cc-head"><div><h2>Clientes</h2><p>Histórico por empresa: pedidos, propostas e projetos. Quem tem mais de um trabalho aparece como recorrente.</p></div>
      ${edita('crm') ? '<form class="cc-actions" id="nc"><input id="nc-n" placeholder="Nome do cliente" aria-label="Nome do novo cliente" style="width:220px"><button class="btn btn--primary" type="submit">Adicionar</button></form>' : ''}</div>
      <div class="cc-table-wrap"><table class="cc-table"><thead><tr><th>Cliente</th><th class="cc-num">Pedidos</th><th class="cc-num">Propostas</th><th class="cc-num">Projetos</th><th></th></tr></thead><tbody>${lista.map(c => `<tr data-q="${attr(c.nome)}" tabindex="0"><td><b>${esc(c.nome)}</b><small>${c.casa ? 'Cliente da casa' : 'Chegou pelo comercial'}${c.ultimo ? ' · último pedido ' + esc(relativo(c.ultimo)) : ''}</small></td><td class="cc-num">${c.pedidos}</td><td class="cc-num">${c.propostas}</td><td class="cc-num">${c.projetos}</td><td>${(c.aprovados + c.projetos) > 1 ? pill('Recorrente', 'gold') : ''}</td></tr>`).join('')}</tbody></table></div>`;
    $$('tr[data-q]', v).forEach(tr => { tr.onclick = () => { sessionStorage.setItem('cc-crm-f', 'todos'); location.hash = '#/comercial'; setTimeout(() => { const q = $('#crm-q'); if (q) { q.value = tr.dataset.q; q.dispatchEvent(new Event('input')); } }, 300); }; });
    if ($('#nc')) $('#nc').onsubmit = async (e) => { e.preventDefault(); const n = $('#nc-n').value.trim(); if (!n) return; try { await salvarDoc('clientes', null, { nome: n, origem: 'casa' }, 'criou cliente', n); toast('Cliente adicionado.'); navegar(); } catch (er) { falha(er); } };
  }
});

/* ---------- área do cliente: projetos que o cliente acompanha ---------- */
const ETAPAS_PROJ = ['Briefing', 'Roteiro', 'Gravação', 'Edição', 'Revisão', 'Entregue'];
modulo({
  id: 'projetos', titulo: 'Área do cliente', mod: 'crm',
  async render(v, [id]) {
    if (id) return editarProjeto(v, id === 'novo' ? null : id);
    const lista = (await listar('projetos')).sort((a, b) => tsMs(b.atualizadoEm) - tsMs(a.atualizadoEm));
    v.innerHTML = `<div class="cc-head"><div><h2>Área do cliente</h2><p>O que cada cliente vê em bourbonfilms.com.br/cliente.html: etapa, previsão, recado e entregas.</p></div><div class="cc-actions">${edita('crm') ? '<a class="btn btn--primary" href="#/projetos/novo">Novo projeto</a>' : ''}</div></div>
      ${lista.length ? `<div class="cc-list">${lista.map(p => `<a class="cc-row" href="#/projetos/${attr(p._id)}"><span><b>${esc(p.titulo)}</b><small>${esc(p.clienteNome || '')}${p.clienteEmail ? ' · ' + esc(p.clienteEmail) : ' · sem e-mail de acesso'}</small></span>${pill(ETAPAS_PROJ[Number(p.status) || 0], Number(p.status) === 5 ? 'ok' : 'info')}</a>`).join('')}</div>` : '<div class="cc-empty"><b>Nenhum projeto na área do cliente.</b>Crie a partir de um pedido aprovado ou aqui.</div>'}`;
  }
});
async function editarProjeto(v, id) {
  const lista = await listar('projetos');
  let p = id ? lista.find(x => x._id === id) : null;
  if (!p && !id) { try { p = JSON.parse(sessionStorage.getItem('cc-novo-proj') || 'null'); sessionStorage.removeItem('cc-novo-proj'); } catch {} }
  const ro = !edita('crm');
  const ent = (p?.entregas || []);
  const linha = (f = {}) => `<div class="cc-f3 pj-ent"><input data-k="titulo" placeholder="Nome da entrega" value="${attr(f.titulo || '')}" aria-label="Nome da entrega"><input data-k="url" placeholder="Link do Drive (https://…)" value="${attr(f.url || '')}" aria-label="Link"><input data-k="data" placeholder="Data" value="${attr(f.data || '')}" aria-label="Data"></div>`;
  v.innerHTML = `<div class="cc-head"><div><h2>${id ? 'Editar projeto' : 'Novo projeto'}</h2><p>O cliente entra com o e-mail informado e vê só os próprios projetos.</p></div></div>
  <form class="cc-panel cc-form" id="pj" style="max-width:820px" novalidate>
    <div class="cc-f2"><div class="cc-field"><label for="pj-cli">Cliente</label><input id="pj-cli" value="${attr(p?.clienteNome || '')}" ${ro ? 'disabled' : ''}></div><div class="cc-field"><label for="pj-mail">E-mail de acesso do cliente</label><input id="pj-mail" type="email" spellcheck="false" value="${attr(p?.clienteEmail || '')}" ${ro ? 'disabled' : ''}></div></div>
    <div class="cc-field"><label for="pj-t">Projeto</label><input id="pj-t" value="${attr(p?.titulo || '')}" required ${ro ? 'disabled' : ''}></div>
    <div class="cc-f2"><div class="cc-field"><label for="pj-st">Etapa atual</label><select id="pj-st" ${ro ? 'disabled' : ''}>${ETAPAS_PROJ.map((e, i) => `<option value="${i}" ${Number(p?.status || 0) === i ? 'selected' : ''}>${e}</option>`).join('')}</select></div><div class="cc-field"><label for="pj-pz">Previsão de entrega</label><input id="pj-pz" value="${attr(p?.prazo || '')}" placeholder="Ex.: 15/12/2026" ${ro ? 'disabled' : ''}></div></div>
    <div class="cc-field"><label for="pj-obs">Recado para o cliente</label><textarea id="pj-obs" ${ro ? 'disabled' : ''}>${esc(p?.observacao || '')}</textarea></div>
    <div class="cc-field"><span class="cc-label">Entregas</span><div id="pj-ents" class="cc-grid">${(ent.length ? ent : [{}]).map(linha).join('')}</div>${ro ? '' : '<button class="btn btn--ghost btn--sm" type="button" id="pj-add" style="justify-self:start;margin-top:6px">Adicionar entrega</button>'}</div>
    <p class="cc-err" id="pj-err" role="alert"></p>
    ${ro ? '' : `<div class="cc-actions"><button class="btn btn--primary" type="submit" id="pj-save">Salvar projeto</button><a class="btn btn--ghost" href="#/projetos">Cancelar</a>${id ? '<button class="btn btn--danger" type="button" id="pj-del">Excluir</button>' : ''}</div>`}
  </form>`;
  if (ro) return;
  $('#pj-add').onclick = () => $('#pj-ents').insertAdjacentHTML('beforeend', linha());
  $('#pj').onsubmit = async (e) => {
    e.preventDefault();
    const titulo = $('#pj-t').value.trim(); if (!titulo) { $('#pj-err').textContent = 'Dê um nome ao projeto.'; return $('#pj-t').focus(); }
    const entregas = $$('.pj-ent').map(r => { const o = {}; $$('input', r).forEach(i => o[i.dataset.k] = i.value.trim()); return o; }).filter(o => o.url);
    if (entregas.some(o => !safeUrl(o.url))) { $('#pj-err').textContent = 'Os links das entregas precisam começar com https://'; return; }
    const dados = { clienteNome: $('#pj-cli').value.trim(), clienteEmail: $('#pj-mail').value.trim().toLowerCase(), titulo, status: Number($('#pj-st').value), prazo: $('#pj-pz').value.trim(), observacao: $('#pj-obs').value.trim(), entregas };
    if (p?.pedidoId) dados.pedidoId = p.pedidoId;
    const b = $('#pj-save'); b.disabled = true; b.textContent = 'Salvando…';
    try { await salvarDoc('projetos', id, dados, id ? 'editou projeto do cliente' : 'criou projeto do cliente', titulo); toast('Projeto salvo.'); ir('projetos'); } catch (er) { falha(er); b.disabled = false; b.textContent = 'Salvar projeto'; }
  };
  if ($('#pj-del')) $('#pj-del').onclick = async () => {
    if (!(await confirmar({ titulo: 'Excluir este projeto?', texto: 'O cliente deixa de vê-lo na área do cliente.', ok: 'Excluir', perigo: true }))) return;
    try { await excluirDoc('projetos', id, p.titulo); toast('Projeto excluído.'); ir('projetos'); } catch (er) { falha(er); }
  };
}

/* ============ Conteúdo do site: trabalhos, depoimentos, Instagram ============ */
const ST_PUB = { rascunho: ['Rascunho', 'mute'], publicado: ['Publicado', 'ok'], arquivado: ['Arquivado', 'mute'] };
const pillPub = (s) => pill((ST_PUB[s] || ST_PUB.rascunho)[0], (ST_PUB[s] || ST_PUB.rascunho)[1]);
const CATEGORIAS = ['Publicidade', 'Esporte', 'Evento', 'Institucional', 'Documentário', 'Cultural', 'Conteúdo recorrente', 'Político'];
const SERVICOS = ['Direção', 'Roteiro', 'Captação', 'Drone', 'Edição', 'Cor', 'Trilha e som', 'Motion', 'Legendas', 'Fotografia'];
function analisarVideo(url) {
  const u = String(url || '').trim();
  let m = u.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/);
  if (m) return { plataforma: 'youtube', videoId: m[1], vertical: /\/shorts\//.test(u) };
  m = u.match(/vimeo\.com\/(?:video\/)?(\d{5,12})/);
  if (m) return { plataforma: 'vimeo', videoId: m[1], vertical: false };
  return null;
}
async function oembed(info, url) {
  const alvo = info.plataforma === 'youtube' ? `https://www.youtube.com/oembed?format=json&url=${encodeURIComponent('https://www.youtube.com/watch?v=' + info.videoId)}` : `https://vimeo.com/api/oembed.json?url=${encodeURIComponent(url)}`;
  try { const r = await fetch(alvo); if (!r.ok) return { erro: r.status }; return await r.json(); } catch (e) { return { erro: 'rede' }; }
}
const thumbPadrao = (t) => t.plataforma === 'vimeo' ? (t.thumb || '') : `https://i.ytimg.com/vi/${t.videoId}/${t.orientacao === 'vertical' ? 'oardefault' : 'maxresdefault'}.jpg`;
/* um vídeo removido do YouTube devolve uma imagem cinza de 120 px */
function checarThumb(id) { return new Promise(res => { const i = new Image(); i.onload = () => res(i.naturalWidth > 120); i.onerror = () => res(false); i.src = `https://i.ytimg.com/vi/${id}/mqdefault.jpg`; }); }
function cardGaleria(t) {
  const v = t.orientacao === 'vertical';
  return `<ul class="gal${v ? ' gal--v' : ''}" style="grid-template-columns:1fr"><li class="gv${v ? ' gv--v' : ''}"><span class="gv-btn"><span class="gv-img"><img src="${attr(t.thumb || thumbPadrao(t))}" alt="" width="${v ? 360 : 1280}" height="${v ? 640 : 720}"><span class="gv-play" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg></span></span><span class="gv-t">${esc(t.titulo || 'Título do filme')}</span></span></li></ul>`;
}
async function reordenar(colecao, lista, idx, dir) {
  const a = lista[idx], b = lista[idx + dir]; if (!a || !b) return;
  const oa = a.ordem ?? idx, ob = b.ordem ?? (idx + dir);
  await Promise.all([S.F.updateDoc(docRef(colecao, a._id), { ordem: ob }), S.F.updateDoc(docRef(colecao, b._id), { ordem: oa === ob ? oa + dir : oa })]);
  limparCache(colecao); auditar('reordenou', colecao, a.titulo || a.nome || a.autor || a._id);
}
async function lerSitePublico(pagina) {
  const r = await fetch(pagina + (pagina.includes('?') ? '&' : '?') + 'cc=' + Date.now(), { cache: 'no-store' });
  if (!r.ok) throw new Error('Não foi possível ler ' + pagina);
  return new DOMParser().parseFromString(await r.text(), 'text/html');
}

/* ---------- trabalhos ---------- */
modulo({
  id: 'trabalhos', titulo: 'Trabalhos', mod: 'conteudo',
  async render(v, [id]) {
    if (id) return editarTrabalho(v, id === 'novo' ? null : id);
    const lista = (await listar('trabalhos')).sort((a, b) => (b.destaque ? 1 : 0) - (a.destaque ? 1 : 0) || (a.ordem ?? 0) - (b.ordem ?? 0) || tsMs(b.criadoEm) - tsMs(a.criadoEm));
    let f = 'todos', q = '', o = 'todas';
    v.innerHTML = `<div class="cc-head"><div><h2>Trabalhos</h2><p>Os filmes da galeria do site. Publicados aparecem na hora; destaques ficam sempre no começo, o resto é embaralhado a cada visita.</p></div>
      <div class="cc-actions">${edita('conteudo') ? `${lista.length ? '' : '<button class="btn btn--ghost" id="tb-imp" type="button">Importar galeria atual do site</button>'}<button class="btn btn--ghost" id="tb-chk" type="button">Verificar vídeos</button><a class="btn btn--primary" href="#/trabalhos/novo">Novo trabalho</a>` : ''}</div></div>
      <div class="cc-toolbar"><input type="search" id="tb-q" placeholder="Buscar por título ou cliente…" aria-label="Buscar trabalhos">
      <div class="cc-seg" role="group" aria-label="Situação">${['todos', 'publicado', 'rascunho', 'arquivado'].map(k => `<button type="button" data-f="${k}">${k === 'todos' ? 'Todos' : ST_PUB[k][0]}</button>`).join('')}</div>
      <div class="cc-seg" role="group" aria-label="Formato"><button type="button" data-o="todas">Todos</button><button type="button" data-o="horizontal">Horizontais</button><button type="button" data-o="vertical">Verticais</button></div></div>
      <div id="tb-l"></div>`;
    const desenhar = () => {
      $$('[data-f]', v).forEach(b => b.setAttribute('aria-pressed', b.dataset.f === f));
      $$('[data-o]', v).forEach(b => b.setAttribute('aria-pressed', b.dataset.o === o));
      const nq = norm(q);
      const vis = lista.filter(t => (f === 'todos' || t.status === f) && (o === 'todas' || (t.orientacao || 'horizontal') === o) && (!nq || norm(t.titulo + ' ' + (t.cliente || '')).includes(nq)));
      $('#tb-l').innerHTML = vis.length ? `<div class="cc-list">${vis.map(t => `<div class="cc-row" data-id="${attr(t._id)}"><img class="cc-thumb${t.orientacao === 'vertical' ? ' cc-thumb--v' : ''}" src="${attr(t.thumb || thumbPadrao(t))}" alt="" loading="lazy"><span><b>${esc(t.titulo)}</b><small>${esc([t.cliente, t.categoria, t.ano].filter(Boolean).join(' · ') || (t.plataforma === 'vimeo' ? 'Vimeo' : 'YouTube'))}</small></span>${t.destaque ? pill('Destaque', 'gold') : ''}${t.indisponivel ? pill('Vídeo indisponível', 'bad') : ''}${pillPub(t.status)}${edita('conteudo') && t.destaque ? `<button class="cc-icon-btn" data-up="${attr(t._id)}" aria-label="Subir ${attr(t.titulo)}">↑</button><button class="cc-icon-btn" data-down="${attr(t._id)}" aria-label="Descer ${attr(t.titulo)}">↓</button>` : ''}</div>`).join('')}</div>`
        : `<div class="cc-empty"><b>${lista.length ? 'Nada com este filtro.' : 'A galeria ainda não está no Command Center.'}</b>${lista.length ? '' : 'Enquanto não houver trabalhos publicados aqui, o site continua mostrando a galeria fixa atual. Importe a galeria para gerenciar tudo por aqui.'}</div>`;
      $$('.cc-row[data-id]', v).forEach(r => r.onclick = (e) => { if (!e.target.closest('button')) location.hash = '#/trabalhos/' + r.dataset.id; });
      const dest = lista.filter(t => t.destaque);
      $$('[data-up],[data-down]', v).forEach(b => b.onclick = async () => { const idx = dest.findIndex(t => t._id === (b.dataset.up || b.dataset.down)); try { await reordenar('trabalhos', dest, idx, b.dataset.up ? -1 : 1); navegar(); } catch (e) { falha(e); } });
    };
    $$('[data-f]', v).forEach(b => b.onclick = () => { f = b.dataset.f; desenhar(); });
    $$('[data-o]', v).forEach(b => b.onclick = () => { o = b.dataset.o; desenhar(); });
    $('#tb-q').oninput = (e) => { q = e.target.value; desenhar(); };
    desenhar();
    if ($('#tb-chk')) $('#tb-chk').onclick = async () => {
      const yt = lista.filter(t => t.plataforma !== 'vimeo'); toast(`Verificando ${yt.length} vídeos…`);
      let ruins = 0;
      for (const t of yt) { const ok = await checarThumb(t.videoId); if (!ok !== !!t.indisponivel) { await S.F.updateDoc(docRef('trabalhos', t._id), { indisponivel: !ok }); } if (!ok) ruins++; }
      limparCache('trabalhos'); toast(ruins ? `${ruins} vídeo(s) parecem indisponíveis no YouTube.` : 'Todos os vídeos respondem.', !!ruins); navegar();
    };
    if ($('#tb-imp')) $('#tb-imp').onclick = async () => {
      let docH;
      try { docH = await lerSitePublico('index.html'); } catch (e) { return falha(e); }
      const itens = $$('.gv-btn[data-play]', docH).map((b, i) => ({ titulo: (b.querySelector('.gv-t') || {}).textContent || '', videoId: b.dataset.play, orientacao: b.hasAttribute('data-vertical') ? 'vertical' : 'horizontal', ordem: i }));
      if (!itens.length) return toast('Não encontrei filmes na página inicial.', true);
      if (!(await confirmar({ titulo: `Importar ${itens.length} filmes?`, texto: 'Eles entram publicados, na mesma ordem e com os mesmos títulos do site. Depois você edita, despublica ou destaca cada um.', ok: 'Importar' }))) return;
      try {
        const lote = S.F.writeBatch(S.db);
        itens.forEach(t => lote.set(S.F.doc(col('trabalhos')), { ...t, plataforma: 'youtube', status: 'publicado', destaque: false, url: 'https://www.youtube.com/watch?v=' + t.videoId, criadoEm: S.F.serverTimestamp(), criadoPor: S.email, atualizadoEm: S.F.serverTimestamp() }));
        await lote.commit(); limparCache('trabalhos'); auditar('importou galeria', 'trabalhos', itens.length + ' filmes'); toast('Galeria importada.'); navegar();
      } catch (e) { falha(e); }
    };
  }
});

    };

  };
  if (!t) return;
  if ($('#tf-unpub')) $('#tf-unpub').onclick = async () => { if (!(await confirmar({ titulo: 'Despublicar?', texto: 'O filme sai da galeria do site, mas continua salvo aqui.', ok: 'Despublicar' }))) return; try { await salvarDoc('trabalhos', id, { status: 'rascunho' }, 'despublicou trabalho', t.titulo); toast('Despublicado.'); navegar(); } catch (e) { falha(e); } };
  $('#tf-dup').onclick = async () => { const { _id, criadoEm, atualizadoEm, ...r } = t; try { const nid = await salvarDoc('trabalhos', null, { ...r, titulo: t.titulo + ' (cópia)', status: 'rascunho', destaque: false }, 'duplicou trabalho', t.titulo); toast('Cópia criada como rascunho.'); ir('trabalhos/' + nid); } catch (e) { falha(e); } };
  $('#tf-hist').onclick = () => abrirVersoes('trabalhos', id, (x) => x.titulo);
  $('#tf-del').onclick = async () => { if (!(await confirmar({ titulo: 'Excluir este trabalho?', texto: 'Se ele estiver publicado, sai do site. Uma cópia fica em Versões.', ok: 'Excluir', perigo: true }))) return; try { await excluirDoc('trabalhos', id, t.titulo); toast('Excluído.'); ir('trabalhos'); } catch (e) { falha(e); } };
}

/* histórico de versões com restauração */
async function abrirVersoes(colecao, id, nomeFn) {
  const F = S.F;
  let itens = [];
  try { const snap = await F.getDocs(F.query(col('versoes'), F.where('docId', '==', id))); itens = snap.docs.map(d => ({ ...d.data(), _id: d.id })).filter(x => x.colecao === colecao).sort((a, b) => tsMs(b.em) - tsMs(a.em)); }
  catch (e) { return falha(e); }
  abrirSheet('Versões anteriores', itens.length ? `<p class="cc-note" style="margin-bottom:12px">Cada salvamento guarda como estava antes. Restaurar volta o conteúdo, mantendo a situação atual de publicação.</p><div class="cc-list">${itens.map(x => `<div class="cc-row"><span><b>${esc(nomeFn(x.dados) || 'Sem título')}</b><small>${esc(quando(x.em))} · antes da alteração de ${esc((x.por || '').split('@')[0])}</small></span><button class="btn btn--ghost btn--sm" type="button" data-v="${attr(x._id)}">Restaurar</button></div>`).join('')}</div>` : '<div class="cc-empty"><b>Sem versões anteriores.</b>Elas aparecem a partir da próxima alteração.</div>');
  $$('[data-v]', $('#sheet-body')).forEach(b => b.onclick = async () => {
    const x = itens.find(i => i._id === b.dataset.v); if (!x) return;
    if (!(await confirmar({ titulo: 'Restaurar esta versão?', texto: 'O conteúdo atual vira uma nova versão anterior, então dá para desfazer.', ok: 'Restaurar' }))) return;
    const atual = (S.cache[colecao] || []).find(y => y._id === id) || {};
    const { criadoEm, atualizadoEm, atualizadoPor, ...dados } = x.dados;
    try { await salvarDoc(colecao, id, { ...dados, status: atual.status || dados.status }, 'restaurou versão', nomeFn(x.dados)); fecharSheet(); toast('Versão restaurada.'); navegar(); } catch (e) { falha(e); }
  });
}

  v.innerHTML = `<div class="cc-head"><div><h2>${m ? esc(m.nome) : 'Adicionar marca'}</h2><p>PNG, SVG, JPG ou WebP. O sistema detecta fundo e área útil, normaliza o tamanho e mostra no grid real.</p></div>${m ? pillPub(m.status) : ''}</div>

      ${ro ? '' : `<label class="cc-drop" for="mf-f" id="mf-drop"><b>${m ? 'Trocar ou reprocessar o logo' : 'Enviar logo'}</b>PNG transparente ou SVG dão o melhor resultado. Arraste aqui ou toque para escolher.<input type="file" id="mf-f" accept="image/png,image/svg+xml,image/jpeg,image/webp"></label>`}

      <fieldset class="cc-field" style="border:0;padding:0"><legend class="cc-label" style="margin-bottom:6px">Tratamento</legend><div class="cc-chips">${[['auto', 'Automático'], ['silhueta', 'Monocromático'], ['detalhes', 'Monocromático com detalhes'], ['original', 'Versão original']].map(([k, n]) => `<label><input type="radio" name="tr" value="${k}" ${op.tratamento === k ? 'checked' : ''} ${ro ? 'disabled' : ''}><span>${n}</span></label>`).join('')}</div>
        <span class="cc-note">Use "Versão original" quando o manual da marca proibir versões monocromáticas.</span></fieldset>
      <label class="cc-check"><input type="checkbox" id="mf-rf" ${op.removerFundo ? 'checked' : ''} ${ro ? 'disabled' : ''}>Remover fundo sólido automaticamente</label>

      <div class="cc-range"><label for="mf-dx">Ajuste horizontal</label><input type="range" id="mf-dx" min="-20" max="20" step="1" value="${op.dx}" ${ro ? 'disabled' : ''}><output id="mf-dx-o">${op.dx} px</output></div>
      <div class="cc-range"><label for="mf-dy">Ajuste vertical</label><input type="range" id="mf-dy" min="-12" max="12" step="1" value="${op.dy}" ${ro ? 'disabled' : ''}><output id="mf-dy-o">${op.dy} px</output></div>
      <details><summary>Link e detalhes</summary><div class="cc-form"><div class="cc-field"><label for="mf-l">Link externo <span>opcional</span></label><input id="mf-l" type="url" spellcheck="false" value="${attr(m?.link || '')}" placeholder="https://"></div></div></details>
      <p class="cc-err" id="mf-err" role="alert"></p>
      ${ro ? '' : `<div class="cc-actions"><button class="btn btn--ghost" type="submit" data-acao="rascunho">Salvar rascunho</button><button class="btn btn--primary" type="submit" data-acao="publicado">${m?.status === 'publicado' ? 'Salvar publicado' : 'Publicar no grid'}</button>${m ? `${m.status === 'publicado' ? '<button class="btn btn--ghost" type="button" id="mf-oc">Ocultar do site</button>' : ''}<button class="btn btn--ghost" type="button" id="mf-hist">Versões</button><button class="btn btn--danger" type="button" id="mf-del">Excluir</button>` : ''}</div>`}
    </form>
    <div class="cc-grid">
      <section class="cc-panel"><h3>Antes e depois</h3><div class="cc-logo-lab"><div><span class="cc-prev-label">Original</span><div class="cc-checker" id="mf-orig">${original ? `<img src="${attr(original)}" alt="">` : (m ? `<img src="${attr(m.arquivo)}" alt="">` : '<span class="cc-note">Envie um arquivo</span>')}</div></div><div><span class="cc-prev-label">Processado</span><div class="cc-checker" id="mf-proc">${m ? `<img src="${attr(m.arquivo)}" alt="">` : ''}</div></div></div></section>
      <section class="cc-prev"><span class="cc-prev-label">No grid do site, entre as marcas publicadas</span><ul class="cc-brand-prev" id="mf-grid"></ul>
      <span class="cc-prev-label" style="margin-top:14px">Celular</span><div style="max-width:360px"><ul class="cc-brand-prev" id="mf-grid-m" style="--mob:1"></ul></div></section>
    </div>
  </div>`;
  const grade = () => {
    const outros = lista.filter(x => x._id !== id && x.status === 'publicado').slice(0, 5);
    const cel = (x, sel, mob) => `<li class="${x.tratamento === 'original' ? 'is-orig ' : ''}${sel ? 'is-sel' : ''}" ${mob ? 'style="flex-basis:calc((100% - 8px) / 2);aspect-ratio:3/2;padding:12px"' : ''}><img src="${attr(x.arquivo)}" alt="" style="height:${mob ? 'calc(var(--h) * .5)' : 'var(--h)'};--h:${Number(x.h) || 40}px;${(x.dx || x.dy) ? `transform:translate(${x.dx || 0}px,${x.dy || 0}px)` : ''}"></li>`;
    const atual = res ? { arquivo: res.arquivo, h: res.h, tratamento: op.tratamento === 'original' ? 'original' : 'mono', dx: op.dx, dy: op.dy } : null;
    const meio = Math.min(1, outros.length);
    const itens = [...outros]; if (atual) itens.splice(meio, 0, atual);
    $('#mf-grid').innerHTML = itens.map(x => cel(x, x === atual, false)).join('') || '<li><span class="cc-note">Envie um logo</span></li>';
    $('#mf-grid-m').innerHTML = itens.slice(0, 4).map(x => cel(x, x === atual, true)).join('');
  };
  const mostrarAnalise = () => {
    if (!an) return;
    $('#mf-an').innerHTML = `<dl class="cc-analysis">
      <div><dt>Formato</dt><dd>${esc((an.formato || '').replace('image/', '').replace('+xml', '').toUpperCase())}</dd></div>
      <div><dt>Dimensões</dt><dd>${an.larguraOrig} × ${an.alturaOrig}</dd></div>
      <div><dt>Transparência</dt><dd>${an.temAlpha ? 'Sim' : 'Não'}</dd></div>
      <div><dt>Fundo</dt><dd>${an.temAlpha ? 'Transparente' : an.fundo ? 'Sólido' : 'Complexo'}</dd></div>
      ${res && res.util ? `<div><dt>Área útil</dt><dd>${res.util.tw} × ${res.util.th}</dd></div><div><dt>Proporção</dt><dd>${res.aspecto.toFixed(2)} : 1</dd></div><div><dt>Densidade</dt><dd>${Math.round(res.densidade * 100)}%</dd></div><div><dt>Altura no site</dt><dd>${res.h} px</dd></div>` : ''}
    </dl>${res && res.avisos.length ? `<div class="cc-warns">${res.avisos.map(a => `<p>${esc(a)}</p>`).join('')}</div>` : ''}`;
  };
  const reprocessar = () => {
    if (!an) { if (res) { res.h = Math.round((m?.h || 40) / (m?.escala || 100) * op.escala); } grade(); return; }
    const r = processarLogo(an, op);
    if (r.erro) { $('#mf-err').textContent = r.erro; return; }
    $('#mf-err').textContent = '';
    res = r;
    $('#mf-proc').innerHTML = `<img src="${attr(r.arquivo)}" alt="">`;
    mostrarAnalise(); grade();
  };
  const carregar = async (fonte, tipo) => {
    try { an = await analisarLogo(fonte, tipo); }
    catch (e) { $('#mf-err').textContent = /SVG/.test(e.message) ? 'SVG inválido ou inseguro. Exporte de novo ou envie PNG.' : 'Não consegui ler este arquivo. Envie PNG, SVG, JPG ou WebP.'; an = null; if (!m) { res = null; original = ''; $('#mf-orig').innerHTML = '<span class="cc-note">Envie um arquivo</span>'; grade(); } return; }
    if (an.fundo && !an.temAlpha) { op.removerFundo = true; $('#mf-rf').checked = true; }
    reprocessar();
  };
  grade();
  if (m && original) carregar(original);
  if (ro) return;
  ligarDrop($('#mf-drop'), $('#mf-f'), async (file) => {
    $('#mf-err').textContent = ''; an = null; res = m ? res : null; $('#mf-an').innerHTML = ''; if (!m) $('#mf-proc').innerHTML = '';
    if (!/^image\/(png|svg\+xml|jpeg|webp)$/.test(file.type)) { $('#mf-err').textContent = 'Formato não aceito. Envie PNG, SVG, JPG ou WebP.'; return; }
    if (file.size > 8e6) { $('#mf-err').textContent = 'Arquivo muito grande (máximo 8 MB).'; return; }
    if (file.type === 'image/svg+xml') { try { const t = sanitizarSVG(await file.text()); original = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(t))); } catch { $('#mf-err').textContent = 'SVG inválido ou inseguro.'; return; } }
    else original = await lerComoDataURL(file);
    $('#mf-orig').innerHTML = `<img src="${attr(original)}" alt="">`;
    if (!$('#mf-n').value) $('#mf-n').value = file.name.replace(/\.[a-z]+$/i, '').replace(/[-_]+/g, ' ').replace(/\b(logo|marca|final|png|svg)\b/gi, '').trim().replace(/^\w/, c => c.toUpperCase());
    await carregar(file);
  });
  $$('input[name=tr]').forEach(r => r.onchange = () => { op.tratamento = r.value; reprocessar(); });
  $('#mf-rf').onchange = (e) => { op.removerFundo = e.target.checked; reprocessar(); };
  const faixa = (idc, k, suf) => { $('#' + idc).oninput = (e) => { op[k] = Number(e.target.value); $('#' + idc + '-o').textContent = op[k] + suf; if (k === 'escala') { if (an) reprocessar(); else { if (res) res.h = Math.round((m?.h || 40) / (m?.escala || 100) * op.escala); grade(); } } else grade(); }; };
  faixa('mf-esc', 'escala', '%'); faixa('mf-dx', 'dx', ' px'); faixa('mf-dy', 'dy', ' px');
  $('#mf').onsubmit = async (e) => {
    e.preventDefault();
    const acao = e.submitter?.dataset.acao || 'rascunho', nome = $('#mf-n').value.trim();
    if (!nome) { $('#mf-err').textContent = 'Informe o nome da marca.'; return $('#mf-n').focus(); }
    if (!res) { $('#mf-err').textContent = 'Envie o logo.'; return; }
    const link = $('#mf-l').value.trim(); if (link && !safeUrl(link)) { $('#mf-err').textContent = 'O link precisa começar com https://'; return; }
    const dup = lista.find(x => x._id !== id && norm(x.nome) === norm(nome));
    if (dup && !(await confirmar({ titulo: 'Marca já cadastrada', texto: `Já existe "${dup.nome}". Salvar outra mesmo assim?`, ok: 'Salvar' }))) return;
    if (acao === 'publicado' && m?.status !== 'publicado' && !(await confirmar({ titulo: 'Publicar no grid do site?', texto: `${nome} passa a aparecer em "Marcas que confiam no nosso método".`, ok: 'Publicar' }))) return;
    const dados = { nome, arquivo: res.arquivo, w: res.w, hpx: res.hpx, h: res.h, modo: res.modo || 'silhueta', tratamento: op.tratamento === 'original' ? 'original' : 'mono', escala: op.escala, dx: op.dx, dy: op.dy, removerFundo: op.removerFundo, link: safeUrl(link), status: acao, ordem: m?.ordem ?? lista.length };
    if (original && original.length < MAX_ORIGINAL * 1.37) dados.original = original;
    else if (original) toast('Original grande demais para guardar (acima de 400 KB). O logo processado foi salvo.', true);
    const tamanho = JSON.stringify(dados).length;
    if (tamanho > 950000) { $('#mf-err').textContent = 'O arquivo ficou grande demais para o banco. Envie uma versão menor do logo.'; return; }
    try { const nid = await salvarDoc('marcas', id, dados, acao === 'publicado' ? 'publicou marca' : 'salvou marca', nome); toast(acao === 'publicado' ? 'Marca publicada.' : 'Rascunho salvo.'); atualizarAlertas(); ir('marcas/' + nid); } catch (er) { falha(er); }
  };
  if (!m) return;
  if ($('#mf-oc')) $('#mf-oc').onclick = async () => { try { await salvarDoc('marcas', id, { status: 'rascunho' }, 'ocultou marca', m.nome); toast('Marca oculta do site.'); navegar(); } catch (e) { falha(e); } };
  $('#mf-hist').onclick = () => abrirVersoes('marcas', id, (x) => x.nome);
  $('#mf-del').onclick = async () => { if (!(await confirmar({ titulo: `Excluir ${m.nome}?`, texto: 'Sai do grid do site. Uma cópia fica em Versões para restaurar.', ok: 'Excluir', perigo: true }))) return; try { await excluirDoc('marcas', id, m.nome); toast('Marca excluída.'); ir('marcas'); } catch (e) { falha(e); } };
}

modulo({
  id: 'saude', titulo: 'Saúde do site', mod: 'conteudo',
  async render(v) {
    v.innerHTML = `<div class="cc-head"><div><h2>Saúde do site</h2><p>Confere páginas, imagens, arquivos pesados e vídeos do portfólio. Roda no seu navegador, a partir do site publicado.</p></div><div class="cc-actions"><button class="btn btn--primary" id="sd-run" type="button">Verificar agora</button></div></div><div id="sd-out"><div class="cc-empty"><b>Nenhuma verificação nesta sessão.</b>Leva menos de um minuto.</div></div>`;
    $('#sd-run').onclick = async () => {
      const b = $('#sd-run'); b.disabled = true; b.textContent = 'Verificando…';
      const out = $('#sd-out'), res = [];
      const vistos = new Set();
      for (const pg of PAGINAS) {
        let d; try { const r = await fetch(pg + '?cc=' + Date.now(), { cache: 'no-store' }); if (!r.ok) { res.push(['bad', pg, `Página responde ${r.status}`]); continue; } d = new DOMParser().parseFromString(await r.text(), 'text/html'); } catch { res.push(['bad', pg, 'Página não abriu']); continue; }
        d.querySelectorAll('img[src]').forEach(im => { if (!im.getAttribute('alt') && im.getAttribute('alt') !== '') res.push(['warn', pg, 'Imagem sem texto alternativo: ' + im.getAttribute('src').slice(0, 60)]); });
        const recursos = [...d.querySelectorAll('img[src],link[rel=stylesheet][href],script[src]')].map(e => e.getAttribute('src') || e.getAttribute('href')).filter(u => u && !/^(https?:|data:|\/\/)/.test(u)).map(u => u.split('?')[0]);
        for (const u of recursos) {
          if (vistos.has(u)) continue; vistos.add(u);
          try { const r = await fetch(u, { method: 'HEAD', cache: 'no-store' }); if (!r.ok) res.push(['bad', pg, `Arquivo não encontrado: ${u}`]); else { const n = Number(r.headers.get('content-length') || 0); if (n > 600 * 1024 && /\.(png|jpe?g|webp|gif)$/i.test(u)) res.push(['warn', pg, `Imagem pesada (${Math.round(n / 1024)} KB): ${u}`]); } } catch { res.push(['bad', pg, 'Falha ao conferir ' + u]); }
        }
      }
      try {
        const tr = (await listar('trabalhos', true)).filter(t => t.status === 'publicado' && t.plataforma !== 'vimeo');
        for (const t of tr) if (!(await checarThumb(t.videoId))) res.push(['bad', 'Portfólio', `Vídeo indisponível no YouTube: ${t.titulo}`]);
        const mk = (await listar('marcas', true)).filter(m => m.status === 'publicado');
        mk.forEach(m => { if ((m.arquivo || '').length > 250e3) res.push(['warn', 'Marcas', `Logo pesado (${Math.round(m.arquivo.length * .75 / 1024)} KB): ${m.nome}`]); if (m.w / Math.max(1, m.hpx) > 7) res.push(['warn', 'Marcas', `Logo muito largo, aparece baixo: ${m.nome}`]); });
      } catch {}
      auditar('verificou saúde do site', 'site', res.length + ' avisos');
      out.innerHTML = `<dl class="cc-kpis"><div class="cc-kpi"><dt>Páginas</dt><dd>${PAGINAS.length}</dd></div><div class="cc-kpi"><dt>Arquivos conferidos</dt><dd>${vistos.size}</dd></div><div class="cc-kpi"><dt>Problemas</dt><dd>${res.filter(r => r[0] === 'bad').length}</dd></div><div class="cc-kpi"><dt>Avisos</dt><dd>${res.filter(r => r[0] === 'warn').length}</dd></div></dl>
      ${res.length ? `<div class="cc-alerts">${res.map(r => `<div class="cc-alert is-${r[0]}"><span>${esc(r[2])}<small>${esc(r[1])}</small></span></div>`).join('')}</div>` : '<div class="cc-empty"><b>Nada encontrado.</b>Páginas, arquivos e vídeos responderam normalmente.</div>'}`;
      b.disabled = false; b.textContent = 'Verificar de novo';
    };
  }
});

/* ---------- equipe: convites, papéis e acesso ---------- */
modulo({
  id: 'equipe', titulo: 'Equipe', mod: 'equipe',
  async render(v, [mail]) {
    const lista = (await listar('equipe', true)).sort((a, b) => (a.nome || a._id).localeCompare(b.nome || b._id));
    const souOwner = S.papel === 'owner';
    const papeisGeriveis = Object.keys(PAPEIS).filter(p => p !== 'owner' && (souOwner || p !== 'admin'));
    const stP = (m) => m.status === 'ativo' ? pill('Ativo', 'ok') : m.status === 'suspenso' ? pill('Suspenso', 'bad') : tsMs(m.expiraEm) < Date.now() ? pill('Convite expirado', 'mute') : pill('Convidado', 'warn');
    v.innerHTML = `<div class="cc-head"><div><h2>Equipe</h2><p>Quem pode entrar no Command Center e o que cada pessoa pode fazer. O acesso é conferido pelo Google a cada ação: suspender ou revogar vale na hora.</p></div><div class="cc-actions">${edita('equipe') ? '<button class="btn btn--primary" id="eq-novo" type="button">Convidar pessoa</button>' : ''}</div></div>
      <div class="cc-list">
        ${OWNERS.map(o => `<div class="cc-row"><span><b>${esc(o)}</b><small>Proprietário. Definido nas regras de segurança, não pode ser removido pelo painel.</small></span>${pill('Proprietário', 'gold')}</div>`).join('')}
        ${lista.map(m => `<button class="cc-row" type="button" data-m="${attr(m._id)}"><span><b>${esc(m.nome || m._id)}</b><small>${esc(m._id)} · ${esc(PAPEIS[m.papel]?.nome || m.papel)}${m.ultimoAcesso ? ' · último acesso ' + esc(relativo(m.ultimoAcesso)) : ''}</small></span>${stP(m)}</button>`).join('')}
      </div>
      <section class="cc-panel" style="margin-top:14px"><h3>Papéis</h3><div class="cc-table-wrap" style="border:0"><table class="cc-table" style="min-width:560px"><thead><tr><th>Papel</th>${Object.keys(MOD_NOMES).map(k => `<th>${esc(MOD_NOMES[k])}</th>`).join('')}</tr></thead><tbody>${Object.entries(PAPEIS).map(([k, p]) => `<tr style="cursor:default"><td><b>${esc(p.nome)}</b></td>${Object.keys(MOD_NOMES).map(mm => `<td>${p.mods.includes(mm) ? (k === 'leitura' ? 'Ver' : 'Sim') : '·'}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
      <p class="cc-note" style="margin-top:8px">Administradores não podem gerir outros administradores nem o proprietário. Ninguém altera o próprio acesso. Recomende a todos ativar a verificação em duas etapas da conta Google.</p></section>`;
    const form = (m) => {
      const novo = !m;
      const mods = m?.modulos || null;
      abrirSheet(novo ? 'Convidar pessoa' : (m.nome || m._id), `<form class="cc-form" id="eqf" novalidate>
        ${novo ? '<div class="cc-field"><label for="eq-e">E-mail da conta Google</label><input id="eq-e" type="email" spellcheck="false" autocomplete="off" placeholder="nome@gmail.com"></div>' : `<p class="cc-note">${esc(m._id)}${m.aceitoEm ? ' · entrou pela primeira vez ' + esc(quando(m.aceitoEm)) : ''}</p>`}
        <div class="cc-field"><label for="eq-n">Nome</label><input id="eq-n" value="${attr(m?.nome || '')}" autocomplete="off"></div>
        <div class="cc-field"><label for="eq-p">Papel</label><select id="eq-p">${papeisGeriveis.map(p => `<option value="${p}" ${m?.papel === p ? 'selected' : ''}>${esc(PAPEIS[p].nome)}</option>`).join('')}</select></div>
        <details ${mods ? 'open' : ''}><summary>Permissões específicas</summary><div class="cc-form"><p class="cc-note">Marque só se quiser fugir do padrão do papel.</p><label class="cc-check"><input type="checkbox" id="eq-custom" ${mods ? 'checked' : ''}>Usar permissões específicas</label><div class="cc-chips" id="eq-mods">${Object.entries(MOD_NOMES).filter(([k]) => souOwner || !['equipe', 'auditoria', 'config'].includes(k)).map(([k, n]) => `<label><input type="checkbox" value="${k}" ${(mods || PAPEIS[m?.papel || 'editor'].mods).includes(k) ? 'checked' : ''}><span>${esc(n)}</span></label>`).join('')}</div></div></details>
        <p class="cc-err" id="eq-err" role="alert"></p></form>`,
        `<button class="btn btn--primary" type="button" id="eq-ok">${novo ? 'Criar convite' : 'Salvar'}</button>${!novo ? `${m.status === 'suspenso' ? '<button class="btn btn--ghost" type="button" id="eq-reat">Reativar</button>' : '<button class="btn btn--ghost" type="button" id="eq-susp">Suspender</button>'}${m.status === 'convidado' ? '<button class="btn btn--ghost" type="button" id="eq-reenv">Renovar convite</button>' : ''}<span class="cc-spacer"></span><button class="btn btn--danger" type="button" id="eq-rev">${m.status === 'convidado' ? 'Cancelar convite' : 'Revogar acesso'}</button>` : ''}`);
      const coletar = () => { const custom = $('#eq-custom').checked; return { nome: $('#eq-n').value.trim(), papel: $('#eq-p').value, modulos: custom ? $$('#eq-mods input:checked').map(i => i.value) : null }; };
      const expira = () => S.F.Timestamp.fromMillis(Date.now() + 7 * 864e5);
      $('#eq-ok').onclick = async () => {
        const x = coletar(), err = $('#eq-err');
        try {
          if (novo) {
            const e = $('#eq-e').value.trim().toLowerCase();
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e)) { err.textContent = 'Confira o e-mail.'; return; }
            if (OWNERS.includes(e) || e === S.email) { err.textContent = 'Este e-mail já tem acesso.'; return; }
            if (lista.find(m2 => m2._id === e)) { err.textContent = 'Esta pessoa já está na equipe.'; return; }
            await S.F.setDoc(docRef('equipe', e), { email: e, nome: x.nome, papel: x.papel, modulos: x.modulos, status: 'convidado', convidadoPor: S.email, convidadoEm: S.F.serverTimestamp(), expiraEm: expira() });
            auditar('convidou', 'equipe/' + e, x.papel);
            fecharSheet(); limparCache('equipe');
            const msg = `Olá${x.nome ? ', ' + x.nome.split(' ')[0] : ''}! Você foi convidado para o Command Center da Bourbon Films. Acesse bourbonfilms.com.br/admin.html em até 7 dias e entre com o Google usando ${e}.`;
            abrirSheet('Convite criado', `<p class="cc-note" style="margin-bottom:12px">O convite vale por 7 dias. Envie a mensagem abaixo para a pessoa:</p><textarea id="eq-msg" rows="5" readonly>${esc(msg)}</textarea>`, `<button class="btn btn--primary" type="button" id="eq-cp">Copiar mensagem</button><a class="btn btn--ghost" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(msg)}">Enviar no WhatsApp</a>`, () => navegar());
            $('#eq-cp').onclick = () => { navigator.clipboard.writeText(msg).then(() => toast('Copiado.'), () => { $('#eq-msg').select(); }); };
          } else {
            if (x.papel !== m.papel && !(await confirmar({ titulo: 'Alterar o papel?', texto: `${m.nome || m._id} passa de ${PAPEIS[m.papel]?.nome} para ${PAPEIS[x.papel].nome}. Vale a partir da próxima ação.`, ok: 'Alterar' }))) return;
            await S.F.updateDoc(docRef('equipe', m._id), { nome: x.nome, papel: x.papel, modulos: x.modulos });
            auditar('alterou permissões', 'equipe/' + m._id, x.papel + (x.modulos ? ' + ' + x.modulos.join(',') : ''));
            fecharSheet(); limparCache('equipe'); toast('Acesso atualizado.'); navegar();
          }
        } catch (er) { falha(er); }
      };
      if (novo) return;
      const muda = async (dados, acao, titulo, texto, perigo = false) => { if (!(await confirmar({ titulo, texto, ok: 'Confirmar', perigo }))) return; try { await S.F.updateDoc(docRef('equipe', m._id), dados); auditar(acao, 'equipe/' + m._id); fecharSheet(); limparCache('equipe'); toast('Feito.'); navegar(); } catch (er) { falha(er); } };
      if ($('#eq-susp')) $('#eq-susp').onclick = () => muda({ status: 'suspenso' }, 'suspendeu acesso', 'Suspender acesso?', 'A pessoa perde o acesso a qualquer dado na próxima ação, mesmo com a sessão aberta.', true);
      if ($('#eq-reat')) $('#eq-reat').onclick = () => muda({ status: 'ativo' }, 'reativou acesso', 'Reativar acesso?', 'A pessoa volta a acessar com o mesmo papel.');
      if ($('#eq-reenv')) $('#eq-reenv').onclick = () => muda({ expiraEm: expira() }, 'renovou convite', 'Renovar convite?', 'O convite passa a valer por mais 7 dias.');
      $('#eq-rev').onclick = async () => {
        if (!(await confirmar({ titulo: m.status === 'convidado' ? 'Cancelar convite?' : 'Revogar acesso?', texto: 'A ficha é apagada e a pessoa não entra mais. Para voltar, será preciso um novo convite.', ok: 'Revogar', perigo: true, digitar: 'REVOGAR' }))) return;
        try { await S.F.deleteDoc(docRef('equipe', m._id)); auditar('revogou acesso', 'equipe/' + m._id); fecharSheet(); limparCache('equipe'); toast('Acesso revogado.'); navegar(); } catch (er) { falha(er); }
      };
    };
    if ($('#eq-novo')) $('#eq-novo').onclick = () => form(null);
    $$('[data-m]', v).forEach(b => b.onclick = () => edita('equipe') ? form(lista.find(m => m._id === b.dataset.m)) : null);
  }
});

modulo({
  id: 'auditoria', titulo: 'Auditoria', mod: 'auditoria',
  async render(v) {
    const F = S.F;
    const snap = await F.getDocs(F.query(col('auditoria'), F.orderBy('em', 'desc'), F.limit(300)));
    const itens = snap.docs.map(d => d.data());
    let q = '';
    v.innerHTML = `<div class="cc-head"><div><h2>Auditoria</h2><p>Quem fez o quê, e quando. Os registros não podem ser alterados nem apagados pelo painel. Últimos 300.</p></div></div>
      <div class="cc-toolbar"><input type="search" id="au-q" placeholder="Filtrar por pessoa, ação ou item…" aria-label="Filtrar auditoria"></div><div id="au-l"></div>
      <p class="cc-note" style="margin-top:12px">Os registros são gravados pelo próprio painel no momento de cada ação, com o e-mail e o horário do servidor conferidos pelas regras de segurança.</p>`;
    const des = () => { const n = norm(q); const vis = itens.filter(i => !n || norm([i.quem, i.acao, i.alvo, i.detalhe].join(' ')).includes(n)); $('#au-l').innerHTML = vis.length ? `<div class="cc-table-wrap"><table class="cc-table"><thead><tr><th>Quando</th><th>Quem</th><th>Ação</th><th>Item</th></tr></thead><tbody>${vis.map(i => `<tr style="cursor:default"><td class="cc-num">${esc(quando(i.em))}</td><td>${esc((i.quem || '').split('@')[0])}</td><td><b>${esc(i.acao)}</b></td><td>${esc(i.alvo)}${i.detalhe ? `<small>${esc(i.detalhe)}</small>` : ''}</td></tr>`).join('')}</tbody></table></div>` : '<div class="cc-empty"><b>Nenhum registro.</b></div>'; };
    $('#au-q').oninput = (e) => { q = e.target.value; des(); }; des();
  }
});

modulo({
  id: 'dados', titulo: 'Dados e backup', mod: 'config',
  async render(v) {
    const cols = ['pedidos', 'propostas', 'clientes', 'projetos', 'trabalhos', 'marcas', 'depoimentos', 'instagram', 'site', 'equipe', 'integracoes'];
    v.innerHTML = `<div class="cc-head"><div><h2>Dados e backup</h2><p>Exporte tudo em JSON, um formato aberto. Guarde o arquivo em local seguro: ele contém dados de clientes.</p></div></div>
      <div class="cc-cols"><section class="cc-panel"><h3>Exportar</h3><p class="cc-note" style="margin-bottom:12px">${cols.length} coleções. Leva alguns segundos.</p><button class="btn btn--primary" type="button" id="bk">Baixar backup completo</button></section>
      ${S.papel === 'owner' ? `<section class="cc-panel"><h3>Limpeza prevista na privacidade</h3><p class="cc-note" style="margin-bottom:12px">A política do site diz que pedidos que não viram projeto são apagados em até 12 meses. Isto apaga pedidos recusados, arquivados ou sem briefing com mais de 12 meses.</p><button class="btn btn--danger" type="button" id="lp">Apagar pedidos antigos</button></section>` : ''}</div>`;
    $('#bk').onclick = async () => {
      const b = $('#bk'); b.disabled = true; b.textContent = 'Exportando…'; const out = { exportadoEm: new Date().toISOString(), por: S.email };
      for (const c of cols) { try { out[c] = await listar(c, true); } catch { out[c] = 'sem permissão'; } }
      const blob = new Blob([JSON.stringify(out, (k, v2) => (v2 && v2.toMillis) ? new Date(v2.toMillis()).toISOString() : v2, 2)], { type: 'application/json' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `bourbon-backup-${new Date().toISOString().slice(0, 10)}.json`; a.click();
      auditar('exportou backup', 'dados'); b.disabled = false; b.textContent = 'Baixar backup completo';
    };
    if ($('#lp')) $('#lp').onclick = async () => {
      const lim = Date.now() - 365 * 864e5;
      const velhos = (await listar('pedidos', true)).filter(p => ['recusado', 'arquivado', 'identificado'].includes(etapaDe(p)) && tsMs(p.criadoEm) < lim);
      if (!velhos.length) return toast('Nenhum pedido com mais de 12 meses para apagar.');
      if (!(await confirmar({ titulo: `Apagar ${velhos.length} pedidos antigos?`, texto: 'Não dá para desfazer. Exporte um backup antes se precisar.', ok: 'Apagar', perigo: true, digitar: 'APAGAR' }))) return;
      try { for (const p of velhos) await S.F.deleteDoc(docRef('pedidos', p._id)); limparCache('pedidos'); auditar('apagou pedidos antigos', 'pedidos', String(velhos.length)); toast('Pedidos apagados.'); } catch (e) { falha(e); }
    };
  }
});
