<style>
/* Bourbon Command Center: usa os tokens de site.css (preto Apple Pro, grafite, dourado discreto) */
:root{--side:248px;--top:60px;--cc-line:rgba(255,255,255,.08);--cc-line-2:rgba(255,255,255,.14);--cc-panel:#111112;--cc-tile:#161617;--cc-hover:#1d1d1f;--ok:#30D158;--warn:#FFD60A;--bad:#FF6961;--info:#64D2FF}
html,body{background:#000}
body.cc{min-height:100svh;color:var(--text);-webkit-font-smoothing:antialiased}
.cc *{box-sizing:border-box}
.cc [hidden]{display:none!important}
.cc button:not(.btn){font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.cc button.btn{font:inherit;cursor:pointer}
.cc :focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
.cc .vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- entrada ---------- */
.cc-gate{min-height:100svh;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px))}
.cc-gate-box{width:min(420px,100%);text-align:center}
.cc-gate-box img{width:44px;height:auto;margin:0 auto 22px;display:block}
.cc-gate-box h1{font-size:clamp(1.6rem,5vw,2rem);letter-spacing:-.03em;line-height:1.1;margin-bottom:10px}
.cc-gate-box p{color:var(--text-2);margin-bottom:28px;text-wrap:pretty}
.cc-gate-box .btn{width:100%;justify-content:center;margin-top:0}
.cc-gate-box small{display:block;margin-top:18px;color:var(--text-3);font-size:.8125rem;line-height:1.45;text-wrap:pretty}
.cc-google svg{width:18px;height:18px;margin-right:6px}

/* ---------- estrutura ---------- */
.cc-app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100svh}
.cc-side{position:sticky;top:0;height:100svh;overflow-y:auto;border-right:1px solid var(--cc-line);background:#050505;display:flex;flex-direction:column;padding:18px 12px calc(16px + env(safe-area-inset-bottom,0px))}
.cc-brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px;text-decoration:none;color:var(--text)}
.cc-brand img{width:26px;height:auto}
.cc-brand b{font-size:.9375rem;letter-spacing:-.01em;font-weight:600;line-height:1.1}
.cc-brand b span{display:block;font-weight:400;color:var(--text-3);font-size:.75rem;letter-spacing:.01em}
.cc-nav{display:flex;flex-direction:column;gap:18px;flex:1}
.cc-nav h2{font-size:.6875rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);padding:0 10px 6px}
.cc-nav a{display:flex;align-items:center;gap:10px;min-height:36px;padding:0 10px;border-radius:8px;color:var(--text-2);text-decoration:none;font-size:.9375rem;letter-spacing:-.01em;transition:background-color .15s,color .15s}
.cc-nav a svg{width:17px;height:17px;flex:none;opacity:.8}
.cc-nav a:hover{background:var(--cc-hover);color:var(--text)}
.cc-nav a[aria-current="page"]{background:var(--cc-tile);color:var(--text);box-shadow:inset 0 0 0 1px var(--cc-line)}
.cc-nav a .cc-count{margin-left:auto;font-size:.75rem;font-weight:600;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--gold);color:#000;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.cc-me{border-top:1px solid var(--cc-line);padding:14px 10px 0;margin-top:14px;display:flex;align-items:center;gap:10px;font-size:.8125rem}
.cc-me span{min-width:0;flex:1}
.cc-me b{display:block;font-weight:600;font-size:.875rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc-me small{color:var(--text-3)}
.cc-me button{color:var(--text-2);font-size:.8125rem;padding:6px 8px;border-radius:6px}
.cc-me button:hover{background:var(--cc-hover);color:var(--text)}

.cc-main{min-width:0;display:flex;flex-direction:column}
.cc-top{position:sticky;top:0;z-index:20;height:var(--top);display:flex;align-items:center;gap:12px;padding:0 clamp(16px,3vw,32px);background:rgba(0,0,0,.82);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--cc-line)}
.cc-top h1{font-size:1.0625rem;font-weight:600;letter-spacing:-.02em;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc-search{display:flex;align-items:center;gap:8px;min-height:36px;padding:0 12px;border-radius:999px;background:var(--cc-tile);border:1px solid var(--cc-line);color:var(--text-3);font-size:.875rem}
.cc-search svg{width:15px;height:15px}
.cc-search kbd{font:inherit;font-size:.75rem;color:var(--text-3);border:1px solid var(--cc-line-2);border-radius:5px;padding:0 5px;margin-left:10px}
.cc-icon-btn{position:relative;width:36px;height:36px;border-radius:999px;display:grid;place-items:center;color:var(--text-2)}
.cc-icon-btn:hover{background:var(--cc-hover);color:var(--text)}
.cc-icon-btn svg{width:19px;height:19px}
.cc-dot{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 2px #000}
.cc-menu-btn{display:none}
.cc-view{padding:clamp(20px,3vw,36px) clamp(16px,3vw,32px) calc(48px + env(safe-area-inset-bottom,0px));width:100%;max-width:1320px}
.cc-view:focus{outline:none}

/* ---------- blocos ---------- */
.cc-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px;margin-bottom:22px}
.cc-head h2{font-size:clamp(1.5rem,3vw,2rem);letter-spacing:-.035em;line-height:1.08;font-weight:700}
.cc-head p{color:var(--text-2);margin-top:6px;max-width:62ch;text-wrap:pretty}
.cc-actions{display:flex;flex-wrap:wrap;gap:8px}
.cc .btn{margin-top:0;min-height:40px;padding:0 18px;font-size:.9375rem}
.cc .btn--sm{min-height:34px;padding:0 14px;font-size:.875rem}
.cc .btn--danger{background:transparent;color:var(--bad);box-shadow:inset 0 0 0 1px rgba(255,105,97,.45)}
.cc .btn--danger:hover{background:rgba(255,105,97,.1)}
.cc .btn[disabled]{opacity:.45;pointer-events:none}
.cc-grid{display:grid;gap:12px}
.cc-kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:1px;background:var(--cc-line);border:1px solid var(--cc-line);border-radius:14px;overflow:hidden;margin-bottom:20px}
.cc-kpi{background:var(--cc-panel);padding:16px 18px;min-width:0}
.cc-kpi dt{font-size:.8125rem;color:var(--text-3);display:flex;gap:6px;align-items:center}
.cc-kpi dd{font-size:clamp(1.5rem,2.6vw,1.9rem);font-weight:650;letter-spacing:-.035em;margin-top:4px;font-variant-numeric:tabular-nums;line-height:1.1}
.cc-kpi small{display:block;font-size:.75rem;color:var(--text-3);margin-top:4px;line-height:1.35}
.cc-panel{background:var(--cc-panel);border:1px solid var(--cc-line);border-radius:14px;padding:18px;min-width:0}
.cc-panel>h3{font-size:.9375rem;font-weight:600;letter-spacing:-.01em;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.cc-panel>h3 small{font-weight:400;color:var(--text-3);font-size:.75rem}
.cc-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr));gap:12px;margin-bottom:12px}
.cc-split{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}
@media (max-width:900px){.cc-split{grid-template-columns:minmax(0,1fr)}}
.cc-note{font-size:.8125rem;color:var(--text-3);line-height:1.45;text-wrap:pretty}
.cc-note b{color:var(--text-2);font-weight:600}
.cc-empty{padding:40px 16px;text-align:center;color:var(--text-2)}
.cc-empty b{display:block;color:var(--text);font-size:1.0625rem;margin-bottom:6px}
.cc-empty .btn{margin-top:16px}

/* listas e tabelas */
.cc-toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.cc-toolbar input[type=search]{flex:1;min-width:180px}
.cc-seg{display:inline-flex;padding:3px;border-radius:999px;background:var(--cc-tile);border:1px solid var(--cc-line);flex-wrap:wrap}
.cc-seg button{min-height:30px;padding:0 12px;border-radius:999px;font-size:.8125rem;color:var(--text-2);white-space:nowrap}
.cc-seg button[aria-pressed="true"]{background:var(--text);color:#000;font-weight:600}
.cc-table-wrap{overflow-x:auto;border:1px solid var(--cc-line);border-radius:14px;background:var(--cc-panel)}
.cc-table{width:100%;border-collapse:collapse;font-size:.875rem;min-width:640px}
.cc-table th{text-align:left;font-weight:500;color:var(--text-3);font-size:.75rem;padding:10px 14px;border-bottom:1px solid var(--cc-line);white-space:nowrap}
.cc-table td{padding:12px 14px;border-bottom:1px solid var(--cc-line);vertical-align:middle}
.cc-table tr:last-child td{border-bottom:0}
.cc-table tbody tr{cursor:pointer;transition:background-color .12s}
.cc-table tbody tr:hover{background:var(--cc-hover)}
.cc-table td b{font-weight:600}
.cc-table td small{display:block;color:var(--text-3);font-size:.75rem;margin-top:2px}
.cc-num{font-variant-numeric:tabular-nums;white-space:nowrap}
.cc-list{display:grid;gap:8px}
.cc-row{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:12px 14px;border-radius:12px;background:var(--cc-panel);border:1px solid var(--cc-line);transition:background-color .12s,border-color .12s;min-width:0}
.cc a.cc-row,.cc a.cc-card,.cc a.cc-alert,.cc .cc-quick a,.cc-row .cc-pill{text-decoration:none;color:var(--text)}
.cc-row:hover{background:var(--cc-hover);border-color:var(--cc-line-2)}
.cc-row>span:not(.cc-pill){min-width:0;flex:1}
.cc-row>.cc-pill{flex:none}
.cc-row b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc-row small{display:block;color:var(--text-3);font-size:.8125rem;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc-thumb{width:96px;aspect-ratio:16/9;border-radius:8px;object-fit:cover;background:var(--cc-tile);flex:none}
.cc-thumb--v{width:54px;aspect-ratio:9/16}
.cc-pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font-size:.75rem;font-weight:600;white-space:nowrap;background:var(--cc-tile);color:var(--text-2);box-shadow:inset 0 0 0 1px var(--cc-line-2)}
.cc-pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.cc-pill--gold{color:var(--gold)}
.cc-pill--ok{color:var(--ok)}
.cc-pill--warn{color:var(--warn)}
.cc-pill--bad{color:var(--bad)}
.cc-pill--info{color:var(--info)}
.cc-pill--mute{color:var(--text-3)}

/* kanban */
.cc-kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(260px,1fr);gap:10px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x proximity}
.cc-col{background:#0a0a0b;border:1px solid var(--cc-line);border-radius:14px;padding:10px;min-height:120px;scroll-snap-align:start;display:flex;flex-direction:column;gap:8px}
.cc-col h3{font-size:.8125rem;font-weight:600;color:var(--text-2);display:flex;justify-content:space-between;padding:4px 4px 6px}
.cc-col h3 span{color:var(--text-3);font-variant-numeric:tabular-nums}
.cc-card{display:block;width:100%;text-align:left;padding:12px;border-radius:10px;background:var(--cc-panel);border:1px solid var(--cc-line);transition:border-color .12s,background-color .12s}
.cc-card:hover{border-color:var(--cc-line-2);background:var(--cc-hover)}
.cc-card b{display:block;font-size:.9375rem;font-weight:600;letter-spacing:-.01em}
.cc-card small{display:block;color:var(--text-3);font-size:.75rem;margin-top:3px;line-height:1.35}
.cc-card .cc-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.cc-card.is-late{border-color:rgba(255,214,10,.45)}

/* formulários */
.cc-form{display:grid;gap:14px}
.cc-f2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cc-f3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.cc-field{display:flex;flex-direction:column;gap:6px;min-width:0}
.cc-field label,.cc-label{font-size:.8125rem;font-weight:600;color:var(--text-2)}
.cc-field label span{font-weight:400;color:var(--text-3)}
.cc input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=file]),.cc select,.cc textarea{font:inherit;font-size:.9375rem;color:var(--text);background:#0c0c0d;border:1px solid var(--cc-line-2);border-radius:10px;padding:10px 12px;min-height:42px;width:100%;transition:border-color .15s}
.cc select{appearance:none;-webkit-appearance:none;background-color:#0c0c0d;color:var(--text);background-image:linear-gradient(45deg,transparent 50%,var(--text-3) 50%),linear-gradient(135deg,var(--text-3) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.cc textarea{resize:vertical;min-height:92px;line-height:1.45}
.cc input:focus-visible,.cc select:focus-visible,.cc textarea:focus-visible{outline:none;border-color:var(--gold)}
.cc input::placeholder,.cc textarea::placeholder{color:#6e6e73}
.cc [aria-invalid="true"]{border-color:var(--bad)!important}
.cc-check{display:flex;gap:10px;align-items:flex-start;font-size:.875rem;color:var(--text-2);cursor:pointer;line-height:1.4}
.cc-check input{width:18px;height:18px;accent-color:var(--gold);flex:none;margin-top:1px}
.cc-chips{display:flex;flex-wrap:wrap;gap:6px}
.cc-chips label{cursor:pointer}
.cc-chips input{position:absolute;opacity:0;width:1px;height:1px}
.cc-chips span{display:inline-flex;align-items:center;min-height:32px;padding:0 12px;border-radius:999px;font-size:.8125rem;background:var(--cc-tile);box-shadow:inset 0 0 0 1px var(--cc-line-2);color:var(--text-2)}
.cc-chips input:checked+span{background:var(--text);color:#000;box-shadow:none;font-weight:600}
.cc-chips input:focus-visible+span{outline:2px solid var(--gold);outline-offset:2px}
.cc details{border-top:1px solid var(--cc-line);padding-top:12px}
.cc summary{cursor:pointer;font-size:.875rem;font-weight:600;color:var(--text-2);list-style:none}
.cc summary::-webkit-details-marker{display:none}
.cc summary::before{content:"+";display:inline-block;width:16px;color:var(--gold)}
.cc details[open] summary::before{content:"−"}
.cc details>.cc-form{margin-top:12px}
.cc-err{color:var(--bad);font-size:.8125rem;min-height:1em}
.cc-range{display:grid;grid-template-columns:110px 1fr 56px;gap:10px;align-items:center;font-size:.8125rem;color:var(--text-2)}
.cc-range input{accent-color:var(--gold);width:100%}
.cc-range output{text-align:right;font-variant-numeric:tabular-nums;color:var(--text)}

/* painel lateral de edição */
.cc-sheet{position:fixed;inset:0 0 0 auto;margin:0;height:100%;max-height:100%;width:min(720px,100vw);max-width:100vw;border:0;padding:0;background:#0a0a0b;color:var(--text);border-left:1px solid var(--cc-line);box-shadow:-30px 0 80px rgba(0,0,0,.6)}
.cc-sheet::backdrop{background:rgba(0,0,0,.6);backdrop-filter:blur(2px)}
.cc-sheet[open]{display:flex;flex-direction:column}
@media (prefers-reduced-motion:no-preference){.cc-sheet[open]{animation:ccIn .32s var(--spring) both}@keyframes ccIn{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}}
.cc-sheet-head{display:flex;align-items:center;gap:12px;padding:14px 18px calc(14px);border-bottom:1px solid var(--cc-line);padding-top:max(14px,env(safe-area-inset-top,0px))}
.cc-sheet-head h2{flex:1;font-size:1.0625rem;font-weight:600;letter-spacing:-.02em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc-sheet-body{flex:1;overflow-y:auto;padding:18px;overscroll-behavior:contain}
.cc-sheet-foot{display:flex;flex-wrap:wrap;gap:8px;padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--cc-line);background:#0a0a0b}
.cc-sheet-foot .cc-spacer{flex:1}

/* confirmação */
.cc-confirm{border:0;padding:0;border-radius:18px;background:var(--cc-panel);color:var(--text);width:min(420px,calc(100vw - 32px));box-shadow:0 30px 80px rgba(0,0,0,.7),inset 0 0 0 1px var(--cc-line-2)}
.cc-confirm::backdrop{background:rgba(0,0,0,.6)}
.cc-confirm form{padding:22px;display:grid;gap:14px}
.cc-confirm h2{font-size:1.125rem;letter-spacing:-.02em}
.cc-confirm p{color:var(--text-2);font-size:.9375rem;text-wrap:pretty}
.cc-confirm .cc-actions{justify-content:flex-end}

/* busca global */
.cc-palette{border:0;padding:0;margin:12vh auto auto;border-radius:16px;background:var(--cc-panel);color:var(--text);width:min(620px,calc(100vw - 24px));box-shadow:0 30px 80px rgba(0,0,0,.7),inset 0 0 0 1px var(--cc-line-2)}
.cc-palette::backdrop{background:rgba(0,0,0,.55)}
.cc-palette input{border:0!important;border-bottom:1px solid var(--cc-line)!important;border-radius:0!important;background:transparent!important;font-size:1.0625rem!important;padding:16px 18px!important;min-height:56px!important}
.cc-palette ul{list-style:none;max-height:min(420px,60svh);overflow-y:auto;padding:6px}
.cc-palette li a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--text);text-decoration:none;font-size:.9375rem}
.cc-palette li a small{margin-left:auto;color:var(--text-3);font-size:.75rem}
.cc-palette li a[aria-selected="true"],.cc-palette li a:hover{background:var(--cc-hover)}

/* toasts */
.cc-toasts{position:fixed;z-index:80;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:grid;gap:8px;width:min(440px,calc(100vw - 32px));pointer-events:none}
.cc-toast{pointer-events:auto;background:#f5f5f7;color:#000;border-radius:12px;padding:12px 16px;font-size:.875rem;font-weight:500;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.cc-toast.is-bad{background:var(--bad);color:#000}
@media (prefers-reduced-motion:no-preference){.cc-toast{animation:ccT .3s var(--spring) both}@keyframes ccT{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}}

/* gráficos simples */
.cc-bars{display:grid;gap:8px}
.cc-bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:.8125rem}
.cc-bar span{color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc-bar b{font-variant-numeric:tabular-nums;font-weight:600}
.cc-bar i{grid-column:1 / -1;height:6px;border-radius:3px;background:var(--cc-tile);overflow:hidden;display:block}
.cc-bar i::after{content:"";display:block;height:100%;width:var(--w);background:var(--text-2);border-radius:3px}
.cc-bar.is-gold i::after{background:var(--gold)}
.cc-spark{width:100%;height:120px;display:block}
.cc-spark path.l{fill:none;stroke:var(--gold);stroke-width:2;vector-effect:non-scaling-stroke}
.cc-spark path.a{fill:url(#ccg);opacity:.35}
.cc-spark line{stroke:var(--cc-line);stroke-width:1;vector-effect:non-scaling-stroke}
.cc-funnel{display:grid;gap:6px}
.cc-funnel div{display:grid;grid-template-columns:150px 1fr 60px;gap:10px;align-items:center;font-size:.8125rem}
.cc-funnel span{color:var(--text-2)}
.cc-funnel i{height:22px;border-radius:6px;background:var(--cc-tile);display:block;overflow:hidden}
.cc-funnel i::after{content:"";display:block;height:100%;width:var(--w);background:linear-gradient(90deg,rgba(245,160,32,.85),rgba(245,160,32,.45))}
.cc-funnel b{text-align:right;font-variant-numeric:tabular-nums}
.cc-alerts{display:grid;gap:8px}
.cc-alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:var(--cc-tile);text-decoration:none;color:var(--text);font-size:.875rem;line-height:1.4}
.cc-alert::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--warn);margin-top:6px;flex:none}
.cc-alert.is-bad::before{background:var(--bad)}
.cc-alert.is-info::before{background:var(--info)}
.cc-alert:hover{background:var(--cc-hover)}
.cc-alert small{display:block;color:var(--text-3);font-size:.75rem}
.cc-quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;margin-bottom:20px}
.cc-quick a{display:flex;flex-direction:column;gap:2px;padding:14px;border-radius:12px;background:var(--cc-panel);border:1px solid var(--cc-line);text-decoration:none;color:var(--text);font-weight:600;font-size:.9375rem;letter-spacing:-.01em}
.cc-quick a small{font-weight:400;color:var(--text-3);font-size:.75rem}
.cc-quick a:hover{border-color:var(--cc-line-2);background:var(--cc-hover)}

/* detalhe de pedido */
.cc-dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:1px;background:var(--cc-line);border:1px solid var(--cc-line);border-radius:12px;overflow:hidden}
.cc-dl>div{background:var(--cc-panel);padding:12px 14px;min-width:0}
.cc-dl dt{font-size:.75rem;color:var(--text-3);margin-bottom:3px}
.cc-dl dd{font-weight:600;font-size:.9375rem;overflow-wrap:anywhere;white-space:pre-line}
.cc-hist{list-style:none;display:grid;gap:8px}
.cc-hist li{padding:10px 12px;border-radius:10px;background:var(--cc-tile);font-size:.875rem;color:var(--text-2);line-height:1.45}
.cc-hist li b{color:var(--text);font-weight:600}
.cc-hist time{display:block;font-size:.75rem;color:var(--text-3);font-variant-numeric:tabular-nums}

/* marcas: prévia exata do grid do site */
.cc-brand-prev{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;padding:0}
.cc-brand-prev li{flex:0 0 calc((100% - 24px) / 3);background:var(--bg-3);border-radius:var(--radius);aspect-ratio:5/2;display:flex;align-items:center;justify-content:center;padding:18px;list-style:none;position:relative}
.cc-brand-prev img{width:auto;height:var(--h);max-width:82%;object-fit:contain;filter:var(--mark-filter);opacity:var(--mark-op)}
.cc-brand-prev li.is-orig img{filter:none;opacity:1}
.cc-brand-prev li.is-sel{box-shadow:inset 0 0 0 2px var(--gold)}
.cc-brand-prev .cc-tag{position:absolute;left:8px;top:8px}
.cc-logo-lab{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.cc-checker{border-radius:12px;aspect-ratio:3/2;display:flex;align-items:center;justify-content:center;padding:16px;background-color:#2a2a2c;background-image:linear-gradient(45deg,#333 25%,transparent 25%),linear-gradient(-45deg,#333 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#333 75%),linear-gradient(-45deg,transparent 75%,#333 75%);background-size:16px 16px;background-position:0 0,0 8px,8px -8px,-8px 0}
.cc-checker img{max-width:100%;max-height:100%;object-fit:contain}
.cc-cell-demo{display:grid;grid-template-columns:2fr 1fr;gap:8px;align-items:end}
.cc-cell-demo .brands-cell{background:var(--bg-3);border-radius:var(--radius);display:flex;align-items:center;justify-content:center;padding:12px}
.cc-cell-demo img{width:auto;max-width:82%;object-fit:contain}
.cc-analysis{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px;font-size:.8125rem}
.cc-analysis div{background:var(--cc-tile);border-radius:8px;padding:8px 10px}
.cc-analysis dt{color:var(--text-3);font-size:.6875rem}
.cc-analysis dd{font-weight:600;font-variant-numeric:tabular-nums}
.cc-warns{display:grid;gap:6px;margin-top:8px}
.cc-warns p{font-size:.8125rem;color:var(--warn);display:flex;gap:8px}
.cc-drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:26px 16px;border-radius:12px;border:1px dashed var(--cc-line-2);text-align:center;color:var(--text-2);font-size:.875rem;cursor:pointer;transition:border-color .15s,background-color .15s}
.cc-drop.is-over,.cc-drop:hover{border-color:var(--gold);background:rgba(245,160,32,.05)}
.cc-drop b{color:var(--text)}
.cc-drop input{position:absolute;opacity:0;width:1px;height:1px}

/* prévia de depoimento e galeria com o CSS do site */
.cc-prev{border:1px solid var(--cc-line);border-radius:14px;padding:16px;background:#000}
.cc-prev .quote{max-width:420px}
.cc-prev .gal{margin:0;max-width:360px}
.cc-prev-label{font-size:.75rem;color:var(--text-3);margin-bottom:8px;display:block}
.cc-share{max-width:380px;border-radius:12px;overflow:hidden;background:#1f2c33;font-size:.8125rem}
.cc-share img{width:100%;aspect-ratio:1.91/1;object-fit:cover;display:block;background:#111}
.cc-share div{padding:8px 10px}
.cc-share b{display:block;color:#e9edef;font-weight:600}
.cc-share p{color:#8696a0;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cc-share small{color:#8696a0}

/* menu inferior no celular */
.cc-tabbar{display:none}

@media (max-width:1023px){
  .cc-app{grid-template-columns:1fr}
  .cc-side{position:fixed;z-index:60;inset:0 auto 0 0;width:min(300px,86vw);transform:translateX(-102%);transition:transform .3s var(--spring);box-shadow:30px 0 80px rgba(0,0,0,.6);visibility:hidden}
  .cc-side.is-open{transform:none;visibility:visible}
  .cc-scrim{position:fixed;inset:0;z-index:55;background:rgba(0,0,0,.55)}
  .cc-menu-btn{display:grid}
  .cc-search span,.cc-search kbd{display:none}
  .cc-search{width:36px;height:36px;padding:0;justify-content:center;border-radius:999px}
  .cc-view{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
  .cc-tabbar{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;z-index:40;left:0;right:0;bottom:0;padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px));background:rgba(10,10,11,.92);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--cc-line)}
  .cc .cc-tabbar a,.cc .cc-tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:48px;justify-content:center;font-size:.6875rem;color:var(--text-3);text-decoration:none;position:relative}
  .cc-tabbar svg{width:21px;height:21px}
  .cc-tabbar [aria-current="page"]{color:var(--gold)}
  .cc-tabbar .cc-dot{top:4px;right:calc(50% - 16px)}
}
@media (max-width:760px){.cc-brand-prev{gap:8px}.cc-brand-prev li{flex-basis:calc((100% - 8px) / 2);aspect-ratio:3/2;padding:12px}.cc-brand-prev img{height:calc(var(--h) * .5)}}
@media (max-width:640px){
  .cc-f2,.cc-f3{grid-template-columns:1fr}
  .cc-logo-lab{grid-template-columns:1fr}
  .cc-funnel div{grid-template-columns:110px 1fr 44px}
  .cc-thumb{width:72px}
  .cc-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cc-sheet{width:100vw;border-left:0}
  .cc-head .cc-actions{width:100%}
  .cc-head .cc-actions .btn{flex:1}
  .cc-range{grid-template-columns:90px 1fr 48px}
}

</style>

<script type="module">
/* ============ Bourbon Command Center: núcleo ============
   As permissões abaixo só organizam a interface. Quem decide o acesso de verdade
   são as regras do Firestore (firestore.rules), conferidas no servidor a cada operação. */
import { firebaseConfig, ADMIN_EMAILS } from './assets/js/firebase-config.js';

const FBV = 'https://www.gstatic.com/firebasejs/10.14.1/';
const OWNERS = (ADMIN_EMAILS || []).map(e => e.toLowerCase());
const PAPEIS = {
  owner: { nome: 'Proprietário', mods: ['painel', 'conteudo', 'crm', 'analytics', 'equipe', 'config', 'auditoria'] },
  admin: { nome: 'Administrador', mods: ['painel', 'conteudo', 'crm', 'analytics', 'equipe', 'config', 'auditoria'] },
  editor: { nome: 'Editor', mods: ['painel', 'conteudo'] },
  comercial: { nome: 'Comercial', mods: ['painel', 'crm'] },
  marketing: { nome: 'Marketing', mods: ['painel', 'conteudo', 'analytics'] },
  leitura: { nome: 'Leitura', mods: ['painel', 'analytics'] }
};
const MOD_NOMES = { painel: 'Painel', conteudo: 'Conteúdo do site', crm: 'Comercial', analytics: 'Estatísticas', equipe: 'Equipe', config: 'Integrações e configurações', auditoria: 'Auditoria' };

const S = { user: null, email: '', nome: '', papel: '', mods: new Set(), F: null, U: null, db: null, auth: null, cache: {}, modulos: [] };
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const attr = esc;
const pode = (m) => S.mods.has(m);
const edita = (m) => S.mods.has(m) && S.papel !== 'leitura';
const norm = (s) => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
const tsMs = (t) => !t ? 0 : t.toMillis ? t.toMillis() : t.seconds ? t.seconds * 1000 : typeof t === 'string' ? Date.parse(t) || 0 : Number(t) || 0;
const DTF = new Intl.DateTimeFormat('pt-BR', { dateStyle: 'short', timeStyle: 'short' });
const DF = new Intl.DateTimeFormat('pt-BR', { dateStyle: 'medium' });
const NF = new Intl.NumberFormat('pt-BR');
const BRL = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 0 });
const quando = (t) => { const ms = tsMs(t); return ms ? DTF.format(new Date(ms)) : ''; };
const dia = (t) => { const ms = tsMs(t); return ms ? DF.format(new Date(ms)) : ''; };
const relativo = (t) => {
  const ms = tsMs(t); if (!ms) return '';
  const d = Date.now() - ms, m = Math.round(d / 60000);
  if (m < 1) return 'agora'; if (m < 60) return `há ${m} min`;
  const h = Math.round(m / 60); if (h < 24) return `há ${h} h`;
  const dd = Math.round(h / 24); if (dd < 30) return `há ${dd} ${dd === 1 ? 'dia' : 'dias'}`;
  return dia(t);
};
const b64url = (obj) => { const by = new TextEncoder().encode(JSON.stringify(obj)); let x = ''; by.forEach(b => x += String.fromCharCode(b)); return btoa(x).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };
const gerarIdPedido = () => {
  const d = new Date(), p = n => String(n).padStart(2, '0'), a = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  const r = crypto.getRandomValues(new Uint8Array(4));
  return `BF-${String(d.getFullYear()).slice(2)}${p(d.getMonth() + 1)}${p(d.getDate())}-${Array.from(r, b => a[b % a.length]).join('')}`;
};
const safeUrl = (u) => /^https:\/\//i.test(String(u || '').trim()) ? String(u).trim() : '';

/* ---------- interface ---------- */
function toast(msg, ruim = false) {
  const t = document.createElement('div'); t.className = 'cc-toast' + (ruim ? ' is-bad' : ''); t.textContent = msg;
  $('#cc-toasts').appendChild(t); setTimeout(() => t.remove(), ruim ? 6000 : 3200);
}
function erroTxt(e) {
  const c = (e && e.code) || '';
  if (c.includes('permission-denied')) return 'Sem permissão para isso. Se você deveria ter, peça ao proprietário para revisar seu acesso. [permission-denied]';
  if (c.includes('unavailable') || c.includes('network')) return 'Sem conexão com o banco agora. Confira a internet e tente de novo.';
  if (c.includes('resource-exhausted')) return 'O limite gratuito diário do Firebase foi atingido. Tente amanhã ou revise o volume. [resource-exhausted]';
  return 'Algo deu errado. [' + (c || (e && e.message) || 'erro') + ']';
}
function falha(e) { console.error(e); toast(erroTxt(e), true); }
function confirmar({ titulo, texto, ok = 'Confirmar', perigo = false, digitar = '', campo = '' }) {
  return new Promise(res => {
    const d = $('#cc-confirm'); $('#cf-t').textContent = titulo; $('#cf-p').textContent = texto || '';
    const okb = $('#cf-ok'); okb.textContent = ok; okb.className = 'btn btn--sm ' + (perigo ? 'btn--danger' : 'btn--primary');
    const box = $('#cf-type'), inp = $('#cf-in'); box.hidden = !digitar && !campo; inp.value = ''; inp.oninput = null; inp.placeholder = campo || '';
    if (digitar) { $('#cf-lbl').textContent = `Para confirmar, digite ${digitar}`; okb.disabled = true; inp.oninput = () => { okb.disabled = inp.value.trim().toUpperCase() !== digitar; }; }
    else if (campo) { $('#cf-lbl').textContent = 'Resposta'; okb.disabled = true; inp.oninput = () => { okb.disabled = !inp.value.trim(); }; }
    else okb.disabled = false;
    d.returnValue = '';
    d.onclose = () => res(d.returnValue === 'sim' ? (campo ? inp.value.trim() : true) : false);
    d.showModal(); (digitar || campo ? inp : okb).focus();
  });
}
let sheetClose = null;
function abrirSheet(titulo, corpoHTML, rodapeHTML, aoFechar) {
  const d = $('#cc-sheet'); $('#sheet-t').textContent = titulo;
  $('#sheet-body').innerHTML = corpoHTML; $('#sheet-foot').innerHTML = rodapeHTML || '';
  $('#sheet-foot').hidden = !rodapeHTML;
  sheetClose = aoFechar || null;
  if (!d.open) d.showModal();
  $('#sheet-body').scrollTop = 0;
  const f = $('#sheet-body input:not([type=hidden]):not([type=file]), #sheet-body select, #sheet-body textarea');
  if (f && matchMedia('(pointer: fine)').matches) f.focus({ preventScroll: true });
  return { body: $('#sheet-body'), foot: $('#sheet-foot') };
}
function fecharSheet() { const d = $('#cc-sheet'); if (d.open) d.close(); }
$('#cc-sheet').addEventListener('close', () => { const f = sheetClose; sheetClose = null; if (f) f(); });
$('#sheet-x').addEventListener('click', fecharSheet);
$('#cc-sheet').addEventListener('click', (e) => { if (e.target.id === 'cc-sheet') fecharSheet(); });

/* ---------- Firebase ---------- */
async function carregarFirebase() {
  const [A, U, F] = await Promise.all([import(FBV + 'firebase-app.js'), import(FBV + 'firebase-auth.js'), import(FBV + 'firebase-firestore.js')]);
  const app = A.getApps().length ? A.getApp() : A.initializeApp(firebaseConfig);
  S.F = F; S.U = U; S.db = F.getFirestore(app); S.auth = U.getAuth(app); S.auth.languageCode = 'pt';
}
const col = (n) => S.F.collection(S.db, n);
const docRef = (n, id) => S.F.doc(S.db, n, id);
async function listar(n, forcar = false) {
  if (!forcar && S.cache[n]) return S.cache[n];
  const snap = await S.F.getDocs(col(n));
  S.cache[n] = snap.docs.map(d => ({ ...d.data(), _id: d.id }));
  return S.cache[n];
}
const limparCache = (...ns) => ns.forEach(n => delete S.cache[n]);
async function auditar(acao, alvo = '', detalhe = '') {
  try { await S.F.addDoc(col('auditoria'), { quem: S.email, acao: String(acao).slice(0, 60), alvo: String(alvo).slice(0, 200), detalhe: String(detalhe).slice(0, 500), em: S.F.serverTimestamp() }); } catch (e) { console.warn('auditoria', e); }
}
async function guardarVersao(colecao, id, dados) {
  try { await S.F.addDoc(col('versoes'), { colecao, docId: id, dados: JSON.parse(JSON.stringify(dados, (k, v) => (v && v.toMillis) ? v.toMillis() : v)), por: S.email, em: S.F.serverTimestamp() }); } catch (e) { console.warn('versao', e); }
}
/* salva um documento guardando a versão anterior e registrando na auditoria */
async function salvarDoc(colecao, id, dados, acao, rotulo) {
  const F = S.F;
  const payload = { ...dados, atualizadoEm: F.serverTimestamp(), atualizadoPor: S.email };
  let ref;
  if (id) {
    const ant = (S.cache[colecao] || []).find(x => x._id === id);
    if (ant) { const { _id, ...resto } = ant; await guardarVersao(colecao, id, resto); }
    ref = docRef(colecao, id); await F.setDoc(ref, payload, { merge: true });
  } else {
    ref = await F.addDoc(col(colecao), { ...payload, criadoEm: F.serverTimestamp(), criadoPor: S.email });
  }
  limparCache(colecao);
  auditar(acao || (id ? 'editou' : 'criou'), `${colecao}/${ref.id}`, rotulo || '');
  return ref.id;
}
async function excluirDoc(colecao, id, rotulo) {
  const ant = (S.cache[colecao] || []).find(x => x._id === id);
  if (ant) { const { _id, ...resto } = ant; await guardarVersao(colecao, id, resto); }
  await S.F.deleteDoc(docRef(colecao, id));
  limparCache(colecao);
  auditar('excluiu', `${colecao}/${id}`, rotulo || '');
}

async function abrirBusca() {
  const d = $('#cc-palette'), inp = $('#pal-in'), ul = $('#pal-list');
  inp.value = ''; d.showModal(); inp.focus();
  const fontes = [];
  S.modulos.filter(m => pode(m.mod)).forEach(m => fontes.push({ t: m.titulo, s: 'Ir para', href: '#/' + m.id }));
  const carregarSe = async (mod, n, fn) => { if (pode(mod)) { try { (await listar(n)).forEach(x => fontes.push(fn(x))); } catch {} } };
  await Promise.all([
    carregarSe('crm', 'pedidos', p => ({ t: (p.contato?.empresa || p.contato?.nome || p._id), s: 'Pedido ' + p._id, href: '#/comercial/' + p._id, k: [p._id, p.contato?.nome, p.contato?.email, p.contato?.whatsapp].join(' ') })),
    carregarSe('crm', 'propostas', p => ({ t: p.titulo || 'Proposta', s: 'Proposta', href: '#/propostas/' + p._id, k: p.cliente })),
    carregarSe('conteudo', 'trabalhos', p => ({ t: p.titulo, s: 'Trabalho', href: '#/trabalhos/' + p._id, k: p.cliente })),
    carregarSe('conteudo', 'marcas', p => ({ t: p.nome, s: 'Marca', href: '#/marcas/' + p._id })),
    carregarSe('conteudo', 'depoimentos', p => ({ t: p.autor, s: 'Depoimento', href: '#/depoimentos/' + p._id, k: p.texto }))
  ]);
  let sel = 0, vis = [];
  const desenhar = () => {
    const q = norm(inp.value);
    vis = (q ? fontes.filter(f => norm(f.t + ' ' + (f.k || '') + ' ' + f.s).includes(q)) : fontes.filter(f => f.s === 'Ir para')).slice(0, 30);
    sel = Math.min(sel, Math.max(0, vis.length - 1));
    ul.innerHTML = vis.length ? vis.map((f, i) => `<li><a href="${attr(f.href)}" role="option" aria-selected="${i === sel}">${esc(f.t)}<small>${esc(f.s)}</small></a></li>`).join('') : '<li><p class="cc-note" style="padding:12px">Nada encontrado.</p></li>';
  };
  inp.oninput = () => { sel = 0; desenhar(); };
  inp.onkeydown = (e) => {
    if (e.key === 'ArrowDown') { sel = Math.min(sel + 1, vis.length - 1); desenhar(); e.preventDefault(); }
    else if (e.key === 'ArrowUp') { sel = Math.max(sel - 1, 0); desenhar(); e.preventDefault(); }
    else if (e.key === 'Enter' && vis[sel]) { location.hash = vis[sel].href; d.close(); }
    else if (e.key === 'Escape') { e.preventDefault(); d.close(); }
  };
  ul.onclick = (e) => { if (e.target.closest('a')) d.close(); };
  d.onclick = (e) => { if (e.target === d) d.close(); };
  desenhar();
}

async function autorizar(user) {
  S.user = null;
  const email = (user.email || '').toLowerCase();
  if (!user.emailVerified || !email) return negado('Esta conta não tem e-mail verificado.');
  S.email = email; S.nome = user.displayName || email;
  if (OWNERS.includes(email)) { S.papel = 'owner'; S.mods = new Set(PAPEIS.owner.mods); return entrar(user); }
  let ficha = null;
  try { const s = await S.F.getDoc(docRef('equipe', email)); ficha = s.exists() ? s.data() : null; }
  catch (e) { return negado('Não foi possível conferir seu acesso agora. ' + erroTxt(e)); }
  if (!ficha) return negado(`A conta ${email} não está na equipe do Command Center.`);
  if (ficha.status === 'suspenso') return negado('Seu acesso está suspenso. Fale com o proprietário.');
  if (ficha.status === 'convidado') {
    if (tsMs(ficha.expiraEm) < Date.now()) return negado('Seu convite expirou. Peça ao proprietário para reenviar.');
    try {
      await S.F.updateDoc(docRef('equipe', email), { status: 'ativo', uid: user.uid, aceitoEm: S.F.serverTimestamp(), ultimoAcesso: S.F.serverTimestamp() });
      ficha.status = 'ativo';
    } catch (e) { return negado('Não foi possível aceitar o convite. ' + erroTxt(e)); }
    S.papel = ficha.papel; S.mods = new Set(ficha.modulos || PAPEIS[ficha.papel]?.mods || []);
    await auditar('aceitou convite', 'equipe/' + email, ficha.papel);
    return entrar(user);
  }
  if (ficha.status !== 'ativo') return negado('Seu acesso não está ativo.');
  S.papel = ficha.papel; S.mods = new Set(ficha.modulos || PAPEIS[ficha.papel]?.mods || []);
  if (ficha.nome) S.nome = ficha.nome;
  try { await S.F.updateDoc(docRef('equipe', email), { ultimoAcesso: S.F.serverTimestamp() }); } catch {}
  return entrar(user);
}

  await navegar();
  atualizarAlertas();
}

const etapaDe = (p) => { const s = p.status === 'aguardando-cliente' ? 'negociacao' : p.status; return ETAPA[s] ? s : 'novo'; };
const pill = (txt, tom = 'mute') => `<span class="cc-pill cc-pill--${tom}">${esc(txt)}</span>`;

const ROT_ORIGEM = { 'site/montar-projeto': 'Site', whatsapp: 'WhatsApp', indicacao: 'Indicação', instagram: 'Instagram', telefone: 'Telefone', email: 'E-mail', evento: 'Evento', outro: 'Outro' };
const nomeLead = (p) => p.contato?.empresa || p.contato?.nome || p._id;

/* eventos da medição própria em um período */
async function eventosDesde(dias) {
  const chave = 'eventos-' + dias;
  if (S.cache[chave]) return S.cache[chave];
  const F = S.F, ini = new Date(); ini.setHours(0, 0, 0, 0); ini.setDate(ini.getDate() - (dias - 1));
  const snap = await F.getDocs(F.query(col('eventos'), F.where('em', '>=', F.Timestamp.fromDate(ini))));
  S.cache[chave] = snap.docs.map(d => d.data());
  return S.cache[chave];
}
const contar = (arr, fn) => { const m = new Map(); arr.forEach(x => { const k = fn(x); if (k == null) return; m.set(k, (m.get(k) || 0) + 1); }); return [...m.entries()].sort((a, b) => b[1] - a[1]); };
const barras = (pares, total, ouro = false, max = 6) => pares.length ? `<div class="cc-bars">${pares.slice(0, max).map(([k, n]) => `<div class="cc-bar${ouro ? ' is-gold' : ''}"><span>${esc(k)}</span><b>${NF.format(n)}</b><i style="--w:${Math.max(2, Math.round(n / Math.max(1, total || pares[0][1]) * 100))}%"></i></div>`).join('')}</div>` : '<p class="cc-note">Sem dados no período.</p>';
function serieDiaria(eventos, dias, tipo = 'view') {
  const out = []; const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
  for (let i = dias - 1; i >= 0; i--) { const d = new Date(hoje); d.setDate(d.getDate() - i); const k = d.toISOString().slice(0, 10); out.push([k, 0]); }
  const idx = Object.fromEntries(out.map((x, i) => [x[0], i]));
  eventos.forEach(e => { if (e.t === tipo && e.dia in idx) out[idx[e.dia]][1]++; });
  return out;
}
function sparkline(serie) {
  const max = Math.max(1, ...serie.map(x => x[1])), n = serie.length, W = 600, H = 120;
  const pts = serie.map((x, i) => [n === 1 ? W / 2 : i / (n - 1) * W, H - 8 - (x[1] / max) * (H - 24)]);
  const l = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const a = l + ` L${W} ${H} L0 ${H} Z`;
  return `<svg class="cc-spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Visitas por dia: máximo de ${max} em um dia"><defs><linearGradient id="ccg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#F5A020"/><stop offset="1" stop-color="#F5A020" stop-opacity="0"/></linearGradient></defs><line x1="0" x2="${W}" y1="${H - 8}" y2="${H - 8}"/><path class="a" d="${a}"/><path class="l" d="${l}"/></svg>`;
}

/* pendências que merecem atenção (usadas no painel e no ponto dourado do topo) */
async function calcularAlertas() {
  const out = [];
  const agora = Date.now(), H = 3600e3;
  if (pode('crm')) {
    const ped = await listar('pedidos').catch(() => []);
    ped.filter(p => etapaDe(p) === 'novo' && agora - tsMs(p.enviadoEm || p.criadoEm) > 24 * H)
      .forEach(p => out.push({ tom: 'bad', t: `${nomeLead(p)} aguarda resposta`, s: 'Pedido enviado ' + relativo(p.enviadoEm || p.criadoEm), href: '#/comercial/' + p._id }));
    ped.filter(p => ABERTOS.includes(etapaDe(p)) && p.proximaAcao?.data && Date.parse(p.proximaAcao.data) < agora)
      .forEach(p => out.push({ tom: 'warn', t: `Ação atrasada: ${p.proximaAcao.texto || 'acompanhar'}`, s: nomeLead(p), href: '#/comercial/' + p._id }));
    ped.filter(p => etapaDe(p) === 'identificado' && agora - tsMs(p.criadoEm) > 24 * H && agora - tsMs(p.criadoEm) < 15 * 24 * H)
      .forEach(p => out.push({ tom: 'info', t: `${nomeLead(p)} começou e não concluiu o briefing`, s: 'Identificou-se ' + relativo(p.criadoEm) + '. Vale um contato.', href: '#/comercial/' + p._id }));
    const prop = await listar('propostas').catch(() => []);
    prop.filter(p => p.status === 'enviada' && p.validade && Date.parse(p.validade) - agora < 5 * 24 * H)
      .forEach(p => out.push({ tom: Date.parse(p.validade) < agora ? 'bad' : 'warn', t: `Proposta ${Date.parse(p.validade) < agora ? 'vencida' : 'vence em breve'}: ${p.titulo}`, s: 'Validade ' + dia(Date.parse(p.validade)), href: '#/propostas/' + p._id }));
    contador('comercial', ped.filter(p => etapaDe(p) === 'novo').length);
  }
  if (pode('conteudo')) {
    for (const [n, rot] of [['trabalhos', 'trabalho'], ['marcas', 'marca'], ['depoimentos', 'depoimento']]) {
      const l = await listar(n).catch(() => []);
      const r = l.filter(x => x.status === 'rascunho').length;
      if (r) out.push({ tom: 'info', t: `${r} ${rot}${r > 1 ? 's' : ''} em rascunho`, s: 'Aguardando publicação', href: '#/' + n });
    }
  }
  $('#dot-alertas').hidden = !out.length;
  return out;
}

/* ============ Comercial: pedidos (CRM), propostas, clientes e área do cliente ============ */
const ROT_FMT = { horizontal: 'Horizontal', vertical: 'Vertical', ambos: 'Horizontal e vertical', 'nao-sei': 'Ainda não sei' };
const ROT_QTD = { '1': 'Um filme principal', '2-4': 'De 2 a 4 peças', '5+': '5 ou mais peças', 'nao-sei': 'Ainda não sei' };
const ROT_POS = { edicao: 'Edição com narrativa', cor: 'Tratamento de cor', som: 'Trilha e som', legendas: 'Legendas', motion: 'Animação e motion', 'voces-decidem': 'Vocês decidem' };
const ROT_PRAZO = { '': 'Sem prazo definido', '30-dias': 'Em até 30 dias', '60-dias': 'Em até 60 dias', 'data-fixa': 'Data fixa' };
const PRIOR = { alta: ['Alta', 'bad'], media: ['Média', 'warn'], baixa: ['Baixa', 'mute'] };
const foneLimpo = (w) => { const f = String(w || '').replace(/\D/g, ''); return f.length >= 10 ? (f.startsWith('55') ? f : '55' + f) : ''; };
async function equipeLista() {
  const lista = [{ email: OWNERS[0], nome: 'Proprietário' }];
  if (pode('equipe')) { try { (await listar('equipe')).filter(m => m.status === 'ativo').forEach(m => lista.push({ email: m._id, nome: m.nome || m._id })); } catch {} }
  else if (!lista.find(x => x.email === S.email)) lista.push({ email: S.email, nome: S.nome });
  return lista;
}
function duplicados(p, todos) {
  const e = (p.contato?.email || '').toLowerCase(), w = foneLimpo(p.contato?.whatsapp);
  return todos.filter(o => o._id !== p._id && ((e && (o.contato?.email || '').toLowerCase() === e) || (w && foneLimpo(o.contato?.whatsapp) === w)));
}

modulo({
  id: 'comercial', titulo: 'Pedidos', mod: 'crm',
  async render(v, [id]) {
    if (id === 'novo') return novoPedido(v);
    if (id) return detalhePedido(v, id);
    const todos = await listar('pedidos');
    let modo = sessionStorage.getItem('cc-crm-modo') || (matchMedia('(min-width: 1024px)').matches ? 'kanban' : 'lista');
    let filtro = sessionStorage.getItem('cc-crm-f') || 'abertos', q = '';
    v.innerHTML = `<div class="cc-head"><div><h2>Pedidos</h2><p>Tudo que chega pelo site, pelo briefing e pelo que a equipe cadastra.</p></div>
      <div class="cc-actions">${edita('crm') ? '<a class="btn btn--primary" href="#/comercial/novo">Novo pedido</a>' : ''}</div></div>
      <div class="cc-toolbar">
        <input type="search" id="crm-q" placeholder="Buscar por nome, empresa, e-mail, WhatsApp ou referência…" aria-label="Buscar pedidos">
        <div class="cc-seg" role="group" aria-label="Filtro"><button type="button" data-f="abertos">Em aberto</button><button type="button" data-f="identificado">Sem briefing</button><button type="button" data-f="fechados">Fechados</button><button type="button" data-f="todos">Todos</button></div>
        <div class="cc-seg" role="group" aria-label="Visualização"><button type="button" data-m="kanban">Quadro</button><button type="button" data-m="lista">Lista</button></div>
      </div><div id="crm-box"></div>`;
    const desenhar = () => {
      $$('[data-f]', v).forEach(b => b.setAttribute('aria-pressed', b.dataset.f === filtro));
      $$('[data-m]', v).forEach(b => b.setAttribute('aria-pressed', b.dataset.m === modo));
      const nq = norm(q);
      let lista = todos.filter(p => {
        const e = etapaDe(p);
        if (filtro === 'abertos' && !ABERTOS.includes(e)) return false;
        if (filtro === 'identificado' && e !== 'identificado') return false;
        if (filtro === 'fechados' && !['aprovado', 'recusado', 'arquivado'].includes(e)) return false;
        return !nq || norm([p._id, p.contato?.nome, p.contato?.empresa, p.contato?.email, p.contato?.whatsapp].join(' ')).includes(nq);
      }).sort((a, b) => tsMs(b.enviadoEm || b.criadoEm) - tsMs(a.enviadoEm || a.criadoEm));
      const box = $('#crm-box');
      if (!lista.length) { box.innerHTML = `<div class="cc-empty"><b>${todos.length ? 'Nada neste filtro.' : 'Nenhum pedido ainda.'}</b>${todos.length ? 'Tente outro filtro ou a busca.' : 'Os pedidos chegam pela página Monte seu projeto. Você também pode cadastrar um manualmente.'}</div>`; return; }
      const card = (p) => {
        const late = p.proximaAcao?.data && Date.parse(p.proximaAcao.data) < Date.now();
        return `<a class="cc-card${late ? ' is-late' : ''}" href="#/comercial/${attr(p._id)}"><b>${esc(nomeLead(p))}</b><small>${esc(ROT_OBJ[p.escolhas?.objetivo] || p.titulo || 'Sem objetivo informado')}</small><small>${esc(relativo(p.enviadoEm || p.criadoEm))} · ${esc(ROT_ORIGEM[p.origem] || p.origem || 'Site')}</small><span class="cc-meta">${p.prioridade ? pill(PRIOR[p.prioridade][0], PRIOR[p.prioridade][1]) : ''}${p.responsavel ? pill(p.responsavel.split('@')[0]) : ''}${late ? pill('Ação atrasada', 'warn') : ''}</span></a>`;
      };
      if (modo === 'kanban') {
        const cols = filtro === 'abertos' ? ABERTOS : filtro === 'identificado' ? ['identificado'] : filtro === 'fechados' ? ['aprovado', 'recusado', 'arquivado'] : ETAPAS_CRM.map(e => e[0]);
        box.innerHTML = `<div class="cc-kanban">${cols.map(c => { const it = lista.filter(p => etapaDe(p) === c); return `<section class="cc-col" aria-label="${attr(ETAPA[c][1])}"><h3>${esc(ETAPA[c][1])}<span>${it.length}</span></h3>${it.map(card).join('')}</section>`; }).join('')}</div>`;
      } else {
        box.innerHTML = `<div class="cc-table-wrap"><table class="cc-table"><thead><tr><th>Cliente</th><th>Pedido</th><th>Situação</th><th>Responsável</th><th>Recebido</th></tr></thead><tbody>${lista.map(p => `<tr data-href="#/comercial/${attr(p._id)}" tabindex="0"><td><b>${esc(nomeLead(p))}</b><small>${esc(p.contato?.nome || '')}</small></td><td>${esc(ROT_OBJ[p.escolhas?.objetivo] || p.titulo || '')}<small>${esc(p._id)}</small></td><td>${pillEtapa(p)}</td><td>${esc((p.responsavel || '').split('@')[0] || '·')}</td><td class="cc-num">${esc(relativo(p.enviadoEm || p.criadoEm))}</td></tr>`).join('')}</tbody></table></div>`;
        $$('tr[data-href]', box).forEach(tr => { tr.onclick = () => location.hash = tr.dataset.href; tr.onkeydown = (e) => { if (e.key === 'Enter') location.hash = tr.dataset.href; }; });
      }
    };
    $$('[data-f]', v).forEach(b => b.onclick = () => { filtro = b.dataset.f; sessionStorage.setItem('cc-crm-f', filtro); desenhar(); });
    $$('[data-m]', v).forEach(b => b.onclick = () => { modo = b.dataset.m; sessionStorage.setItem('cc-crm-modo', modo); desenhar(); });
    $('#crm-q').oninput = (e) => { q = e.target.value; desenhar(); };
    desenhar();
  }
});

async function novoPedido(v) {
  if (!edita('crm')) return ir('comercial');
  v.innerHTML = `<div class="cc-head"><div><h2>Novo pedido</h2><p>Para contatos que chegaram por WhatsApp, indicação, Instagram ou telefone.</p></div></div>
  <form class="cc-panel cc-form" id="np" novalidate style="max-width:760px">
    <div class="cc-f2"><div class="cc-field"><label for="np-nome">Nome</label><input id="np-nome" required autocomplete="off"></div><div class="cc-field"><label for="np-emp">Empresa <span>opcional</span></label><input id="np-emp" autocomplete="off"></div></div>
    <div class="cc-f2"><div class="cc-field"><label for="np-wpp">WhatsApp</label><input id="np-wpp" type="tel" inputmode="tel" autocomplete="off"></div><div class="cc-field"><label for="np-mail">E-mail</label><input id="np-mail" type="email" spellcheck="false" autocomplete="off"></div></div>
    <div class="cc-f2"><div class="cc-field"><label for="np-or">Origem</label><select id="np-or">${Object.entries(ROT_ORIGEM).filter(([k]) => k !== 'site/montar-projeto').map(([k, n]) => `<option value="${k}">${esc(n)}</option>`).join('')}</select></div>
    <div class="cc-field"><label for="np-obj">O que querem</label><select id="np-obj"><option value="">Não sei ainda</option>${Object.entries(ROT_OBJ).filter(([k]) => k !== 'nao-sei').map(([k, n]) => `<option value="${k}">${esc(n)}</option>`).join('')}</select></div></div>
    <div class="cc-field"><label for="np-notas">Resumo da conversa</label><textarea id="np-notas" placeholder="Escopo, datas, referências, valores mencionados pelo cliente…"></textarea></div>
    <p class="cc-err" id="np-err" role="alert"></p>
    <div class="cc-actions"><button class="btn btn--primary" type="submit">Criar pedido</button><a class="btn btn--ghost" href="#/comercial">Cancelar</a></div>
  </form>`;
  $('#np').onsubmit = async (e) => {
    e.preventDefault();
    const nome = $('#np-nome').value.trim(), wpp = $('#np-wpp').value.trim(), mail = $('#np-mail').value.trim().toLowerCase();
    if (!nome) { $('#np-err').textContent = 'Escreva o nome.'; return $('#np-nome').focus(); }
    if (!wpp && !mail) { $('#np-err').textContent = 'Informe WhatsApp ou e-mail.'; return $('#np-wpp').focus(); }
    const todos = await listar('pedidos');
    const dup = duplicados({ _id: '', contato: { email: mail, whatsapp: wpp } }, todos);
    if (dup.length && !(await confirmar({ titulo: 'Contato já existe', texto: `Já há ${dup.length} pedido(s) com este e-mail ou WhatsApp (${dup.map(nomeLead).join(', ')}). Criar mesmo assim?`, ok: 'Criar novo pedido' }))) return;
    const id = gerarIdPedido();
    try {
      await S.F.setDoc(docRef('pedidos', id), {
        schema: 'bf.projeto/1', id, versao: 1, status: 'novo', origem: $('#np-or').value,
        criadoEm: S.F.serverTimestamp(), enviadoEm: S.F.serverTimestamp(), criadoPor: S.email, responsavel: S.email,
        escolhas: { objetivo: $('#np-obj').value || null, formato: null, quantidade: null, pos: [] },
        contexto: { cidade: '', prazo: '', notas: $('#np-notas').value.trim() },
        contato: { nome, empresa: $('#np-emp').value.trim(), whatsapp: wpp, email: mail },
        historico: [{ em: S.F.Timestamp.now(), status: 'novo', nota: 'Cadastrado manualmente', por: S.email }]
      });
      limparCache('pedidos'); auditar('criou pedido', 'pedidos/' + id, nome);
      toast('Pedido criado.'); ir('comercial/' + id);
    } catch (er) { falha(er); }
  };
}

async function detalhePedido(v, id) {
  let p = (await listar('pedidos')).find(x => x._id === id);
  if (!p) { const s = await S.F.getDoc(docRef('pedidos', id)); if (s.exists()) p = { ...s.data(), _id: s.id }; }
  if (!p) { v.innerHTML = '<div class="cc-empty"><b>Pedido não encontrado.</b><a class="btn btn--ghost" href="#/comercial">Voltar</a></div>'; return; }
  const todos = await listar('pedidos');
  const eq = await equipeLista();
  const props = (await listar('propostas').catch(() => [])).filter(x => x.pedidoId === id);

      </form>

  if (!pode_) return;

  $('#pd').onsubmit = async (ev) => {

    const mud = {

    };
    const mudouSt = st !== etapaDe(p);
    if (mudouSt || nota || mud.responsavel !== (p.responsavel || '')) mud.historico = S.F.arrayUnion({ em: S.F.Timestamp.now(), status: st, nota: nota || (mud.responsavel !== (p.responsavel || '') ? 'Responsável: ' + (mud.responsavel || 'ninguém') : ''), por: S.email });
    try {
      await S.F.updateDoc(docRef('pedidos', id), mud);
      limparCache('pedidos'); auditar(mudouSt ? 'mudou situação' : 'editou pedido', 'pedidos/' + id, mudouSt ? ETAPA[st][1] : '');
      toast('Pedido salvo.'); atualizarAlertas(); detalhePedido(v, id);
    } catch (er) { falha(er); b.disabled = false; b.textContent = 'Salvar'; }
  };
  $('#pd-proj').onclick = () => { sessionStorage.setItem('cc-novo-proj', JSON.stringify({ clienteNome: c.empresa || c.nome, clienteEmail: c.email || '', titulo: ROT_OBJ[e.objetivo] || 'Projeto', pedidoId: id })); ir('projetos/novo'); };
  $('#pd-del').onclick = async () => {
    if (!(await confirmar({ titulo: 'Excluir este pedido?', texto: 'Os dados do cliente saem do banco. Uma cópia fica no histórico de versões, acessível ao proprietário.', ok: 'Excluir', perigo: true, digitar: 'EXCLUIR' }))) return;

  };

/* ---------- propostas ---------- */
const ST_PROP = { rascunho: ['Rascunho', 'mute'], enviada: ['Enviada', 'warn'], aceita: ['Aceite registrado', 'ok'], contrato: ['Contrato formalizado', 'ok'], recusada: ['Recusada', 'bad'], expirada: ['Expirada', 'mute'], arquivada: ['Arquivada', 'mute'] };
const pillProposta = (p) => { const s = (p.status === 'enviada' && p.validade && Date.parse(p.validade) < Date.now()) ? 'expirada' : p.status; const x = ST_PROP[s] || ST_PROP.rascunho; return pill(x[0], x[1]); };
modulo({
  id: 'propostas', titulo: 'Propostas', mod: 'crm',
  async render(v, [id, pedidoId]) {
    if (id === 'nova') return editarProposta(v, null, pedidoId);
    if (id) return editarProposta(v, id);
    const lista = (await listar('propostas')).sort((a, b) => tsMs(b.atualizadoEm || b.criadoEm) - tsMs(a.atualizadoEm || a.criadoEm));
    v.innerHTML = `<div class="cc-head"><div><h2>Propostas</h2><p>Cada proposta tem versões, validade e estados separados: criada, enviada, aceite registrado e contrato.</p></div><div class="cc-actions">${edita('crm') ? '<a class="btn btn--primary" href="#/propostas/nova">Nova proposta</a>' : ''}</div></div>
    ${lista.length ? `<div class="cc-table-wrap"><table class="cc-table"><thead><tr><th>Proposta</th><th>Situação</th><th class="cc-num">Valor</th><th>Validade</th><th>Atualizada</th></tr></thead><tbody>${lista.map(p => `<tr data-href="#/propostas/${attr(p._id)}" tabindex="0"><td><b>${esc(p.titulo)}</b><small>${esc(p.cliente || '')} · versão ${(p.versoes || []).length || 1}</small></td><td>${pillProposta(p)}</td><td class="cc-num">${p.valor ? BRL.format(p.valor) : '·'}</td><td class="cc-num">${p.validade ? esc(dia(Date.parse(p.validade))) : '·'}</td><td class="cc-num">${esc(relativo(p.atualizadoEm || p.criadoEm))}</td></tr>`).join('')}</tbody></table></div>`
    : '<div class="cc-empty"><b>Nenhuma proposta ainda.</b>Abra um pedido e clique em Nova proposta, ou crie uma aqui.</div>'}`;
    $$('tr[data-href]', v).forEach(tr => { tr.onclick = () => location.hash = tr.dataset.href; tr.onkeydown = (e) => { if (e.key === 'Enter') location.hash = tr.dataset.href; }; });
  }
});
async function editarProposta(v, id, pedidoId) {
  const lista = await listar('propostas');
  const p = id ? lista.find(x => x._id === id) : null;
  if (id && !p) { v.innerHTML = '<div class="cc-empty"><b>Proposta não encontrada.</b></div>'; return; }
  const peds = (await listar('pedidos')).filter(x => etapaDe(x) !== 'identificado');
  const ped = peds.find(x => x._id === (p?.pedidoId || pedidoId));
  const versoes = p?.versoes || [];
  const ro = !edita('crm');
  const val = new Date(); val.setDate(val.getDate() + 15);
  v.innerHTML = `<div class="cc-head"><div><p class="cc-note">${p ? 'Proposta' : 'Nova proposta'}${ped ? ' · pedido ' + esc(ped._id) : ''}</p><h2>${esc(p?.titulo || (ped ? 'Proposta para ' + nomeLead(ped) : 'Nova proposta'))}</h2></div>${p ? `<div class="cc-actions">${pillProposta(p)}</div>` : ''}</div>
  <div class="cc-cols cc-split">
    <form class="cc-panel cc-form" id="pp" novalidate>
      <div class="cc-field"><label for="pp-t">Título</label><input id="pp-t" required value="${attr(p?.titulo || (ped ? 'Proposta ' + (ped.contato?.empresa || ped.contato?.nome) : ''))}" ${ro ? 'disabled' : ''}></div>
      <div class="cc-f2"><div class="cc-field"><label for="pp-ped">Pedido</label><select id="pp-ped" ${ro ? 'disabled' : ''}><option value="">Sem pedido</option>${peds.map(x => `<option value="${attr(x._id)}" ${(p?.pedidoId || pedidoId) === x._id ? 'selected' : ''}>${esc(nomeLead(x))} · ${esc(x._id)}</option>`).join('')}</select></div>
      <div class="cc-field"><label for="pp-cli">Cliente</label><input id="pp-cli" value="${attr(p?.cliente || (ped ? nomeLead(ped) : ''))}" ${ro ? 'disabled' : ''}></div></div>
      <div class="cc-f2"><div class="cc-field"><label for="pp-val">Validade</label><input id="pp-val" type="date" value="${attr(p?.validade || val.toISOString().slice(0, 10))}" ${ro ? 'disabled' : ''}></div>
      <div class="cc-field"><label for="pp-cond">Condições</label><input id="pp-cond" value="${attr(p?.condicoes || '50% na assinatura, 50% na entrega')}" ${ro ? 'disabled' : ''}></div></div>
      ${ro ? '' : `<details ${p ? '' : 'open'}><summary>${p ? 'Registrar nova versão' : 'Primeira versão'}</summary><div class="cc-form">
        <p class="cc-note">Gere a proposta no <a href="gerar-orcamento.html" target="_blank" rel="noopener">gerador de orçamento</a> (custos, fee e impostos ficam lá) e cole aqui o link e o valor final.</p>
        <div class="cc-f2"><div class="cc-field"><label for="pp-link">Link da proposta</label><input id="pp-link" type="url" inputmode="url" spellcheck="false" placeholder="https://bourbonfilms.com.br/orcamento.html?d=…"></div>
        <div class="cc-field"><label for="pp-v">Valor final</label><input id="pp-v" inputmode="numeric" placeholder="Ex.: 4480"></div></div>
        <div class="cc-field"><label for="pp-nv">O que mudou</label><input id="pp-nv" placeholder="Ex.: incluída cobertura do lançamento"></div></div></details>`}
      <p class="cc-err" id="pp-err" role="alert"></p>
      ${ro ? '' : `<div class="cc-actions"><button class="btn btn--primary" type="submit" id="pp-save">${p ? 'Salvar' : 'Criar proposta'}</button>${p ? '<button class="btn btn--ghost" type="button" id="pp-dup">Duplicar</button><button class="btn btn--danger" type="button" id="pp-del">Excluir</button>' : ''}</div>`}
    </form>
    <div class="cc-grid">
      ${p ? `<section class="cc-panel"><h3>Estado comercial</h3><p class="cc-note" style="margin-bottom:12px">Abrir o link não é aceite. Registre cada passo quando ele acontecer de fato.</p>
        <div class="cc-list">
          <div class="cc-row"><span><b>Criada</b><small>${esc(quando(p.criadoEm))}</small></span>${pill('Feito', 'ok')}</div>
          <div class="cc-row"><span><b>Enviada ao cliente</b><small>${p.enviadaEm ? esc(quando(p.enviadaEm)) + (p.enviadaPor ? ' · ' + esc(p.enviadaPor) : '') : 'Ainda não'}</small></span>${p.enviadaEm ? pill('Feito', 'ok') : (ro ? '' : '<button class="btn btn--ghost btn--sm" type="button" data-passo="enviada">Registrar envio</button>')}</div>
          <div class="cc-row"><span><b>Aceite registrado</b><small>${p.aceiteEm ? esc(quando(p.aceiteEm)) + ' · ' + esc(p.aceiteComo || '') : 'Ainda não'}</small></span>${p.aceiteEm ? pill('Feito', 'ok') : (ro || !p.enviadaEm ? '' : '<button class="btn btn--ghost btn--sm" type="button" data-passo="aceita">Registrar aceite</button>')}</div>
          <div class="cc-row"><span><b>Contrato formalizado</b><small>${p.contratoEm ? esc(quando(p.contratoEm)) : 'Ainda não'}</small></span>${p.contratoEm ? pill('Feito', 'ok') : (ro || !p.aceiteEm ? '' : '<button class="btn btn--ghost btn--sm" type="button" data-passo="contrato">Registrar contrato</button>')}</div>
        </div>
        ${ro || ['aceita', 'contrato', 'recusada'].includes(p.status) ? '' : '<div class="cc-actions" style="margin-top:12px"><button class="btn btn--danger btn--sm" type="button" data-passo="recusada">Marcar como recusada</button></div>'}
      </section>` : ''}
      <section class="cc-panel"><h3>Versões <small>${versoes.length}</small></h3>${versoes.length ? `<ol class="cc-hist">${versoes.slice().reverse().map(x => `<li><time>v${x.n} · ${esc(quando(x.em))} · ${esc((x.por || '').split('@')[0])}</time><b>${x.valor ? BRL.format(x.valor) : 'Sem valor'}</b>${x.nota ? '. ' + esc(x.nota) : ''}${safeUrl(x.link) ? ` · <a href="${attr(safeUrl(x.link))}" target="_blank" rel="noopener">abrir</a>` : ''}</li>`).join('')}</ol>` : '<p class="cc-note">A primeira versão é registrada ao criar.</p>'}</section>
    </div>
  </div>`;
  if (ro) return;
  $('#pp-ped').onchange = (e) => { const x = peds.find(y => y._id === e.target.value); if (x && !$('#pp-cli').value) $('#pp-cli').value = nomeLead(x); };
  $('#pp').onsubmit = async (ev) => {
    ev.preventDefault();
    const titulo = $('#pp-t').value.trim(); if (!titulo) { $('#pp-err').textContent = 'Dê um título.'; return $('#pp-t').focus(); }
    const link = $('#pp-link') ? $('#pp-link').value.trim() : '', valor = $('#pp-v') ? Number(String($('#pp-v').value).replace(/\D/g, '')) : 0;
    if (link && !safeUrl(link)) { $('#pp-err').textContent = 'O link precisa começar com https://'; return $('#pp-link').focus(); }
    const dados = { titulo, pedidoId: $('#pp-ped').value, cliente: $('#pp-cli').value.trim(), validade: $('#pp-val').value, condicoes: $('#pp-cond').value.trim() };
    const nova = (link || valor || !p) ? { n: versoes.length + 1, link: safeUrl(link), valor, nota: $('#pp-nv') ? $('#pp-nv').value.trim() : '', em: S.F.Timestamp.now(), por: S.email } : null;
    if (nova) { dados.versoes = [...versoes, nova]; if (valor) dados.valor = valor; if (nova.link) dados.link = nova.link; }
    if (!p) dados.status = 'rascunho';
    const b = $('#pp-save'); b.disabled = true; b.textContent = 'Salvando…';
    try {
      const nid = await salvarDoc('propostas', p?._id, dados, p ? (nova ? 'nova versão de proposta' : 'editou proposta') : 'criou proposta', titulo);
      if (!p && dados.pedidoId) { const pd = peds.find(x => x._id === dados.pedidoId); if (pd && ['novo', 'em-analise'].includes(etapaDe(pd))) { await S.F.updateDoc(docRef('pedidos', pd._id), { status: 'orcamento', historico: S.F.arrayUnion({ em: S.F.Timestamp.now(), status: 'orcamento', nota: 'Proposta criada: ' + titulo, por: S.email }) }); limparCache('pedidos'); } }
      toast(p ? 'Proposta salva.' : 'Proposta criada.'); ir('propostas/' + nid);
    } catch (er) { falha(er); b.disabled = false; b.textContent = 'Salvar'; }
  };
  $$('[data-passo]', v).forEach(b => b.onclick = async () => {
    const passo = b.dataset.passo; let extra = {};
    const nomes = { enviada: 'Registrar o envio?', aceita: 'Registrar o aceite do cliente?', contrato: 'Registrar o contrato formalizado?', recusada: 'Marcar como recusada?' };
    let como = '';
    if (passo === 'aceita') { como = await confirmar({ titulo: 'Como o cliente aceitou?', texto: 'Fica registrado junto com a data e o seu nome.', campo: 'Ex.: WhatsApp, e-mail, assinatura', ok: 'Registrar aceite' }); if (!como) return; }
    if (passo !== 'aceita' && !(await confirmar({ titulo: nomes[passo], texto: passo === 'enviada' ? 'Use quando a proposta tiver sido enviada por um canal oficial.' : passo === 'recusada' ? 'O pedido ligado também vai para Recusado.' : 'Fica registrado com data, hora e seu nome.', ok: 'Registrar', perigo: passo === 'recusada' }))) return;
    const agora = S.F.serverTimestamp();
    if (passo === 'enviada') extra = { status: 'enviada', enviadaEm: agora, enviadaPor: S.email };
    if (passo === 'aceita') extra = { status: 'aceita', aceiteEm: agora, aceiteComo: como, aceitePor: S.email };
    if (passo === 'contrato') extra = { status: 'contrato', contratoEm: agora };
    if (passo === 'recusada') extra = { status: 'recusada', recusadaEm: agora };
    try {
      await salvarDoc('propostas', p._id, extra, 'proposta ' + passo, p.titulo);
      const mapa = { enviada: 'proposta-enviada', aceita: 'aprovado', contrato: 'aprovado', recusada: 'recusado' };
      if (p.pedidoId && mapa[passo]) { await S.F.updateDoc(docRef('pedidos', p.pedidoId), { status: mapa[passo], historico: S.F.arrayUnion({ em: S.F.Timestamp.now(), status: mapa[passo], nota: 'Proposta: ' + passo, por: S.email }) }).catch(() => {}); limparCache('pedidos'); }
      toast('Registrado.'); atualizarAlertas(); editarProposta(v, p._id);
    } catch (er) { falha(er); }
  });
  if ($('#pp-dup')) $('#pp-dup').onclick = async () => {
    const { _id, criadoEm, atualizadoEm, enviadaEm, aceiteEm, contratoEm, recusadaEm, ...resto } = p;
    try { const nid = await salvarDoc('propostas', null, { ...resto, titulo: p.titulo + ' (cópia)', status: 'rascunho', versoes: (p.versoes || []).slice(-1).map(x => ({ ...x, n: 1 })) }, 'duplicou proposta', p.titulo); toast('Cópia criada.'); ir('propostas/' + nid); } catch (er) { falha(er); }
  };
  if ($('#pp-del')) $('#pp-del').onclick = async () => {
    if (!(await confirmar({ titulo: 'Excluir esta proposta?', texto: 'Uma cópia fica no histórico de versões.', ok: 'Excluir', perigo: true }))) return;
    try { await excluirDoc('propostas', p._id, p.titulo); toast('Proposta excluída.'); ir('propostas'); } catch (er) { falha(er); }
  };
