/* ============ Conversor Editorial: prompt para IA externa, importação (BEF, Markdown, WhatsApp, texto livre), revisão ============
   A IA escreve fora do site. Aqui só se interpreta, valida, organiza e salva no Diário. Nada é enviado a serviços externos. */
const BEF_FORMATO = 'bourbon-editorial', BEF_VERSAO = 1;
const AGENTE_PADRAO = `Você é o editor de bastidores da Bourbon Films, produtora audiovisual brasileira sediada em Campina Grande, Paraíba.

Sua função é transformar relatos reais de produção em textos editoriais sofisticados, humanos e memoráveis para o Diário de Produção do site bourbonfilms.com.br. Você não escreve publicidade convencional: você conta histórias de bastidores, valorizando a experiência de produção, as pessoas envolvidas, o processo criativo e o relacionamento com o cliente.

Princípio editorial: "O tempo apaga quase tudo. É por isso que escolhemos produzir apenas o que merece permanecer." A matéria registra o que merece ser lembrado sobre aquela produção. O cliente deve sentir que o texto foi escrito especificamente sobre a experiência compartilhada com a Bourbon Films.

ESCRITA
- Elegante, natural, precisa, cinematográfica, concisa, autoral e humana.
- Sem clichês publicitários, sem elogios exagerados, sem transformar acontecimentos simples em narrativas grandiosas.
- Nunca use travessões. Use vírgulas, pontos ou dois pontos.
- Títulos específicos e autorais, nunca genéricos como "Mais um projeto de sucesso".
- Entre 350 e 800 palavras no corpo, em parágrafos curtos. Subtítulos internos só quando ajudarem a leitura.

FATOS
- Use somente o que estiver no briefing. Não invente fatos, falas, dificuldades, resultados, nomes, datas, créditos ou perfis do Instagram.
- Não atribua sentimentos ou opiniões a terceiros sem fundamento no relato.
- Quando faltar algo importante, não preencha: registre a lacuna em "editorial_notes" e, se necessário, escreva de forma mais breve.

IMAGENS
- Você não gera imagens. Sugira momentos em que uma fotografia real ajudaria, em "media_suggestions" e com blocos {"type":"image_suggestion"} no ponto do texto.

PARCEIROS E TRABALHOS
- Cite parceiros só se estiverem no briefing. Use o @ exatamente como informado. Nunca crie um @.
- Para trabalhos relacionados, use apenas os códigos de vídeo listados no briefing, em "related_videos".

FORMATO DE RESPOSTA (obrigatório)
Responda SOMENTE com um único bloco JSON válido, sem texto antes ou depois, neste contrato (Bourbon Editorial Format, versão 1):
{
  "format": "bourbon-editorial",
  "version": 1,
  "title": "título autoral",
  "subtitle": "subtítulo contextual",
  "summary": "resumo de 1 ou 2 frases para o cartão e compartilhamento",
  "client": "nome do cliente, se informado",
  "category": "categoria, se informada",
  "work_date": "data ou período do trabalho, só se informado",
  "sections": [
    {"type": "paragraph", "text": "texto com **negrito**, *itálico*, [link](https://...) e @perfil quando houver"},
    {"type": "heading", "level": 2, "text": "subtítulo interno"},
    {"type": "quote", "text": "citação literal que esteja no briefing"},
    {"type": "list", "ordered": false, "items": ["item"]},
    {"type": "image_suggestion", "description": "que fotografia real caberia aqui"}
  ],
  "closing": "frase final de encerramento editorial",
  "credits": [{"role": "função", "name": "nome"}],
  "partners": [{"name": "nome", "instagram": "@perfil informado"}],
  "related_videos": ["código do vídeo listado no briefing"],
  "media_suggestions": [{"description": "fotografia sugerida"}],
  "seo": {"title": "até 60 caracteres", "description": "até 155 caracteres"},
  "editorial_notes": ["lacunas e pontos a confirmar"]
}
Escape aspas dentro dos textos. Não use HTML.`;

const S_ = (v, n = 4000) => typeof v === 'string' ? v.replace(/\u2014/g, ',').replace(/\r/g, '').trim().slice(0, n) : '';
function repararJSON(txt) {
  const rep = []; let t = String(txt || '').replace(/^﻿/, '').trim();
  const cerca = t.match(/```(?:json)?\s*([\s\S]*?)```/i); if (cerca) { t = cerca[1].trim(); rep.push('Removidas as marcas de bloco de código (```).'); }
  const i = t.indexOf('{'), j = t.lastIndexOf('}'); if (i > 0 || (j >= 0 && j < t.length - 1)) { if (i >= 0 && j > i) { t = t.slice(i, j + 1); rep.push('Ignorado texto fora do JSON.'); } }
  const sem = t.replace(/,(\s*[}\]])/g, '$1'); if (sem !== t) { t = sem; rep.push('Removidas vírgulas sobrando no fim de listas.'); }
  const aspas = t.replace(/[“”](?=\s*:|\s*,|\s*}|\s*])|(?<=[{,:\[]\s*)[“”]/g, '"'); if (aspas !== t) { t = aspas; rep.push('Trocadas aspas curvas que delimitavam campos por aspas retas.'); }
  return { t, rep };
}
function deBEF(obj, base) {

  if (!obj || typeof obj !== 'object' || Array.isArray(obj)) throw new Error('O conteúdo não é um objeto JSON.');
  if (obj.format !== BEF_FORMATO) av.push('Campo "format" ausente ou diferente de "bourbon-editorial". Conteúdo lido mesmo assim.');
  if (obj.version !== BEF_VERSAO) av.push(`Versão ${obj.version ?? 'ausente'}: o Conversor conhece a versão 1.`);
  const secs = Array.isArray(obj.sections) ? obj.sections : []; if (!Array.isArray(obj.sections)) av.push('Sem "sections": nenhum corpo de texto.');
  const sug = [];
  secs.slice(0, BEF_LIM.blocos).forEach((s, k) => {
    if (!s || typeof s !== 'object') return av.push(`Bloco ${k + 1} ignorado: formato inválido.`);
    if (s.type === 'paragraph' && S_(s.text)) blocos.push({ t: 'p', x: S_(s.text) });
    else if (s.type === 'heading' && S_(s.text)) blocos.push({ t: Number(s.level) >= 3 ? 'h3' : 'h2', x: S_(s.text, 200) });
    else if (s.type === 'quote' && S_(s.text)) blocos.push({ t: 'quote', x: S_(s.text) });
    else if (s.type === 'list' && Array.isArray(s.items)) blocos.push({ t: s.ordered ? 'ol' : 'ul', itens: s.items.map(i => S_(i, 600)).filter(Boolean).slice(0, BEF_LIM.itens) });

/* ============ Inteligência comercial: tráfego, origem dos clientes e funil ============
   Eventos próprios do site (sem cookies de terceiros, sem IP). Atribuição observada, não causalidade. */
const CANAIS = { instagram: 'Instagram', google: 'Google orgânico', 'google-ads': 'Google Ads', email: 'E-mail', whatsapp: 'WhatsApp', facebook: 'Facebook', youtube: 'YouTube', indicacao: 'Indicação', direto: 'Acesso direto', parceiro: 'Links de parceiros', campanha: 'Outras campanhas', linkedin: 'LinkedIn', 'busca-outros': 'Outras buscas', 'site-externo': 'Outros sites', telefone: 'Telefone', evento: 'Evento', outro: 'Outro', desconhecida: 'Origem desconhecida' };
const ORIGEM_MANUAL = { whatsapp: 'whatsapp', indicacao: 'indicacao', instagram: 'instagram', telefone: 'telefone', email: 'email', evento: 'evento', outro: 'outro' };
const canalPedido = (p, modo) => p.atribuicao?.[modo]?.canal || ORIGEM_MANUAL[p.origem] || 'desconhecida';
const nomeCanal = (c) => CANAIS[c] || c;
const pct = (a, b) => b ? (a / b * 100).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + '%' : '·';
async function eventosEntre(ini, fim) {
  const F = S.F, chave = `ev-${ini}-${fim}`; if (S.cache[chave]) return S.cache[chave];
  const sn = await F.getDocs(F.query(col('eventos'), F.where('em', '>=', F.Timestamp.fromMillis(ini)), F.where('em', '<', F.Timestamp.fromMillis(fim)), F.limit(20000)));
  return (S.cache[chave] = sn.docs.map(d => d.data()));
}
function barrasDia(serie, alt = 120) {
  const max = Math.max(1, ...serie.map(s => s.v)), w = 100 / Math.max(1, serie.length);
  return `<svg class="in-barras" viewBox="0 0 100 ${alt}" preserveAspectRatio="none" role="img" aria-label="Sessões por dia">${serie.map((s, i) => `<rect x="${i * w + w * 0.15}" y="${alt - s.v / max * (alt - 4)}" width="${w * 0.7}" height="${s.v / max * (alt - 4)}" rx="0.6"><title>${s.r}: ${s.v}</title></rect>`).join('')}</svg>`;
}

/* retenção: resume meses antigos em "resumos" e apaga os eventos brutos */
async function consolidarEventos() {
  const corte = new Date(); corte.setMonth(corte.getMonth() - 13); corte.setDate(1); corte.setHours(0, 0, 0, 0);
  if (!(await confirmar({ titulo: 'Consolidar eventos antigos?', texto: `Eventos anteriores a ${dia(corte.getTime())} viram totais mensais (visitas, sessões, canais, páginas) e os registros individuais são apagados. Os totais continuam nos relatórios de longo prazo.`, ok: 'Consolidar', perigo: true }))) return;
  try {
    const sn = await S.F.getDocs(S.F.query(col('eventos'), S.F.where('em', '<', S.F.Timestamp.fromDate(corte)), S.F.limit(5000)));
    if (!sn.size) return toast('Nada com mais de 13 meses.');
    const meses = {};
    sn.docs.forEach(d => { const e = d.data(), k = String(e.dia || '').slice(0, 7) || 'sem-data', m = meses[k] = meses[k] || { views: 0, sessoes: new Set(), internos: 0, canais: {}, paginas: {}, envios: 0 };
      if (e.i) { m.internos++; return; } if (e.t === 'view') { m.views++; m.sessoes.add(e.s); m.canais[e.c || 'desconhecida'] = (m.canais[e.c || 'desconhecida'] || 0) + 1; m.paginas[e.p] = (m.paginas[e.p] || 0) + 1; } if (e.t === 'envio') m.envios++; });
    for (const [k, m] of Object.entries(meses)) {
      const ref = docRef('resumos', k), at = await S.F.getDoc(ref), a = at.exists() ? at.data() : {};
      const soma = (x = {}, y = {}) => { const o = { ...x }; Object.entries(y).forEach(([c, n]) => o[c] = (o[c] || 0) + n); return o; };
      await S.F.setDoc(ref, { mes: k, views: (a.views || 0) + m.views, sessoes: (a.sessoes || 0) + m.sessoes.size, internos: (a.internos || 0) + m.internos, envios: (a.envios || 0) + m.envios, canais: soma(a.canais, m.canais), paginas: soma(a.paginas, m.paginas), atualizadoEm: S.F.serverTimestamp() });
    }
    for (let i = 0; i < sn.docs.length; i += 400) { const lote = S.F.writeBatch(S.db); sn.docs.slice(i, i + 400).forEach(d => lote.delete(d.ref)); await lote.commit(); }
    auditar('consolidou eventos', 'eventos', String(sn.size)); toast(`${sn.size} eventos consolidados.`); navegar();
  } catch (e) { falha(e); }
}

const reconhecimento = (c) => {
  const n = (c.aprovados || 0) + (c.projetosN ?? (Array.isArray(c.projetos) ? c.projetos.length : c.projetos || 0)), anos = c.desde ? (Date.now() - Date.parse(c.desde)) / 3.15e10 : 0;
  if (c.especial) return pill('Parceria especial', 'gold');
  if (n >= 4 || (anos >= 3 && n >= 2)) return pill('Parceria de longa data', 'gold');
  if (n >= 2) return pill('Parceria recorrente', 'info');
  if (n === 1) return pill('Primeira parceria', 'mute');
  return '';
};

/* ---------- importação de contatos (CSV) com detecção de duplicidade ---------- */
function lerCSV(txt) {
  const sep = (txt.split('\n')[0].match(/;/g) || []).length > (txt.split('\n')[0].match(/,/g) || []).length ? ';' : ',';
  const linhas = []; let campo = '', linha = [], aspas = false;
  for (let i = 0; i < txt.length; i++) { const ch = txt[i];
    if (aspas) { if (ch === '"' && txt[i + 1] === '"') { campo += '"'; i++; } else if (ch === '"') aspas = false; else campo += ch; }
    else if (ch === '"') aspas = true; else if (ch === sep) { linha.push(campo); campo = ''; } else if (ch === '\n' || ch === '\r') { if (ch === '\r' && txt[i + 1] === '\n') i++; linha.push(campo); linhas.push(linha); linha = []; campo = ''; } else campo += ch; }
  if (campo || linha.length) { linha.push(campo); linhas.push(linha); }
  return linhas.filter(l => l.some(c => c.trim()));
}
async function importarContatos(existentes) {
  abrirSheet('Importar contatos', `<p class="cc-note" style="margin-bottom:12px">CSV ou planilha exportada como CSV, com cabeçalho. Colunas reconhecidas: nome, empresa, email, telefone ou whatsapp, origem, consentimento (sim ou não). Só quem tiver "sim" entra como apto a receber comunicações.</p>
    <label class="cc-drop" for="ic-f"><b>Escolher arquivo CSV</b><input type="file" id="ic-f" accept=".csv,text/csv"></label><div id="ic-r"></div>`, '<button class="btn btn--ghost" type="button" id="ic-x">Cancelar</button><button class="btn btn--primary" type="button" id="ic-ok" disabled>Importar</button>');
  $('#ic-x').onclick = fecharSheet; let novos = [];
  $('#ic-f').onchange = async (e) => {
    const f = e.target.files[0]; if (!f) return; if (f.size > 3e6) return toast('Arquivo acima de 3 MB.', true);
    const l = lerCSV(await f.text()); if (l.length < 2) return toast('Não encontrei linhas no arquivo.', true);
    const cab = l[0].map(h => norm(h)); const col = (...ns) => cab.findIndex(h => ns.some(n => h.includes(n)));
    const iN = col('nome', 'name', 'contato'), iE = col('empresa', 'company', 'organiz'), iM = col('email', 'e-mail'), iT = col('whats', 'telefone', 'celular', 'phone', 'fone'), iO = col('origem', 'source', 'canal'), iC = col('consent', 'aceita', 'marketing', 'opt');
    if (iN < 0 && iE < 0) return toast('O arquivo precisa de uma coluna "nome" ou "empresa".', true);
    const tel = (t) => String(t || '').replace(/\D/g, '').replace(/^55(?=\d{10,11}$)/, '');
    const chaves = new Set(); existentes.forEach(c => { if (c.email) chaves.add('e:' + norm(c.email)); if (c.whatsapp) chaves.add('t:' + tel(c.whatsapp)); chaves.add('n:' + norm(c.nome) + '|' + norm(c.empresa || '')); });
    const rel = { ok: 0, dup: 0, vazio: 0 }; novos = [];
    l.slice(1).forEach(r => {
      const g = (i) => i >= 0 ? String(r[i] || '').trim() : '';
      const c = { nome: g(iN) || g(iE), empresa: g(iE), email: g(iM).toLowerCase(), whatsapp: g(iT), origemContato: g(iO) || 'importação' };
      if (!c.nome) { rel.vazio++; return; }
      if (c.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(c.email)) c.email = '';
      const ks = [c.email && 'e:' + norm(c.email), c.whatsapp && tel(c.whatsapp).length >= 10 && 't:' + tel(c.whatsapp), 'n:' + norm(c.nome) + '|' + norm(c.empresa)].filter(Boolean);
      if (ks.some(k => chaves.has(k))) { rel.dup++; return; } ks.forEach(k => chaves.add(k));
      const sim = /^(s|sim|yes|y|1|true|x)$/i.test(g(iC));
      novos.push({ ...c, origem: 'importacao', marketing: sim ? { consentiu: true, fonte: 'importação de ' + f.name.slice(0, 60), registradoEm: new Date().toISOString().slice(0, 10) } : { consentiu: false } }); rel.ok++;
    });
    $('#ic-r').innerHTML = `<dl class="cc-analysis" style="margin-top:12px"><div><dt>Novos</dt><dd>${rel.ok}</dd></div><div><dt>Já existiam</dt><dd>${rel.dup}</dd></div><div><dt>Sem nome</dt><dd>${rel.vazio}</dd></div><div><dt>Com consentimento</dt><dd>${novos.filter(n => n.marketing.consentiu).length}</dd></div></dl>
      ${novos.length ? `<div class="cc-list" style="margin-top:10px">${novos.slice(0, 8).map(n => `<div class="cc-row"><span><b>${esc(n.nome)}</b><small>${esc([n.empresa, n.email, n.whatsapp].filter(Boolean).join(' · '))}</small></span></div>`).join('')}${novos.length > 8 ? `<p class="cc-note">e mais ${novos.length - 8}</p>` : ''}</div>` : ''}`;
    $('#ic-ok').disabled = !novos.length;
  };
  $('#ic-ok').onclick = async () => {
    if (!(await confirmar({ titulo: `Importar ${novos.length} contatos?`, texto: 'Entram como contatos comerciais. Duplicados foram ignorados.', ok: 'Importar' }))) return;
    try { for (let i = 0; i < novos.length; i += 400) { const lote = S.F.writeBatch(S.db); novos.slice(i, i + 400).forEach(n => lote.set(S.F.doc(col('clientes')), { ...n, criadoEm: S.F.serverTimestamp(), criadoPor: S.email })); await lote.commit(); }
      limparCache('clientes'); auditar('importou contatos', 'clientes', String(novos.length)); fecharSheet(); toast(`${novos.length} contatos importados.`); navegar(); } catch (e) { falha(e); }
  };
}

/* ---------- Entregas, pontualidade e encerramento ---------- */
function pontualidade(p) {
  const lim = p.prorrogadoAte || p.prazoData, fim = p.concluidoEm;
  if (!lim || !fim) return null;
  if (fim < lim) return { k: 'antes', t: 'Antes do prazo', tom: 'ok' };
  if (fim === lim) return { k: 'dentro', t: 'Dentro do prazo', tom: 'ok' };
  return { k: 'apos', t: 'Após o prazo', tom: 'warn' };
}

/* ============ Ciclo de vida: lixeira, restauração, exclusão definitiva, clientes e projetos ============
   Exclusão comum é lógica: o registro ganha excluido=true e sai das listas e do site.
   Exclusão definitiva só na Lixeira, só proprietário ou administrador, e as regras do banco exigem excluido=true. */
const RETENCAO = 30;
const TIPOS = {
  clientes: ['cliente', x => x.nome, 'crm'], pedidos: ['pedido', x => nomeLead(x) + ' · ' + x._id, 'crm'], propostas: ['proposta', x => x.titulo, 'crm'], indicacoes: ['indicação', x => x.indicador, 'crm'],
  projetos: ['projeto', x => x.titulo, 'operacao'], tarefas: ['demanda', x => x.titulo, 'operacao'],
  trabalhos: ['trabalho', x => x.titulo, 'conteudo'], marcas: ['marca', x => x.nome, 'conteudo'], depoimentos: ['depoimento', x => x.autor, 'conteudo'], instagram: ['publicação do Instagram', x => x.legenda || 'Publicação', 'conteudo'],
  diario: ['matéria', x => x.titulo, 'conteudo'], midia: ['foto', x => x.legenda || x.nome, 'conteudo']
};
const podeApagarDef = () => S.papel === 'owner' || S.papel === 'admin';
const emCurso = new Set();
const prazoRec = (x) => tsMs(x.excluidoEm) + RETENCAO * 864e5;

/* move para a lixeira: guarda o estado anterior e tira do site e da área do cliente */
async function paraLixeira(colecao, reg, { motivo = '', silencioso = false, avisos = [] } = {}) {
  const chave = colecao + '/' + reg._id; if (emCurso.has(chave)) return false;
  const [tipo, rot] = TIPOS[colecao] || ['registro', x => x._id]; const nome = rot(reg) || reg._id;
  if (!silencioso && !(await confirmar({ titulo: `Excluir ${tipo}?`, texto: `"${nome}" sai das listas${reg.status === 'publicado' ? ' e do site' : ''}${reg.clienteEmail ? ' e da área do cliente' : ''}.${avisos.length ? '\n\n' + avisos.join('\n') : ''}\n\nVocê pode restaurar pela Lixeira durante ${RETENCAO} dias.`, ok: `Excluir ${tipo}`, perigo: true }))) return false;
  emCurso.add(chave);
  try {
    const antes = {}; const dados = { excluido: true, excluidoEm: S.F.serverTimestamp(), excluidoPor: S.email, motivoExclusao: String(motivo).slice(0, 200) };
    if (reg.status === 'publicado') { antes.status = 'publicado'; dados.status = 'rascunho'; }
    if (reg.clienteEmail) { antes.clienteEmail = reg.clienteEmail; dados.clienteEmail = ''; }
    dados.estadoAntes = antes;
    await salvarDoc(colecao, reg._id, dados, 'moveu para a lixeira', nome);
    if (!silencioso) toast(`${tipo[0].toUpperCase() + tipo.slice(1)} na Lixeira.`, false, { rotulo: 'Desfazer', fn: async () => { await restaurar(colecao, { ...reg, ...dados, estadoAntes: antes }); navegar(); } });
    return true;
  } finally { emCurso.delete(chave); }
}
async function restaurar(colecao, reg) {
  const sn = await S.F.getDoc(docRef(colecao, reg._id)); if (!sn.exists()) throw Object.assign(new Error('Este registro já foi excluído definitivamente e não pode ser restaurado.'), { code: 'nao-existe' });
  const atual = sn.data(); if (!atual.excluido) return toast('Este registro já estava ativo.');
  const ea = atual.estadoAntes || {};
  await salvarDoc(colecao, reg._id, { excluido: false, excluidoEm: null, excluidoPor: '', motivoExclusao: '', estadoAntes: {}, ...(ea.status ? { status: 'rascunho' } : {}), ...(ea.clienteEmail ? { clienteEmail: ea.clienteEmail } : {}) }, 'restaurou da lixeira', (TIPOS[colecao]?.[1] || (x => x._id))({ ...atual, _id: reg._id }));
  return true;
}
async function excluirDeVez(colecao, regs) {
  if (!podeApagarDef()) return toast('Só o proprietário ou um administrador pode excluir definitivamente.', true);
  const n = regs.length, [tipo] = TIPOS[colecao] || ['registro'];
  if (!(await confirmar({ titulo: n > 1 ? `Excluir ${n} itens definitivamente?` : `Excluir ${tipo} definitivamente?`, texto: 'Esta ação não pode ser desfeita. O registro deixa de existir no banco e não volta pela Lixeira. Uma cópia de consulta fica em Versões, acessível só a quem administra.', ok: 'Excluir definitivamente', perigo: true, digitar: 'EXCLUIR' }))) return false;
  for (const r of regs) { const sn = await S.F.getDoc(docRef(colecao, r._id)); if (sn.exists() && sn.data().excluido) await excluirDoc(colecao, r._id, (TIPOS[colecao]?.[1] || (x => x._id))(r)); }
  return true;
}

    $('#lx-res').onclick = async () => { try { for (const k of sel) { const x = achar(k); await restaurar(x._c, x); } toast(`${sel.size} restaurado(s).`); navegar(); } catch (er) { falha(er); } };

/* ---------- Clientes e contatos ---------- */
const SIT_CLI = { ativo: ['Ativo', 'ok'], inativo: ['Inativo', 'mute'], encerrado: ['Relacionamento encerrado', 'warn'] };
async function dadosClientes() {
  const [casa, ped, prop, proj] = await Promise.all([listar('clientes').catch(() => []), listar('pedidos').catch(() => []), listar('propostas').catch(() => []), listar('projetos').catch(() => [])]);
  const mapa = new Map();
  const add = (nome) => { const k = norm(nome); if (!k) return null; if (!mapa.has(k)) mapa.set(k, { nome, k, pedidos: [], propostas: [], projetos: [], aprovados: 0, doc: null, ultimo: 0 }); return mapa.get(k); };
  casa.forEach(c => { const o = add(c.nome); if (o && !o.doc) o.doc = c; });
  ped.filter(p => etapaDe(p) !== 'identificado').forEach(p => { const o = add(nomeLead(p)); if (o) { o.pedidos.push(p); o.ultimo = Math.max(o.ultimo, tsMs(p.criadoEm)); if (etapaDe(p) === 'aprovado') o.aprovados++; } });
  prop.forEach(p => { const o = add(p.cliente); if (o) o.propostas.push(p); });
  proj.forEach(p => { const o = add(p.clienteNome); if (o) o.projetos.push(p); });
  return [...mapa.values()].map(c => ({ ...c, situacao: c.doc?.situacao || 'ativo', arquivado: !!c.doc?.arquivado, especial: c.doc?.reconhecimento === 'especial', desde: c.doc?.clienteDesde || '', casa: !!c.doc, projetosN: c.projetos.length }));
}
async function garantirDoc(c) { if (c.doc) return c.doc._id; return salvarDoc('clientes', null, { nome: c.nome, origem: 'comercial', situacao: 'ativo' }, 'cadastrou cliente', c.nome); }
function dependencias(c) {
  const ativos = c.projetos.filter(p => !['concluido', 'cancelado'].includes(p.situacao || 'andamento'));
  const fechadas = c.propostas.filter(p => ['aceita', 'contrato'].includes(p.status));
  const enviadas = c.propostas.filter(p => p.status === 'enviada');
  const entregas = c.projetos.reduce((s, p) => s + (p.entregas || []).length, 0);
  return { ativos, fechadas, enviadas, entregas };
}
async function excluirCliente(c) {
  if (!edita('crm')) return toast('Sem permissão para excluir clientes.', true);
  const d = dependencias(c);
  if (d.fechadas.length || d.ativos.length) {
    const ok = await confirmar({ titulo: 'Este cliente não pode ser excluído agora', texto: `${d.fechadas.length ? `${d.fechadas.length} proposta(s) aceita(s) ou com contrato precisam ser preservadas por obrigação comercial e fiscal.\n` : ''}${d.ativos.length ? `${d.ativos.length} projeto(s) ainda em andamento.\n` : ''}\nVocê pode arquivar o cliente: ele sai das listas e o histórico fica guardado.`, ok: 'Arquivar cliente' });
    if (ok) { await mudarCliente(c, { arquivado: true }, 'arquivou cliente'); toast('Cliente arquivado.', false, { rotulo: 'Desfazer', fn: async () => { await mudarCliente(c, { arquivado: false }, 'desarquivou cliente'); navegar(); } }); return true; }
    return false;
  }
  const avisos = [`Pedidos: ${c.pedidos.length} · Propostas: ${c.propostas.length} · Projetos: ${c.projetos.length} · Arquivos entregues: ${d.entregas}`, 'Pedidos, propostas e projetos NÃO são apagados: continuam no sistema com o nome do cliente.'];
  if (d.enviadas.length) avisos.push(`${d.enviadas.length} proposta(s) enviada(s) e sem resposta continuam abertas.`);
  if (!c.doc) { await garantirDoc(c); limparCache('clientes'); c.doc = (await listar('clientes', true)).find(x => norm(x.nome) === c.k); }
  return paraLixeira('clientes', c.doc, { avisos });
}
async function mudarCliente(c, dados, acao) { const id = await garantirDoc(c); await salvarDoc('clientes', id, dados, acao, c.nome); }

/* ============ Convites da equipe: e-mail (Firebase Auth), WhatsApp e link seguro ============
   O e-mail é enviado pelo próprio Firebase Authentication (link de acesso), sem serviço extra.
   Estados mostrados são só os comprováveis: solicitado, aceito pelo provedor, falhou, convite aceito.
   Entrega na caixa de entrada e devolução não são informadas pelo Firebase: a tela diz isso. */
const MODELO_PADRAO = '*BOAS-VINDAS À BOURBON FILMS*\n\nOlá, {nome}!\n\nVocê recebeu um convite para integrar nossa plataforma de gestão.\n\n*Sua função:* {função}\n\nAcesse seu convite:\n{link_seguro}\n\nEntre com sua conta Google vinculada ao e-mail autorizado ({email}). O convite vale até {validade}.\n\nNa Central Bourbon, você encontrará suas ferramentas, atribuições e permissões.\n\nSeja bem-vindo(a) à equipe!\n\n*Bourbon Films*';
const ESTADO_EMAIL = {
  'nao-enviado': ['E-mail não enviado', 'mute', ''],
  solicitado: ['Envio solicitado', 'info', 'Aguardando resposta do provedor.'],
  'aceito-provedor': ['Aceito pelo provedor', 'ok', 'O Google aceitou e despachou o e-mail. Entrega na caixa de entrada não é informada: peça para conferir também o spam.'],
  falhou: ['Falhou', 'bad', '']
};
const CAUSA_EMAIL = {
  'auth/operation-not-allowed': ['O login por link de e-mail não está ativado no Firebase.', 'Ative em Firebase > Authentication > Sign-in method > E-mail/senha > "Link do e-mail". Enquanto isso, use o WhatsApp.'],
  'auth/unauthorized-continue-uri': ['O domínio do site não está autorizado no Firebase.', 'Inclua bourbonfilms.com.br em Authentication > Settings > Authorized domains.'],
  'auth/invalid-email': ['O e-mail do convite é inválido.', 'Corrija o e-mail criando um novo convite.'],
  'auth/quota-exceeded': ['O limite diário de e-mails do Firebase foi atingido.', 'Tente amanhã ou envie pelo WhatsApp.'],
  'auth/too-many-requests': ['Muitas tentativas seguidas.', 'Aguarde alguns minutos ou envie pelo WhatsApp.'],
  'auth/network-request-failed': ['Sem conexão no momento do envio.', 'Confira a internet e reenvie.']
};
const gerarToken = () => { const a = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789', r = crypto.getRandomValues(new Uint8Array(28)); return Array.from(r, b => a[b % a.length]).join(''); };
const linkConvite = (f) => `${location.origin}${location.pathname.replace(/[^/]*$/, '')}admin.html?convite=${encodeURIComponent(f.token || '')}`;
const telWa = (t) => { let d = String(t || '').replace(/\D/g, ''); if (d.length === 10 || d.length === 11) d = '55' + d; return d.length >= 12 ? d : ''; };
let _modelo = null;
async function modeloConvite() { if (_modelo !== null) return _modelo; try { const s = await S.F.getDoc(docRef('integracoes', 'convite')); _modelo = s.exists() && s.data().modelo ? s.data().modelo : MODELO_PADRAO; } catch { _modelo = MODELO_PADRAO; } return _modelo; }
function preencher(modelo, f) {
  const papel = PAPEIS[f.papel]?.nome || f.papel;
  return modelo.replace(/\{nome\}/g, (f.nome || '').split(' ')[0] || 'tudo bem').replace(/\{funç[aã]o\}|\{funcao\}/g, papel).replace(/\{link_seguro\}/g, linkConvite(f)).replace(/\{email\}/g, f.email || f._id)
    .replace(/\{validade\}/g, f.expiraEm ? new Date(tsMs(f.expiraEm)).toLocaleDateString('pt-BR') : '').replace(/\{quem_convidou\}/g, (f.convidadoPor || '').split('@')[0]).replace(/\u2014/g, ',');
}
async function enviarEmailConvite(f) {
  const ref = docRef('equipe', f._id);
  await S.F.updateDoc(ref, { emailEstado: 'solicitado', emailEm: S.F.serverTimestamp(), emailErro: '', emailTentativas: (f.emailTentativas || 0) + 1 });
  try {
    await S.U.sendSignInLinkToEmail(S.auth, f._id, { url: linkConvite(f), handleCodeInApp: true });
    await S.F.updateDoc(ref, { emailEstado: 'aceito-provedor', emailAceitoEm: S.F.serverTimestamp() });
    auditar('enviou convite por e-mail', 'equipe/' + f._id, 'aceito pelo provedor'); return { ok: true };
  } catch (e) {
    const code = e.code || 'erro'; await S.F.updateDoc(ref, { emailEstado: 'falhou', emailErro: String(code).slice(0, 60) }).catch(() => {});
    auditar('falha no convite por e-mail', 'equipe/' + f._id, code); return { ok: false, code };
  } finally { limparCache('equipe'); }
}
async function abrirWhatsConvite(f) {
  const txt = preencher(await modeloConvite(), f), num = telWa(f.telefone);
  const url = (num ? `https://wa.me/${num}` : 'https://wa.me/') + '?text=' + encodeURIComponent(txt);
  window.open(url, '_blank', 'noopener');
  try { await S.F.updateDoc(docRef('equipe', f._id), { whatsappAbertoEm: S.F.serverTimestamp() }); limparCache('equipe'); } catch {}
  auditar('abriu convite no WhatsApp', 'equipe/' + f._id, num ? 'com número' : 'sem número');
  toast(num ? 'WhatsApp aberto com a mensagem pronta. Confira e toque em enviar: o envio não é confirmado aqui.' : 'WhatsApp aberto sem número: escolha o contato e envie.');
}
const copiar = (t, ok) => navigator.clipboard.writeText(t).then(() => toast(ok), () => toast('Não consegui copiar. Selecione e copie manualmente.', true));

function estadoConvite(f) {
  if (f.status === 'ativo') return [`Convite aceito${f.aceitoEm ? ' em ' + dia(f.aceitoEm) : ''}`, 'ok'];
  if (f.status === 'suspenso') return ['Acesso suspenso', 'warn'];
  if (f.status === 'convidado' && tsMs(f.expiraEm) < Date.now()) return ['Convite expirado', 'bad'];
  return ['Aguardando aceite', 'warn'];
}

          ${pend && ee[2] ? `<p class="cc-note">${esc(ee[2])}</p>` : ''}${pend && causa ? `<div class="cc-warns"><p><b>Causa:</b> ${esc(causa[0])}</p><p><b>O que fazer:</b> ${esc(causa[1])}</p></div>` : ''}
          ${ed && pend ? `<div class="cc-actions cv-acts"><button type="button" class="btn btn--primary" data-a="email">${f.emailEstado && f.emailEstado !== 'nao-enviado' ? 'Reenviar e-mail' : 'Enviar por e-mail'}</button><button type="button" class="btn btn--ghost" data-a="whats">Enviar pelo WhatsApp</button><button type="button" class="btn btn--ghost" data-a="msg">Copiar mensagem</button><button type="button" class="btn btn--ghost" data-a="link">Copiar link de convite</button><button type="button" class="btn btn--ghost" data-a="renovar">Renovar convite</button><a class="btn btn--ghost" href="#/equipe">Alterar função</a><a class="btn btn--ghost" href="#/auditoria">Histórico</a><span class="cc-spacer"></span><button type="button" class="btn btn--danger" data-a="revogar">Revogar convite</button></div>`

          .replace(/(<meta name="twitter:title" content=")[^"]*(")/, `$1${escA(t)}$2`).replace(/(<meta name="twitter:description" content=")[^"]*(")/, `$1${escA(d)}$2`);
        const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([html], { type: 'text/html' })); a.download = l.pg; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);

modulo({
  id: 'saude', titulo: 'Saúde do site', mod: 'conteudo',
  async render(v) {
    v.innerHTML = `<div class="cc-head"><div><h2>Saúde do site</h2><p>Confere páginas, imagens, arquivos pesados e vídeos do portfólio. Roda no seu navegador, a partir do site publicado.</p></div><div class="cc-actions"><button class="btn btn--primary" id="sd-run" type="button">Verificar agora</button></div></div><div id="sd-out"><div class="cc-empty"><b>Nenhuma verificação nesta sessão.</b>Leva menos de um minuto.</div></div>`;
    $('#sd-run').onclick = async () => {
      const b = $('#sd-run'); b.disabled = true; b.textContent = 'Verificando…';
      const out = $('#sd-out'), res = [];
      const vistos = new Set();
      for (const pg of PAGINAS) {
        let d; try { const r = await fetch(pg + '?cc=' + Date.now(), { cache: 'no-store' }); if (!r.ok) { res.push(['bad', pg, `Página responde ${r.status}`]); continue; } d = new DOMParser().parseFromString(await r.text(), 'text/html'); } catch { res.push(['bad', pg, 'Página não abriu']); continue; }
        d.querySelectorAll('img[src]').forEach(im => { if (!im.getAttribute('alt') && im.getAttribute('alt') !== '') res.push(['warn', pg, 'Imagem sem texto alternativo: ' + im.getAttribute('src').slice(0, 60)]); });
        const recursos = [...d.querySelectorAll('img[src],link[rel=stylesheet][href],script[src]')].map(e => e.getAttribute('src') || e.getAttribute('href')).filter(u => u && !/^(https?:|data:|\/\/)/.test(u)).map(u => u.split('?')[0]);
        for (const u of recursos) {
          if (vistos.has(u)) continue; vistos.add(u);
          try { const r = await fetch(u, { method: 'HEAD', cache: 'no-store' }); if (!r.ok) res.push(['bad', pg, `Arquivo não encontrado: ${u}`]); else { const n = Number(r.headers.get('content-length') || 0); if (n > 600 * 1024 && /\.(png|jpe?g|webp|gif)$/i.test(u)) res.push(['warn', pg, `Imagem pesada (${Math.round(n / 1024)} KB): ${u}`]); } } catch { res.push(['bad', pg, 'Falha ao conferir ' + u]); }
        }
      }
      try {
        const tr = (await listar('trabalhos', true)).filter(t => t.status === 'publicado' && t.plataforma !== 'vimeo');
        for (const t of tr) if (!(await checarThumb(t.videoId))) res.push(['bad', 'Portfólio', `Vídeo indisponível no YouTube: ${t.titulo}`]);
        const mk = (await listar('marcas', true)).filter(m => m.status === 'publicado');
        mk.forEach(m => { if ((m.arquivo || '').length > 250e3) res.push(['warn', 'Marcas', `Logo pesado (${Math.round(m.arquivo.length * .75 / 1024)} KB): ${m.nome}`]); if (m.w / Math.max(1, m.hpx) > 7) res.push(['warn', 'Marcas', `Logo muito largo, aparece baixo: ${m.nome}`]); });
      } catch {}
      auditar('verificou saúde do site', 'site', res.length + ' avisos');
      out.innerHTML = `<dl class="cc-kpis"><div class="cc-kpi"><dt>Páginas</dt><dd>${PAGINAS.length}</dd></div><div class="cc-kpi"><dt>Arquivos conferidos</dt><dd>${vistos.size}</dd></div><div class="cc-kpi"><dt>Problemas</dt><dd>${res.filter(r => r[0] === 'bad').length}</dd></div><div class="cc-kpi"><dt>Avisos</dt><dd>${res.filter(r => r[0] === 'warn').length}</dd></div></dl>
      ${res.length ? `<div class="cc-alerts">${res.map(r => `<div class="cc-alert is-${r[0]}"><span>${esc(r[2])}<small>${esc(r[1])}</small></span></div>`).join('')}</div>` : '<div class="cc-empty"><b>Nada encontrado.</b>Páginas, arquivos e vídeos responderam normalmente.</div>'}`;
      b.disabled = false; b.textContent = 'Verificar de novo';
    };
  }
});

      abrirSheet(novo ? 'Convidar pessoa' : (m.nome || m._id), `<form class="cc-form" id="eqf" novalidate>
        ${novo ? '<div class="cc-field"><label for="eq-e">E-mail da conta Google</label><input id="eq-e" type="email" spellcheck="false" autocomplete="off" placeholder="nome@gmail.com"></div>' : `<p class="cc-note">${esc(m._id)}${m.aceitoEm ? ' · entrou pela primeira vez ' + esc(quando(m.aceitoEm)) : ''}</p>`}
        <div class="cc-field"><label for="eq-n">Nome</label><input id="eq-n" value="${attr(m?.nome || '')}" autocomplete="off"></div>
        <div class="cc-field"><label for="eq-tel">WhatsApp <span>para enviar o convite</span></label><input id="eq-tel" inputmode="tel" value="${attr(m?.telefone || '')}" placeholder="(83) 99999-0000" autocomplete="off"></div>
        <div class="cc-field"><label for="eq-p">Papel</label><select id="eq-p">${papeisGeriveis.map(p => `<option value="${p}" ${m?.papel === p ? 'selected' : ''}>${esc(PAPEIS[p].nome)}</option>`).join('')}</select></div>
        <details ${mods ? 'open' : ''}><summary>Permissões específicas</summary><div class="cc-form"><p class="cc-note">Marque só se quiser fugir do padrão do papel.</p><label class="cc-check"><input type="checkbox" id="eq-custom" ${mods ? 'checked' : ''}>Usar permissões específicas</label><div class="cc-chips" id="eq-mods">${Object.entries(MOD_NOMES).filter(([k]) => souOwner || !['equipe', 'auditoria', 'config', 'cultural'].includes(k)).map(([k, n]) => `<label><input type="checkbox" value="${k}" ${(mods || PAPEIS[m?.papel || 'editor'].mods).includes(k) ? 'checked' : ''}><span>${esc(n)}</span></label>`).join('')}</div></div></details>
        <p class="cc-err" id="eq-err" role="alert"></p></form>`,
        `<button class="btn btn--primary" type="button" id="eq-ok">${novo ? 'Criar convite' : 'Salvar'}</button>${!novo ? `${m.status === 'suspenso' ? '<button class="btn btn--ghost" type="button" id="eq-reat">Reativar</button>' : '<button class="btn btn--ghost" type="button" id="eq-susp">Suspender</button>'}${m.status === 'convidado' ? '<button class="btn btn--ghost" type="button" id="eq-reenv">Renovar convite</button>' : ''}${m.modulos ? '<button class="btn btn--ghost" type="button" id="eq-padrao">Restaurar permissões padrão</button>' : ''}<a class="btn btn--ghost" href="#/auditoria">Histórico</a><span class="cc-spacer"></span><button class="btn btn--danger" type="button" id="eq-rev">${m.status === 'convidado' ? 'Cancelar convite' : 'Revogar acesso'}</button>` : ''}`);
      const coletar = () => { const custom = $('#eq-custom').checked; return { nome: $('#eq-n').value.trim(), papel: $('#eq-p').value, modulos: custom ? $$('#eq-mods input:checked').map(i => i.value) : null }; };
      const expira = () => S.F.Timestamp.fromMillis(Date.now() + 7 * 864e5);

          if (novo) {
            const e = $('#eq-e').value.trim().toLowerCase();
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e)) { err.textContent = 'Confira o e-mail.'; return; }
            if (OWNERS.includes(e) || e === S.email) { err.textContent = 'Este e-mail já tem acesso.'; return; }
            if (lista.find(m2 => m2._id === e)) { err.textContent = 'Esta pessoa já está na equipe.'; return; }
            await S.F.setDoc(docRef('equipe', e), { email: e, nome: x.nome, telefone: $('#eq-tel').value.trim().slice(0, 30), token: gerarToken(), emailEstado: 'nao-enviado', papel: x.papel, modulos: x.modulos, status: 'convidado', convidadoPor: S.email, convidadoEm: S.F.serverTimestamp(), expiraEm: expira() });

            fecharSheet(); limparCache('equipe'); toast('Convite criado. Escolha como enviar: e-mail ou WhatsApp.'); ir('convites/' + e);
          } else {
            if (x.papel !== m.papel && !(await confirmar({ titulo: 'Alterar o papel?', texto: `${m.nome || m._id} passa de ${PAPEIS[m.papel]?.nome} para ${PAPEIS[x.papel].nome}. Vale a partir da próxima ação.`, ok: 'Alterar' }))) return;
            await S.F.updateDoc(docRef('equipe', m._id), { nome: x.nome, telefone: $('#eq-tel').value.trim().slice(0, 30), papel: x.papel, modulos: x.modulos });
            auditar('alterou permissões', 'equipe/' + m._id, x.papel + (x.modulos ? ' + ' + x.modulos.join(',') : ''));
            fecharSheet(); limparCache('equipe'); toast('Acesso atualizado.'); navegar();
          }
        } catch (er) { falha(er); }
      };
      if (novo) return;
      const muda = async (dados, acao, titulo, texto, perigo = false) => { if (!(await confirmar({ titulo, texto, ok: 'Confirmar', perigo }))) return; try { await S.F.updateDoc(docRef('equipe', m._id), dados); auditar(acao, 'equipe/' + m._id); fecharSheet(); limparCache('equipe'); toast('Feito.'); navegar(); } catch (er) { falha(er); } };
      if ($('#eq-susp')) $('#eq-susp').onclick = () => muda({ status: 'suspenso' }, 'suspendeu acesso', 'Suspender acesso?', 'A pessoa perde o acesso a qualquer dado na próxima ação, mesmo com a sessão aberta.', true);
      if ($('#eq-reat')) $('#eq-reat').onclick = () => muda({ status: 'ativo' }, 'reativou acesso', 'Reativar acesso?', 'A pessoa volta a acessar com o mesmo papel.');
      if ($('#eq-padrao')) $('#eq-padrao').onclick = () => muda({ modulos: null }, 'restaurou permissões padrão', 'Restaurar permissões padrão?', `Volta a valer o acesso padrão de ${PAPEIS[m.papel]?.nome}: ${PAPEIS[m.papel]?.mods.map(k => MOD_NOMES[k]).join(', ')}.`);
      if ($('#eq-reenv')) $('#eq-reenv').onclick = () => muda({ expiraEm: expira(), token: gerarToken(), emailEstado: 'nao-enviado' }, 'renovou convite', 'Renovar convite?', 'Gera um link novo, válido por 7 dias. Links enviados antes deixam de funcionar. Depois envie de novo em Convites da equipe.');
      $('#eq-rev').onclick = async () => {
        if (!(await confirmar({ titulo: m.status === 'convidado' ? 'Cancelar convite?' : 'Revogar acesso?', texto: 'A ficha é apagada e a pessoa não entra mais. Para voltar, será preciso um novo convite.', ok: 'Revogar', perigo: true, digitar: 'REVOGAR' }))) return;
        try { await S.F.deleteDoc(docRef('equipe', m._id)); auditar('revogou acesso', 'equipe/' + m._id); fecharSheet(); limparCache('equipe'); toast('Acesso revogado.'); navegar(); } catch (er) { falha(er); }
      };
    };
    if ($('#eq-novo')) $('#eq-novo').onclick = () => form(null);
    $$('[data-m]', v).forEach(b => b.onclick = () => edita('equipe') ? form(lista.find(m => m._id === b.dataset.m)) : null);
  }
});

  async render(v) {
    const cols = ['pedidos', 'propostas', 'clientes', 'projetos', 'trabalhos', 'marcas', 'depoimentos', 'instagram', 'site', 'equipe', 'integracoes'];
    v.innerHTML = `<div class="cc-head"><div><h2>Dados e backup</h2><p>Exporte tudo em JSON, um formato aberto. Guarde o arquivo em local seguro: ele contém dados de clientes.</p></div></div>
      <div class="cc-cols"><section class="cc-panel"><h3>Exportar</h3><p class="cc-note" style="margin-bottom:12px">${cols.length} coleções. Leva alguns segundos.</p><button class="btn btn--primary" type="button" id="bk">Baixar backup completo</button></section>
      ${S.papel === 'owner' ? `<section class="cc-panel"><h3>Limpeza prevista na privacidade</h3><p class="cc-note" style="margin-bottom:12px">A política do site diz que pedidos que não viram projeto são apagados em até 12 meses. Isto apaga pedidos recusados, arquivados ou sem briefing com mais de 12 meses.</p><button class="btn btn--danger" type="button" id="lp">Apagar pedidos antigos</button></section>` : ''}</div>`;
    $('#bk').onclick = async () => {
      const b = $('#bk'); b.disabled = true; b.textContent = 'Exportando…'; const out = { exportadoEm: new Date().toISOString(), por: S.email };
      for (const c of cols) { try { out[c] = await listar(c, true); } catch { out[c] = 'sem permissão'; } }
      const blob = new Blob([JSON.stringify(out, (k, v2) => (v2 && v2.toMillis) ? new Date(v2.toMillis()).toISOString() : v2, 2)], { type: 'application/json' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `bourbon-backup-${new Date().toISOString().slice(0, 10)}.json`; a.click();
      auditar('exportou backup', 'dados'); b.disabled = false; b.textContent = 'Baixar backup completo';
    };
    if ($('#lp')) $('#lp').onclick = async () => {
      const lim = Date.now() - 365 * 864e5;
      const velhos = (await listar('pedidos', true)).filter(p => ['recusado', 'arquivado', 'identificado'].includes(etapaDe(p)) && tsMs(p.criadoEm) < lim);
      if (!velhos.length) return toast('Nenhum pedido com mais de 12 meses para apagar.');
      if (!(await confirmar({ titulo: `Apagar ${velhos.length} pedidos antigos?`, texto: 'Não dá para desfazer. Exporte um backup antes se precisar.', ok: 'Apagar', perigo: true, digitar: 'APAGAR' }))) return;
      try { for (const p of velhos) { await S.F.updateDoc(docRef('pedidos', p._id), { excluido: true, excluidoEm: S.F.serverTimestamp(), excluidoPor: S.email, motivoExclusao: 'retenção: identificação sem briefing' }); await S.F.deleteDoc(docRef('pedidos', p._id)); } limparCache('pedidos'); auditar('apagou pedidos antigos', 'pedidos', String(velhos.length)); toast('Pedidos apagados.'); } catch (e) { falha(e); }
    };
  }
});

iniciar();

</script>
</body>
</html>
